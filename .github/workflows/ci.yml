name: ci

# Every gate here already existed as a command someone had to remember to run. Two of them
# were failing on the default branch when this workflow was first added — a stamp target
# that had never been created and a stale manifest — which is the whole argument for the
# file.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately. The runtime ships a PowerShell runner and generates a POSIX
        # one, the workspace checks shell out to whichever the platform has, and path
        # handling differs where it matters most (locks, session dirs). A single-OS run
        # would pass while half the product stayed untested.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the research check resolves every commit a decision names.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # The runtime is pure stdlib with no dependency file to pin against, so the
          # Python version is the only thing to hold steady. That claim is not left as
          # folklore: the `deps` suite fails the build if shipped code ever imports
          # something outside the stdlib, which is the point at which a lockfile WOULD
          # be needed. A constraints file listing nothing would document the claim
          # without testing it.
          python-version: '3.13'

      - name: Bash for the hook launchers
        # The hooks run as bash launchers on every OS (Git Bash on Windows), and
        # tests/checks/hook_contract.py fails closed without one. `shell: bash` is Git Bash
        # on windows-latest, so this step failing names the missing prerequisite instead
        # of the suite failing later on an assertion.
        shell: bash
        run: |
          bash --version | head -n 1
          for py in python3 python; do command -v "$py" >/dev/null && "$py" -c 'import sys; print(sys.executable, sys.version.split()[0])' || true; done

      - name: Development dependencies
        # Development only (requirements-dev.txt): PyYAML for the research-record check.
        # The runtime stays stdlib-only — the `deps` step below still proves it, because the
        # one tool that imports yaml does so under an ImportError guard.
        run: python -m pip install -r requirements-dev.txt

      - name: Research records follow their schema
        # --git: every commit a decision names exists in this repository.
        run: python tools/maintain/check_research.py --git

      - name: Version stamp is in sync
        run: python tools/maintain/stamp_version.py --check

      - name: Manifest matches dist/
        run: python tools/maintain/gen_manifest.py --check

      - name: Runtime is stdlib-only
        # Its own step rather than only inside the suite: this is the gate that decides
        # whether the absence of a lockfile is still correct, and a reader scanning the
        # job list should be able to see it hold.
        run: python tests/run.py --only deps

      - name: Unit and integration suites
        # --keep-going so one failure does not hide the rest; the scenario suite is still
        # internally sequential, so it stops at its own first assertion either way.
        # --record writes the outcome to the workspace quality stream, so `--command
        # report` can show a test pass rate over time rather than only the latest run.
        run: python tests/run.py --keep-going --record .

      - name: End-to-end (local + integrity + installer)
        # Without --full: no provider CLI is invoked and no quota is spent. The delegated
        # checks stay opt-in because they cost real money and need credentials this
        # workflow deliberately does not hold.
        run: python tools/e2e/e2e.py
