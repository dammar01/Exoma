name: ci

# Every gate here already existed as a command someone had to remember to run. Two of them
# were failing on the default branch when this workflow was first added — a stamp target
# that had never been created and a stale manifest — which is the whole argument for the
# file.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  # publish.yml calls this file on a release tag, so the wheel PyPI receives is the one
  # these jobs built and smoke-tested — not a second build nobody checked.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Run the full source suite on every supported OS. Hooks and generated runners
        # use Bash (Git Bash on Windows), while locks, process identity and paths differ.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The runtime is pure stdlib with no dependency file to pin against, so the
          # Python version is the only thing to hold steady. That claim is not left as
          # folklore: the `deps` suite fails the build if shipped code ever imports
          # something outside the stdlib, which is the point at which a lockfile WOULD
          # be needed. A constraints file listing nothing would document the claim
          # without testing it.
          python-version: ${{ matrix.python }}

      - name: Bash for the hook launchers
        # The hooks run as bash launchers on every OS (Git Bash on Windows), and
        # tests/checks/hook_contract.py fails closed without one. `shell: bash` is Git Bash
        # on windows-latest, so this step failing names the missing prerequisite instead
        # of the suite failing later on an assertion.
        shell: bash
        run: |
          bash --version | head -n 1
          for py in python3 python; do command -v "$py" >/dev/null && "$py" -c 'import sys; print(sys.executable, sys.version.split()[0])' || true; done

      - name: Version stamp is in sync
        run: python tools/maintain/stamp_version.py --check

      - name: Manifest matches dist/
        run: python tools/maintain/gen_manifest.py --check

      - name: Runtime is stdlib-only
        # Its own step rather than only inside the suite: this is the gate that decides
        # whether the absence of a lockfile is still correct, and a reader scanning the
        # job list should be able to see it hold.
        run: python tests/run.py --only deps

      - name: Unit and integration suites
        # --keep-going so one failure does not hide the rest; the scenario suite is still
        # internally sequential, so it stops at its own first assertion either way.
        # --record writes the outcome to the workspace quality stream, so `--command
        # report` can show a test pass rate over time rather than only the latest run.
        run: python tests/run.py --keep-going --record .

      - name: End-to-end (local + integrity + installer)
        # Without --full: no provider CLI is invoked and no quota is spent. The delegated
        # checks stay opt-in because they cost real money and need credentials this
        # workflow deliberately does not hold.
        run: python tools/e2e/e2e.py

  posix-permissions:
    name: POSIX permissions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Existing private and executable modes survive replacement
        run: python tests/run.py --keep-going --only atomic-helpers --only codex-auto-review-context

  dist:
    name: dist (${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.manager }})
    runs-on: ${{ matrix.os == 'windows-latest' && fromJSON(vars.EXOMA_WINDOWS_UPDATE_RUNNER || '"windows-latest"') || matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The source suites above import from src/. Only an installed wheel proves the
        # runtime finds its _bundle through the package path, and that path is
        # platform-shaped (Scripts/ vs bin/, drive letters), so all three OSes again.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The package floor (pyproject requires-python) and the newest tested Python: the
        # built wheel and sdist must install and run on the oldest interpreter they admit.
        python: ['3.11', '3.13']
        manager: ['uv', 'pipx', 'pip']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        run: uv build

      - name: Install pipx for its native update gate
        if: matrix.manager == 'pipx'
        run: uv tool install pipx

      - name: Shared self-update replaces A with B without recovery
        env:
          EXOMA_UPDATE_HANDOFF_SMOKE: '1'
          EXOMA_UPDATE_SMOKE_MANAGER: ${{ matrix.manager }}
          EXOMA_UPDATE_SMOKE_REPORT: ${{ runner.temp }}/exoma-handoff-report.json
        run: python tests/run.py --only self-update --traceback --update-artifacts handoff

      - name: Preserve native handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.manager }}
          path: |
            ${{ runner.temp }}/exoma-handoff-report.json
            ${{ runner.temp }}/exoma-handoff-report.logs
          if-no-files-found: warn

      - name: Wheel in a clean environment
        # RELEASE.md step 6 "the wheel in a clean environment", run instead of remembered.
        # Every home variable points at a temp dir so the dry run cannot read or describe
        # the runner's real ~/.claude.
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$PWD/dist"
          tmp="$(mktemp -d)"
          python -m venv "$tmp/venv"
          bin="$tmp/venv/bin"; [ -d "$bin" ] || bin="$tmp/venv/Scripts"
          "$bin/python" -m pip install --quiet dist/exoma-*-py3-none-any.whl
          export HOME="$tmp/home" USERPROFILE="$tmp/home" AGENT_HOME="$tmp/home" EXOMA_HOME="$tmp/home"
          mkdir -p "$HOME" "$tmp/project"
          cd "$tmp"
          "$bin/python" -c 'import exoma, exoma._update_worker, exoma.update_metadata, pathlib; b = pathlib.Path(exoma.__file__).parent / "_bundle"; assert (b / "manifest.json").is_file(), b; print("bundle", b)'
          "$bin/exoma" --version
          "$bin/exoma" install claude --no-input
          "$bin/exoma" init --work-dir "$tmp/project"
          bash "$tmp/project/.workflow/inspect.sh" --session dist-smoke
          python -m venv "$tmp/sdist-venv"
          sdist_bin="$tmp/sdist-venv/bin"; [ -d "$sdist_bin" ] || sdist_bin="$tmp/sdist-venv/Scripts"
          "$sdist_bin/python" -m pip install --quiet "$artifacts"/exoma-*.tar.gz
          "$sdist_bin/python" -c 'import exoma, exoma._update_worker, exoma.update_metadata, pathlib; b = pathlib.Path(exoma.__file__).parent / "_bundle"; assert (b / "manifest.json").is_file(), b'
          "$sdist_bin/exoma" --version

      - uses: actions/upload-artifact@v4
        # One publish artifact: upload-artifact@v4 refuses a second upload under the same name.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && matrix.manager == 'uv'
        with:
          name: dist
          path: dist/
          retention-days: 7
