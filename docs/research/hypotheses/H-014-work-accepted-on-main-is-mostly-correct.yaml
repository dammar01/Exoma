schema_version: 3
id: H-014
title: Work that entered main in real use is mostly correct and of acceptable quality
date: 2026-10-04
status: closed
outcome: supported
provenance:
  type: observed
  confidence: low

statement: |
  Among the real coding tasks CASE-012 counts as solved (their lines entered branch main),
  a reviewed sample is mostly correct and of acceptable engineering quality, so acceptance
  on main can stand in for task success in the real-use benchmark.
motivation: |
  CASE-012 grades by what the maintainer accepted, because verify verdicts rarely pass
  (CASE-009) and there is no behavioural verifier for private projects. Acceptance is not
  correctness: code can enter main and be wrong, or be rewritten for taste. Senior SWE-bench
  separates the two with a taste judge; this hypothesis asks how far apart they are here.
sources: [CASE-012]
external_sources:
  - https://snorkel.ai/blog/senior-swe-bench-evaluating-coding-agents-like-senior-engineers/
counter_evidence: []
expected_effect: |
  Most reviewed solved tasks have a correct root cause and stay within scope; the clean
  solved ones score better than those fixed within 24 hours.

success_criteria:
  primary_metric: reviewed_correct_share
  # Threshold fixed by the maintainer on 2026-10-24, before any EXP-008 label was written.
  supported_when: "reviewed_correct_share >= 0.80 on the solved sample, and clean solved >= fixed-within-24h solved on the quality score"
  rejected_when: "reviewed_correct_share < 0.80, or no difference between clean and fixed solved"
  data_recorded: true
  data_source: EXP-008 labels of the sampled tasks (local); aggregates only in the record

experiments: [EXP-008]
limitations:
  - "EXP-008 (2026-10-24, 20 solved tasks): reviewed_correct_share 1.00 (20 / 20, Wilson 95% [0.84, 1.00]); clean 1.92 vs fixed 1.75 mean quality score. Maintainer labels alone: 15 / 15, Wilson [0.80, 1.00]."
  - "Pre-registration: threshold 0.80 fixed by the maintainer on 2026-10-24, before any label was written."
  - The reviewer is the maintainer who accepted the work; acceptance and review share one person's judgement. The result sits at the ceiling (no task judged incorrect).
  - 6 of 23 items were labelled by the agent, which knew this hypothesis, after the maintainer stopped the interview.
  - A sample of about 20 tasks detects only large differences.
  - Rubric items such as maintainability are judgements, not measurements.
related_decisions: []

disposition:
  implementation_status: not_applicable
  validation_status: not_validated
questions: [RQ-02]
