schema_version: 3
id: RQ-17
question: "How does task outcome change as the number of delegated agent executions increases: increasing, saturating, or degrading after a task-dependent point?"
date: 2026-10-05
status: unanswered
what_exists: |
  The number of delegated executions per task can be counted after the fact from usage rows
  grouped by task telemetry, and task outcome from `tools/maintain/measure_task_outcomes.py`
  (reached main, needed a fix within 24 hours; CASE-012). In real use N is whatever the work
  needed, so it is confounded with task difficulty and type; no run fixes the task and varies
  N, which is what the question needs.
records: []
notes: |
  The charter's CQ2 (docs/research/CHARTER.md), adopted 2026-10-05. The aim is a useful
  decomposition range per task type, not one optimal number of agents.

  Draft records: H-016. Serves RQ-16 as its scaling curve: the marginal return
  Q(N) - Q(N-1) against C(N) - C(N-1). Related literature: LIT-001.

  CASE-012's table by delegated calls per task (tasks with 3-5 calls solved more often than
  tasks with 6 or more) is the correlation this question cannot use as an answer: larger tasks
  drew more calls, as CASE-012 states. It is not an optimal number or a useful range, and no
  record or prompt may present it as one before an experiment fixes the task and varies N.

  CASE-011 and CASE-012 bear on this question but are not listed under `records`: a listed
  record must name this question back (CONTRACT.md section 16), and both are frozen records
  that name the questions they were written for. They are cited above as what exists.

  Maintainer interview 2026-10-23 (critical_interview, sanitized summary; status unchanged): the
  maintainer expects more delegated agents to help up to a point and then stop helping, consistent
  with a saturating curve; no measurement backs it yet.
