what_exists: |
  Records are schema-checked YAML (DEC-011); since DEC-017 research questions are records too,
  and a version-2 record names the questions it serves, checked both ways by
  tools/maintain/check_research.py.
records: [DEC-011, DEC-017, DEC-019, DEC-026, DEC-027, DEC-036, DEC-038, DEC-047]
decision:
  date: 2026-10-03
  method: critical_interview
  summary: |
    Answered by the maintainer. Records stay traceable because they are schema-checked YAML
    (DEC-011, validated) whose questions and records name each other both ways, enforced by
    the validator (DEC-017, observed). Markdown was left because it was too free to show the
    problem, the choice made, and why it was made.
notes: |
  The maintainer's rule: every research record must have a question or evidence that leads to
  a change in this project.

  Maintainer interview 2026-10-23 (critical_interview, sanitized summary; status unchanged): the
  maintainer found the research records decisive for the day's DEC-072 decision, wants them kept
  light, and finds a rule's reason with an agent's help rather than unaided. The existing decision
  stands.
