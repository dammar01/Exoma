schema_version: 3
id: RQ-06
question: "Does persistent repository knowledge reduce repeated exploration and change later behavior?"
date: 2026-09-29
status: unanswered
what_exists: |
  Fact store (recurrence and durable facts), anchored evidence reuse, graph leads, promoted
  knowledge; facts and promoted knowledge are injected into exploration and reasoning prompts,
  but there is no outcome to update loop and the effect is not measured.
records: [CASE-004, CASE-009, DEC-016, DEC-035, DEC-040, DEC-044, DEC-065, DEC-066, DEC-070, H-021, EXP-013, H-023, EXP-016]
notes: |
  Converted from the questions.md table on 2026-09-29 (DEC-017); the question was first
  recorded before 3.7.3.

  Knowledge that never changes later behavior is only an archive. The question is not whether
  knowledge is stored but whether it is operationalized. A first measurable signal already
  exists: usage rows record evidence reuse and avoided provider calls, so their rate can be
  read before any new mechanism is proposed. In the maintainer's telemetry from 2026-08-15 to
  2026-09-27 it read zero (CASE-004).

  Draft records: H-004. DEC-016 (tracked, commit f6edbef) treats proven browser
  selectors as reused knowledge.

  Since 3.9.0 the fact lifecycle is counted per call (DEC-066, `runtime.fact_lifecycle@1`);
  H-021 and EXP-013 replayed the retrieval defaults against it (rejected: the weighted rule
  served more facts and fewer were cited); H-023 and EXP-016 traced the excess to the
  per-role limit. DEC-070 records served facts per call so later replays need not be
  counterfactual. DEC-072 (draft) proposes the limit change.
