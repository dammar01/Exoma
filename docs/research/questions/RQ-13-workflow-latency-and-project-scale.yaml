schema_version: 3
id: RQ-13
question: "How does workflow latency — delegated calls and the hooks around them — grow with the size of the active project, and which component dominates?"
date: 2026-09-29
status: unanswered
what_exists: |
  Usage rows record `duration_seconds` and provider token counts per delegated call, and
  from usage contract version 3 the graph lookup's status and time (`graph_status`,
  `graph_ms`). The graph-refresh Stop hook writes a `graph_refresh` row with its own timing
  since DEC-012, and runtime lock guards accumulate one per session. Nothing records project
  size next to latency at run time; one-off measurements exist for the hook on two projects
  (CASE-008) and for verify spread and the lookup on every local project (CASE-010).
records: [CASE-006, CASE-007, CASE-008, CASE-010, DEC-012, DEC-013, DEC-021, DEC-025, DEC-029, DEC-030, DEC-033, DEC-037, DEC-042, DEC-054]
notes: |
  The maintainer feels latency after execute, in execute+verify turns, in verify alone, and
  when the main agent runs graphify itself; verify is slower on a large Laravel backend than
  on a frontend project (CASE-006). Verify alone never runs the hook, so the hook cannot be
  the whole answer. Measurements come from a large Laravel project, not from this repository,
  whose size does not represent the problem.

  First figures (CASE-006, CASE-008): delegated calls take 342-851 s; the hook's scan 2-3.5 s on
  both projects whatever their code size; `graphify update` 43-44 s on the large Laravel graph
  and under 2 s on the frontend. The hook is minor next to delegated calls unless graphify
  runs.

  CASE-010, across all local projects: verify duration spreads 34-299% of its median within
  a project; the lookup's file ranking rises with node count to 9.1 s at 34.6k nodes, 9% of
  that project's median verify; about half of verify replies name a test command.

  Draft records: H-008 (cached input and thread continuation), H-009 and EXP-004 (graph cost
  inside verify), H-010 (reasoning effort).
  DEC-012 moved the graph refresh out of the turn (tracked, commit 98449fe). DEC-013 lets
  `clean` remove the guards of dead sessions (tracked, commit 2dd7d7e). From commit 2dd7d7e
  verify-browser rows also record whether a refresh ran beside them (`graph_status`
  `refreshing`/`available`/`absent`).

  Research charter (docs/research/CHARTER.md, adopted 2026-10-05): the latency L of the
  charter's cost vector, and the runtime part of its CQ4 coordination overhead
  (continuations, verification, hooks), are measured under this question. The charter's
  primary question is RQ-16.
