schema_version: 3
id: DEC-049
title: A provider thread id is kept or its loss is named; integrity paths fail closed
date: 2026-10-06
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Pre-freeze static analysis of failure paths, confirmed by code reading and a suite failure
problem: |
  Several failure paths reported success or nothing:
  - codex and agy report their thread id mid-run through a callback whose failure the
    adapters swallow. The write behind it (`SessionManager._save`: fixed `<id>.tmp`, bare
    replace) fails on Windows while any reader holds the file, and the executor then skipped
    the post-run save because the id was already set on the dict. The thread was lost silently.
  - JobManager wrote job records the same way; a verify run's suite failed once with
    WinError 5 on that replace.
  - Bundle integrity dereferenced manifest entries unchecked, `install --check` never visited
    manifest entries whose dist source was deleted, and e2e artifact scrubbing skipped a file
    it could not read and left it on disk unscrubbed.
decision: |
  - Session and job records are written through `atomic_write_json` (unique temp name;
    `os.replace` retried on `PermissionError` with a short bounded backoff).
  - The executor writes the session record before spawning a provider and returns
    `session_capture_failed` (task not started) when it cannot; the provider bind is guarded
    the same way. A mid-run write failure is retried after the run; if that fails the result
    stays `ok` with `meta.session_persisted: false` and `meta.session_persist_error`.
  - Bundle integrity stops with a named `error` and `malformed` indices for an entry that is
    not an object, lacks `path`, or lacks a 64-hex `sha256`; doctor makes it an issue.
  - `install --check` and `--apply` treat a manifest entry without a dist source as stale.
  - A text artifact that cannot be scrubbed is deleted and listed in
    `meta.e2e.artifacts_unscrubbed`; when anything is left behind every artifact of that
    attempt is withheld (`pruned_reason: unscrubbed`, `meta.e2e.artifacts_unsafe`) and the
    reviewer's evidence names no directory path.
rationale: |
  Preventing the Windows sharing violation beats choosing how to report it; the remaining
  paths are named rather than swallowed. Failing before the provider runs costs nothing;
  failing after would discard paid evidence, so a late loss keeps the answer and states the
  consequence. An integrity check that cannot read its input must not vouch for anything.
alternatives:
  - option: Return session_capture_failed after a mid-run persistence failure (as opencode does before its run)
    rejected_because: Discards evidence already paid for and does not bring the thread back.
  - option: Keep the answer and continue silently
    rejected_because: The next call or recovery then starts from nothing with no explanation.
  - option: Convert every hand-rolled temp-and-replace writer in the runtime
    rejected_because: Out of the freeze scope; about ten other writers remain (limitations).
evidence: []
evidence_notes: |
  `tests/checks/session_persistence.py` (held file outlasted by retry; mid-run failure saved
  after the run; double failure named; unwritable storage refused before the provider runs),
  `tests/checks/manifest.py` malformed entries, `tests/checks/installer_stale.py` deleted
  source, `tests/checks/e2e_redact.py` write, unlink and listing failures. Delegated verify
  rounds 1-5 on the commit's contents: three blocking findings fixed before commit; final
  review DONE with runtime suite PASS (303.5 s). The real-world sharing violation was not
  reproduced on purpose; it was observed once as a JobManager suite failure.
implementation:
  version: 3.8.1
  commits: [895aa6fc459f831014cc3a6658c73b930b231f8c]
  components:
    - core/workspace/workspace_paths.py (replace retry)
    - core/workspace/session_manager.py (atomic_write_json, ensure_writable)
    - core/jobs/job_manager.py (atomic_write_json for job and side records; provider-neutral recovery text)
    - core/provider/executor.py (preflight, guarded bind, post-run retry, session_persisted)
    - core/audit/bundle_integrity.py, installer/check.py
    - core/evidence/e2e/redact.py, runner.py, classify.py, normalize.py
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    Unit and scenario checks simulate each failure; no real run has hit a persistence
    failure or an unscrubbable artifact since the change.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only provider-threads --only session-persistence --only manifest --only manifest-malformed` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - A lost thread or an unsafe artifact is named instead of silent; a held file no longer fails a write.
  worse:
    - A permanently failing write now waits about 1.5 s of retries before raising.
    - An attempt with one unscrubbable file loses all its artifacts.
limitations:
  - About ten other runtime writers (fact store, graph index, e2e knowledge, installer ledger and others) still use their own temp-and-replace without retry.
  - The session_persisted false flag can go stale if a later save in main.py succeeds.
  - A file that could be neither scrubbed nor deleted stays on disk; it is only withheld from the report and reviewer.
revisit_when:
  - A sharing-violation failure appears in another writer.
  - Real runs report session_persisted false.
questions: [RQ-07a]
