schema_version: 3
id: DEC-060
title: /.commit stages targeted paths itself, skips secret-looking names, and commits only on yes
date: 2026-10-18
status: accepted
provenance:
  type: direct
  confidence: medium
  basis: maintainer request to make /.commit stage on its own and shorter, with the untracked-file and install choices made by the maintainer
problem: |
  `/.commit` stopped with "stage first" whenever nothing was staged, so every commit needed a
  manual `git add` before the skill could do anything. Making it stage on its own moves a
  responsibility from the human to main_agent, and a blind `git add -A` can sweep secrets or
  unrelated files into a commit.
decision: |
  `skills/commit.md` keeps an existing staged set as is. With nothing staged, main_agent lists
  changed tracked files (`git diff --name-only`) and untracked files Git does not ignore
  (`git ls-files --others --exclude-standard`), both with `core.quotePath=false`, and stages
  them with `git add -- <path...>`, one quoted path per argument, never `-A` or `.`. Names that
  look like secrets are skipped, matched case-insensitively: `.env*` except
  example/sample/template, `*.pem`, `*.key`, `*.p12`, `*.pfx`, `id_rsa*`, `id_ed25519*`,
  `*credential*`, `*secret*`. The output shows staged, newly tracked and skipped paths with the
  message; only `yes` commits, and `no` unstages only what the skill staged with
  `git reset -q --`. The skill stays local: second_agent bundles have no counterpart and keep
  denying `git add`/`git restore`.
rationale: |
  Including untracked files was the maintainer's choice; the separate "untracked" list and the
  confirmation step keep that visible before anything is recorded. Case-insensitive matching
  follows Windows and macOS filesystems, where `.ENV` is `.env`. `git reset -q --` replaces
  `git restore --staged`, which fails with "could not resolve HEAD" in a repository without a
  commit; `git reset` does not.
alternatives:
  - option: Stage tracked files only (`git add -u`) and list untracked files
    rejected_because: The maintainer chose to include untracked files that are not ignored and not secret-looking.
  - option: Keep "stage first, then STOP"
    rejected_because: The request was to remove the manual staging step.
  - option: Leave the staging in place when the user answers no
    rejected_because: The skill would leave a side effect the user declined.
evidence: [DEC-055]
evidence_notes: |
  Verified in three delegated /.verify rounds on the working tree (OS-agnostic, provider/model-
  agnostic, final): round 1 found the case-sensitive skip list and unquoted paths, round 2 the
  unborn-repository unstage, both fixed. A throwaway repository confirmed `git restore --staged`
  exits 128 before the first commit while `git reset -q --` exits 0. The skill is a prompt
  contract; no test executes it. The same change aligned tools/maintain/measure_graph_hook.py
  with DEC-055 (the hook's Python scan instead of the retired PowerShell scans), checked by
  metrics-contract; that is maintenance under DEC-055, not part of this decision.
implementation:
  version: 3.8.4
  commits: [1d43cbe]
  components:
    - dist/config/claude/skills/commit.md (staging, secret skip list, yes/no, reset on no)
    - dist/manifest.json (regenerated)
    - docs/reference.md (prompt-layer contracts), docs/team-guide/whats-included.md
disposition:
  implementation_status: implemented
  validation_status: observed
validation:
  summary: |
    Two live /.commit runs on this repository on Windows staged and committed without a manual
    staging step or a correction. The full suite passes with the regenerated manifest
    (bundle-sync, manifest, installer suites). Not run on Linux or macOS.
  runs:
    - {date: 2026-10-18, job_id: commit-251acd7, description: live /.commit on this repository staged and committed 251acd7 on Windows without manual staging, clean: true}
    - {date: 2026-10-18, job_id: commit-18fda9e, description: live /.commit on this repository staged and committed 18fda9e on Windows without manual staging, clean: true}
trade_offs:
  better:
    - A commit needs no manual staging step
    - Secret-looking names are skipped and shown, whatever their case
  worse:
    - Untracked files that are not ignored are proposed for the commit; the user must read the list
    - The skip list is a prompt rule, not a scanner; a secret under an ordinary name is staged
limitations:
  - Filenames containing a newline are ambiguous in the listing (no NUL-delimited output)
  - Enforcement is main_agent's; no hook checks what it stages
revisit_when:
  - A commit proposed by the skill includes a file the user did not mean to commit
  - The runtime gains a secret scanner that the skill could call instead of the name list
questions: [RQ-10]
