schema_version: 3
id: DEC-038
title: An export checks project names at any length, and keys under a per-project map must be project labels
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: high
  basis: Branch review of DEC-036 against main, and a maintainer interview on who reads the export and how projects are named
problem: |
  DEC-036 matched project names only when longer than two characters, so a project folder
  named with one or two letters (`ui`, `db`) was never checked, and it stated that keys are
  not checked for names. The maintainer's projects include two-letter names, common words and
  client or product names, and the export is meant to be shown in public documentation. A
  producer that keyed a per-project map by folder name, by a bug or a later change, would have
  published those names.
  `tool_commit` read `git status` without its exit code, so a status that failed with empty
  output stamped a bare hash, claiming a clean tree it never checked.
decision: |
  Every contributing project name is matched as whole words over data values, at any length.
  Under `per_project` and `by_project` every key must have the shape of a label the tools write
  (`P` or `Project ` followed by capital letters); anything else is refused naming the map,
  never the key. Other keys stay field names and are not matched against names. `tool_commit`
  returns null when `git status` exits nonzero.
rationale: |
  The label shape is an allowlist on the one place where keys are data, so it refuses a folder
  name whatever its length without matching labels against names that share a letter with them
  (`Project A` against a project named `a`). Whole-word matching keeps short names from
  refusing ordinary words (`ui` does not match `build`).
alternatives:
  - option: Match project names against every key as well as every value
    rejected_because: Structural keys such as `main_heads_sha256` would refuse exports from a project named `main`.
  - option: Rely on the producers' anonymous labels and keep the validator as it was
    rejected_because: The validator is the last guard before a public file; a producer change would leak names with nothing to stop it.
evidence: [DEC-036, DEC-027]
evidence_notes: |
  `tests/checks/metrics.py` (`metrics-contract`): names `a`, `ab` and `ui` are refused in
  values and do not refuse `build-quick`; keys `ui`, `shop-api`, `acme`, `Project ab` and `PA1`
  are refused under both maps; labels `PA`, `PAB` and `Project A` pass with projects named `a`
  and `ab`; a failed `git status` stamps no commit. Interview answers are sanitized: no project
  or client name is recorded.
implementation:
  version: 3.8.1
  commits: [56c2a64766e3966d21c139458a24cab7c69b84ab]
  components:
    - core/audit/metrics.py (names at any length, label-shaped keys under per-project maps, tool_commit status exit)
    - docs/evaluation/metrics.md (export and provenance rules)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The metrics suite passes. No export has been produced from real projects since the change.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only metrics-contract` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - A short project name or a folder name used as a map key cannot reach a shared export.
  worse:
    - A value that holds a short project name as a word (a project named `api` and a value `api`) is refused.
limitations:
  - Keys outside the two named maps are still field names; a new per-project map under another name is not covered until added.
revisit_when:
  - A real export is refused for a short name that is not identifying, or a producer adds another per-project map.
revises: [DEC-036]
questions: [RQ-02, RQ-15]
