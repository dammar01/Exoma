schema_version: 3
id: DEC-027
title: Any user measures their own use with the offline tools; a sanitized export may leave the machine, and a usage row belongs to one transcript
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Maintainer critical interview 2026-10-04 (sanitized below); DEC-026 inventory
problem: |
  DEC-026 made the measure tools stamp their figures and stated that real-use figures are
  recountable on the maintainer's machine only. The maintainer then asked that the same tools
  be usable by anyone who installs the workflow. Three gaps stood in the way: the tools' own
  text addressed the maintainer only, a figure set had no form that could be shared without
  project names, paths or prompt text, and the registry's `outcome.context_saved` definition
  added reasoning tokens while the tool subtracted only what returned. The tools also joined a
  usage row to every transcript that bound its session id, so a resumed copy of a transcript
  would count the row twice.
decision: |
  The tools stay in `tools/maintain` and run from the clone every user already has. Both gain
  `--export <file>`: the printed figures plus the provenance stamp, written through
  `metrics.write_export`, which refuses (and writes nothing) when the text would carry an
  absolute path or one of the scanned projects' directory names; it cannot be combined with
  `--show-names` or `--sample-rebuttals`. `RECOUNT` now says a figure is recountable only on
  the machine holding its inputs. A usage row belongs to the earliest-starting transcript that
  binds its MAIN_SESSION_ID (`metrics.session_owners`); this changes the method of
  `real_use.delegated_call` and `outcome.context_saved`, both bumped to `@2`, and the latter's
  definition now states the formula the tool runs (fresh input minus returned, floored at 0,
  reasoning apart). A test computes the formula through the implementation, not only against
  the documentation. A team-guide page explains when and why to measure; the commands live
  in docs/evaluation/metrics.md.
rationale: |
  Asked what the figures from other users are for, the maintainer answered both: users see
  the workflow's effect on their own projects, and may optionally send the result back. So the
  export carries aggregates and the stamp, never data, and the stamp is what makes figures from
  different machines comparable at the same metric versions. Asked how the tools should reach
  users, the maintainer took the main agent's recommendation to keep them as offline tools with
  an export rather than move them into a runtime command, because moving about 870 lines would
  risk shifting figures CASE-011 and CASE-012 already recorded.
alternatives:
  - option: Move the measure logic into core/audit behind `main.py --command benchmark`
    rejected_because: The refactor risks changing recorded figures; the clone already gives users the tools.
  - option: Collect users' raw usage streams and transcripts for central recounting
    rejected_because: Transcripts hold prompt text and project details; only aggregates may leave a machine.
evidence: [DEC-026]
evidence_notes: |
  `tests/checks/metrics.py` (`metrics-contract`): context_saved computed through `saved_net`
  matches the registry formula, the net floors at 0, a resumed transcript binding the same id
  does not own its rows, and an export carrying a project name, a Windows path or a POSIX path
  is refused and writes nothing. On the maintainer's machine 354 session ids were bound in
  Claude Code transcripts and none in more than one, so `@2` equals `@1` on all data recorded
  up to 2026-10-04.
  The export guard was widened after the delegated verify of the release (UNC, home and any
  POSIX root path; every key and string value is checked).
implementation:
  version: 3.8.0
  commits: [3cf285842e24388be2221268db886cf624a97e9e, b4d7ad6f24261f676005ee3c0c84dc4d46c41580]
  components:
    - core/audit/metrics.py (RECOUNT, session_owners, write_export, metric versions)
    - tools/maintain/measure_real_use.py, tools/maintain/measure_task_outcomes.py (--export, row ownership)
    - docs/evaluation/metrics.md, docs/team-guide/measure-your-use.md
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The metrics-contract suite passes. No user other than the maintainer has run the tools or
    sent an export yet.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only metrics-contract` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - Users can measure the workflow on their own projects and share figures without sharing data.
    - The registry text and the code agree on context_saved, and a test now holds them together.
  worse:
    - The export guard matches directory names and path shapes; a project named some other way in free text is not caught.
    - Two measurement paths (runtime report and offline tools) stay separate.
limitations:
  - The guard cannot recognise a project by anything but its directory name.
  - Figures from other machines cannot be recounted, only compared by their stamps.
revisit_when:
  - A user's export is found to identify a project or person.
  - Exports from several users need a common format beyond the printed report.
revises: [DEC-026]
questions: [RQ-02, RQ-15]
