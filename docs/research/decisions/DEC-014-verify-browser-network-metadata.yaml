schema_version: 2
id: DEC-014
title: verify-browser records ordered request metadata, compared across runs, never bodies or headers
date: 2026-09-29
status: accepted
provenance:
  type: direct
  confidence: medium
  basis: "maintainer goals for page optimization (RQ-14); Playwright 1.60.0 API read from the installed package"

problem: |
  Page optimization needs to know what a page loads, in what order, how large and how slow,
  and whether that changed since the last run. The maintainer's goals: slow loads, heavy
  assets, excessive or repeated API calls, caching that does not work, and the flow of
  requests. The browser player records none of this for reads: safe GET/HEAD/OPTIONS return
  early and bypass the request ledger; ledgered requests carry a sanitized endpoint, method,
  resource type, status, failure and duration, without size, order, or cross-run memory.

decision: |
  - A separate all-request metadata ledger in the browser player, one record per request:
    sequence number, start offset from the start of the run, duration and timing phases
    (`request.timing`), sanitized URL (path only, no query values), method, status, resource
    type, navigation flag, redirect link, request/response body and header sizes
    (`request.sizes()`), and service-worker origin.
  - Cache state is recorded only where Playwright exposes it (service worker); an HTTP-cache
    hit is not exposed and stays null unless derived by a heuristic labelled as such.
  - No initiator is recorded: Playwright 1.60.0 has no initiator field.
  - No bodies, headers, cookies, query values, HAR or binary data. Records are capped per run,
    with one truncation summary.
  - Each run stores a summary (counts and bytes per resource type, slowest requests, repeated
    endpoints) so the next run against the same origin reports differences.
  - Implementation (maintainer's choice): always on; the cap is a rolling window of the newest
    500 rows, older rows dropped and counted, while the summary is folded over every request
    so the run's totals stay whole. The cross-run memory is the `e2e_run` quality row
    (`origin`, `network`), not a new store. Rows travel as events of at most 50 rows and 48 KB
    at the end of the run, inside the supervisor's 64 KB line limit. The listeners are on the
    browser context, so popup requests are closed too; URLs are capped at 500 characters and
    URLs inside failure texts are sanitized.

rationale: |
  Ordered metadata reconstructs the waterfall and repeated calls, which covers the named goals.
  Bodies and headers carry credentials DEC-009's scrubbing cannot fully guarantee to remove,
  and binaries cannot be scrubbed. Cross-run summaries turn single measurements into
  regressions a maintainer can act on.

alternatives:
  - option: Opt-in full HAR capture
    rejected_because: Rejected by the maintainer — headers, cookies and bodies leak; artifacts grow.
  - option: Extend the existing request ledger
    rejected_because: That ledger drives write classification and planned-request checks; all reads would change its meaning.
  - option: Per-run report only
    rejected_because: Rejected by the maintainer — regressions need comparison across runs.

evidence: [DEC-001, DEC-007, DEC-009, DEC-010, CASE-005]
evidence_notes: |
  Research question: RQ-14.
  Code at the time: core/evidence/e2e/browser.py (lines 478-495 safe-method early return,
  933-1003 ledger fields, 1627-1668 listeners), core/evidence/e2e/request.py (lines 154-156
  artifact budget). Playwright 1.60.0 `Request`: sizes(), timing, resource_type,
  is_navigation_request(), redirected_from, frame; no initiator attribute.

implementation:
  version: 3.8.0
  commits: [60263ba]
  components:
    - core/evidence/e2e/network.py (NetworkLedger, rolling window, summary, events)
    - core/evidence/e2e/browser.py (listeners, flush at run end and on crash)
    - core/evidence/e2e/classify.py (report `network`)
    - core/evidence/e2e/runner.py (quality row `origin`/`network`, meta.e2e.page_requests, since_last_run)
    - docs/runtime-contracts.md, docs/reference.md
    - tests/checks/e2e_network.py, tests/checks/e2e_smoke.py

disposition:
  implementation_status: implemented
  validation_status: not_validated

validation:
  summary: |
    Planned. Offline: reads are recorded in order; the cap truncates with a summary; a secret
    in a URL query reaches no artifact; a second run reports differences from the first.
    Real use: two clean runs on a frontend project that uses browser verification report
    per-type counts and bytes, request order, and the difference between them, inside the
    artifact budget.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only e2e-network --only e2e-browser --only e2e-redact` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false

trade_offs:
  better:
    - verify-browser can show what a page loads, in order, and what changed since last run.
  worse:
    - Larger quality rows and a new per-origin summary to store and prune.
limitations:
  - HTTP-cache hits and initiators are not observable through Playwright 1.60.0.
  - The rolling window drops the earliest rows first, usually the first page load; their totals stay in the summary, their per-row order does not.
  - Rows are delivered at the end of the run; a player killed without the crash path loses them.
  - "`request.sizes()` is one protocol round trip per finished request; its cost on heavy pages is not measured."
  - A headed run on a developer machine is not a controlled performance measurement.
revisit_when:
  - Optimization repeatedly needs initiator or cache data the ledger cannot hold.
  - A redaction test finds a secret in a sanitized URL.
questions: [RQ-14]
