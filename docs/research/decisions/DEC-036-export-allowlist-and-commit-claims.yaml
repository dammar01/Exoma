schema_version: 3
id: DEC-036
title: A shared export passes an allowlist of value shapes, and a commit is taken only by the task that claims it
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: high
  basis: Local branch review of DEC-027 and the task telemetry before release; bypasses and false refusals reproduced
problem: |
  DEC-027's export guard refused a value only when a regex recognised an absolute path, and
  forms such as `cwd:/home/<user>`, `[/home/<user>]`, `file:///…`, `~<user>/…` and `$HOME/…`
  passed. Its project-name check was a substring match over every string, the fixed recount
  text included, so a projects folder named `data` refused every export. No current producer
  emitted a user path, so nothing leaked; the guard was correct only by its inputs. In task
  telemetry a commit hash was marked seen before any task claimed it, so with two sessions in
  one project the other session's copy, arriving first, made the commit unclaimed and the
  session that made it lost it.
decision: |
  The export accepts numbers, booleans, null and identifier-shaped strings
  (`[A-Za-z0-9_.:+-]`, at most 64 characters), keys of the same shape plus single spaces, and
  the fixed recount and producer texts only where the provenance stamp writes them; anything
  else is refused naming its JSON path. Project names are matched as whole words over data
  values, and only names of projects that contributed sessions are passed. A commit is marked
  taken only when claimed, and `unclaimed_commits` counts distinct commits no copy claimed.
  Smaller fixes in the same tools: `inputs_digest` skips unreadable streams, `tool_commit`
  requires the install root to be the repository top level, labels continue AA after Z, git
  calls have a timeout, and malformed draft names are reported instead of guessed.
rationale: |
  A file meant to leave the machine should carry only what is shown to be safe, not what a
  pattern failed to recognise. The figures it shares are aggregates and identifiers, so an
  allowlist costs nothing they need.
alternatives:
  - option: Extend the absolute-path regex with the reproduced forms
    rejected_because: The next unlisted form passes the same way.
evidence: [DEC-027, DEC-020, DEC-021]
evidence_notes: |
  `tests/checks/metrics.py` (`metrics-contract`): every reproduced form is refused, folders
  named `data` and `main` export, real `--export` runs of both tools pass the allowlist.
  `tests/checks/task_telemetry.py`: the second session's copy arriving first no longer takes
  the commit. `tests/checks/research.py`: `DEC-0123-x` is no longer read as DEC-012.
implementation:
  version: 3.8.0
  commits: [93a01d20fa6107cd6ec40c860833d5e9b82e968e]
  components:
    - core/audit/metrics.py (allowlist export, inputs_digest, tool_commit, labels)
    - core/audit/task_telemetry.py (claim before taken)
    - tools/maintain/measure_real_use.py, measure_task_outcomes.py, measure_graph_hook.py
    - tools/maintain/check_research.py (draft ids)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The suites above pass. No export has been shared since the change.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only metrics-contract --only task-telemetry` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - An export cannot carry free text, so a future field cannot leak by accident.
  worse:
    - A figure stored as text with a slash or a space (`3/4`) is refused and must become a number.
limitations:
  - Keys are not checked for project names; a data-derived key holding one would pass.
revisit_when:
  - A legitimate figure cannot be expressed within the allowlist.
revises: [DEC-027]
questions: [RQ-02, RQ-15]
