disposition:
  implementation_status: implemented
  validation_status: not_validated

validation:
  summary: |
    Unit tests pass (tests/checks/task_telemetry.py): DONE then a commit of the task's files
    completes; DONE without commit is ready_to_commit; NEEDS FIX stays open; NEEDS FIX,
    INCOMPLETE or no verify then commit is unverified_closed; an edit after DONE voids it; an
    unrelated commit closes nothing; no identity is unknown. Both hook flavours produce the
    same events, and a failed commit or one without a saved HEAD records nothing. Not yet
    validated in real use: over a sample of the maintainer's tasks, report's open and
    completed tasks must match the maintainer's own account.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only task-telemetry --only telemetry` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false

trade_offs:
  better:
    - Open work, its skill sequence, and how it ended become visible.
  worse:
    - Local skills are seen only through the `task-events` hook, which runs once `install`/`upgrade` has placed it.
limitations:
  - The verdict is the second agent's judgement; a wrong DONE completes a task that is not done.
  - "The runtime's derived verdict is not the reply's DONE: CASE-009 found 2% of 820 verify rows derived `pass`, because a read-only second agent lists the tests it cannot run under not_verified and the verdict becomes `incomplete`. Completion therefore reads the declared verdict; a declared DONE with a blocking finding counts as NEEDS FIX."
  - A commit is tied to a task by session and edited path; edits made outside Claude's tools are not seen, and an edit from parallel unrelated work in the same session joins the open task.
revisit_when:
  - Many tasks end unknown because local skills are not recorded.
  - The maintainer's account of open work disagrees with report.
questions: [RQ-07a]
