schema_version: 2
id: DEC-015
title: A task is a recorded sequence of skill calls, completed by a commit of its edits after a DONE verify
date: 2026-09-29
status: accepted
provenance:
  type: direct
  confidence: medium
  basis: "maintainer definition of task and completion"

problem: |
  RQ-07a notes that the runtime records routing, evidence and verdicts but not the plan, the
  execution, or the task outcome. Telemetry cannot say which task is in progress, which
  skills it used, or when it ended. Usage rows carry command, provider, session, prompt,
  verdict, acceptance, duration and reuse fields, but no task identity, skill sequence, or
  completion. For the maintainer a task is a chain — explore or analyze, then plan, execute,
  verify — and it is finished when verify is satisfied and the next step is a commit.

decision: |
  - Each delegated and local skill call, each file edit and each commit is recorded in
    `tasks.jsonl`; a task is the run of events in one MAIN_SESSION_ID from its first event
    until a commit that includes a file it edited, with its ordered skill sequence.
  - Revised at implementation (maintainer, 2026-10-02): uncommitted work is unfinished.
    Task states: completed, unverified_closed, ready_to_commit, open, read_only, unknown.
  - completed: committed after a verify whose declared verdict is `DONE`, with no edit since.
  - ready_to_commit: `DONE`, not committed yet; still open work.
  - unverified_closed: committed without verify, or after `NEEDS FIX`/`INCOMPLETE`, or
    edited after the `DONE`.
  - A `NEEDS FIX` verdict keeps the task open.
  - unknown: no session identity; never counted as completed.
  - Recording needs no prompt change: the runtime writes delegated commands; a PostToolUse
    hook (`task-events`) writes local skill loads, edits and commits from tool calls that
    already happened. An intent guess (UserPromptSubmit) is not used.
  - `report` shows tasks by state with their skill sequences.

rationale: |
  The maintainer's completion signal is a satisfied verify followed by the commit: work that
  is verified but not committed is not finished. The metric therefore needs both the verify
  contract's declared verdict (`DONE | NEEDS FIX | INCOMPLETE`) and the commit itself, tied
  to the task by the files it edited. `recommended_next_action` is recorded but not required:
  the commit is the evidence that the next step was taken. Keeping commits without a clean
  verify apart stops them from inflating completion. Recording the sequence answers how many
  calls and which skills a task took. Recording from tool calls that already happened adds no
  prompt instruction an agent could skip.

alternatives:
  - option: Complete on a DONE verify whose recommended_next_action names `/.commit` (this decision as first accepted)
    rejected_because: Revised by the maintainer at implementation — uncommitted work is unfinished; it is kept as `ready_to_commit`.
  - option: Tie the commit to the plan's declared scope
    rejected_because: An execute started from natural language has no plan scope; the files the task edited are observed directly.
  - option: Record local skills through a prompt-invoked CLI, or from the UserPromptSubmit intent guess
    rejected_because: The CLI needs a prompt instruction the maintainer rejected; the intent guess records skills that never ran.
  - option: Complete when the whole working tree is clean
    rejected_because: Rejected by the maintainer — unrelated changes would hold tasks open.

