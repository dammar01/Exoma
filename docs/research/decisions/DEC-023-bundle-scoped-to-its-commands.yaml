schema_version: 3
id: DEC-023
title: The installed bundle stays out of the user's own configuration — command-only scope, provider-call scope, block-only writes, uninstall
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Maintainer critical interview, 2026-10-04 (sanitized below)
problem: |
  The installer already spliced only its marked block into an existing CLAUDE.md or AGENTS.md,
  so the user's text was never overwritten. What it did not respect was the user's behavior:
  under `--only-command` the bundle's rules (style, output contract, gates, next-step hints)
  still applied to every message; the second-agent rules in `~/.codex/AGENTS.md` and
  `~/.config/opencode/AGENTS.md` applied to the user's own direct use of those tools; a first
  install wrote the shipped header outside the markers, indistinguishable from the user's text
  afterwards; the settings template seeded the maintainer's model, plugins, effort and
  permission mode; and nothing could remove the workflow again.
decision: |
  Under `--only-command` the installed block opens with an activation-scope stanza: the
  workflow's rules apply only after the user invokes `/.<command>` or a workflow skill, and for
  that command's run; plain chat follows the user's own instructions, including style. Each
  provider AGENTS.md block applies only when the request's instructions open with
  `[WORKFLOW_AGENT]`, which every runtime prompt does. A first install writes the managed block
  alone. The settings template carries only hooks and the status line. `install.py --uninstall`
  cuts the block from each instruction file, removes only unedited workflow files and the
  workflow's hooks and status line, and goes through the install receipt so `--rollback`
  reverses it. Passive hooks (session binding, task events, graph refresh) and the status line
  stay in both modes.
rationale: |
  Asked what "the user's configuration changed" meant, the maintainer answered that it was an
  anticipation for other users, not something seen; that in command-only mode an explicit
  command or skill should switch the workflow on while ordinary chat keeps the user's
  CLAUDE.md; and that passive telemetry hooks and the status line may stay on outside commands.
  Scoping by invocation keeps one shipped file with both mode stanzas, as before.
alternatives:
  - option: Make the user's rules always win, in both modes
    rejected_because: In auto-intent mode the workflow is the default way of working by the user's choice; the scope applies where the user opted out.
  - option: Ship two separate CLAUDE.md files, one per mode
    rejected_because: Two files drift; the stanza markers keep both modes reviewable in one file.
evidence: []
evidence_notes: |
  `tests/checks/installer_uninstall.py` (block-only first write, block cut keeping the user's
  text, settings strip keeping user hooks and keys, relocated hook drop, rollback of an
  uninstall restoring the mode file). A dry-run uninstall on the maintainer's machine listed
  the four instruction files (three merges keeping text, one removal holding only the block).
  The interview is summarised, not transcribed.
implementation:
  version: 3.8.0
  commits: [8d2d42b7260139278a57924c319155a5767ddde2]
  components:
    - dist/config/claude/CLAUDE.md (COMMAND-ONLY activation scope, per-mode style line)
    - dist/config/opencode/AGENTS.md, dist/config/codex/AGENTS.md, dist/config/agy/AGENTS.md (Scope)
    - dist/config/claude/settings.template.json (hooks and statusLine only)
    - installer/base.py (block-only first write), installer/uninstall.py, install.py (--uninstall)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    Installer suites pass. A command-only session in which plain chat follows the user's
    CLAUDE.md has not been run yet; the scope is a prompt instruction, so only use can show it holds.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only bundle-sync --only installer-text --only installer-uninstall` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - A command-only user keeps their own behavior outside workflow commands.
    - Direct use of codex or opencode no longer carries second-agent rules.
    - The workflow can be removed, and the removal undone.
  worse:
    - Existing command-only users lose the workflow's default style and hints in plain chat.
    - New installs no longer receive the plugins and settings the template used to seed.
limitations:
  - The activation scope relies on the model honouring an instruction; nothing in the runtime enforces it.
  - Keys seeded by earlier releases stay; nothing records whether the user came to rely on them.
revisit_when:
  - A command-only session shows workflow rules leaking into plain chat.
  - A provider stops opening its instructions with the runtime marker.
questions: [RQ-03, RQ-10]
