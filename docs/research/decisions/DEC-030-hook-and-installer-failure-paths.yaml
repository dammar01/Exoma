schema_version: 3
id: DEC-030
title: Hooks and the installer fail without losing events, mislabelling a graph, or orphaning hooks
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Branch review of 3.8.0 hooks and installer before the tag
problem: |
  The 3.8.0 hooks and installer were correct on their normal paths and not on their failure
  paths. `task-events.ps1` ran git under `ErrorActionPreference = Stop`, and Windows PowerShell
  5.1 turns git's stderr into a terminating error, so in a project without git every skill
  event was lost; the tests did not see it because they preferred `pwsh` while the installed
  hooks run `powershell`. `graph-refresh` recorded a killed graphify as `refreshed` when
  `graph.json` had changed, then removed the lock that tells readers the graph may be
  half-written. Two sessions that both found a stale lock could each delete it and start two
  refreshes. Uninstall deleted the hook scripts before reading `settings.json` strictly, so a
  settings file with a BOM left hooks pointing at deleted files. A START marker without its END
  made the installer append a second block.
decision: |
  Git calls in `task-events.ps1` run with a local `Continue` preference and check the exit
  code. Hook tests run `.ps1` hooks under `powershell` 5.1 on Windows. `graph-refresh` records
  `refreshed` only when graphify finished in time and `graph.json` parses; a kill stays
  `timeout` and an unparseable rewrite is `corrupt`. A stale lock is removed only if it is
  unchanged when read again just before the delete. `target` is a skip directory, `.sh`
  matching is case-insensitive like `.ps1`, and a bad `GRAPH_REFRESH_LIMIT_S` falls back to the
  default. Uninstall cleans `settings.json` first, reads it leniently, and keeps every hook
  script when it cannot. Unpaired or repeated markers make install refuse that file (and
  uninstall leave it) with a warning naming the file and markers.
rationale: |
  These hooks are passive and fail open; their failure mode should be "nothing recorded" or
  "nothing changed", never a false record or a broken setup. Testing under the shell that is
  actually installed is the only way the Windows flavour's behavior is checked at all.
alternatives:
  - option: Drop the `.ps1` hooks and require bash on Windows
    rejected_because: Users without Git Bash on PATH would lose every hook.
  - option: Repair unpaired markers automatically
    rejected_because: The installer cannot know which text around a broken marker is the user's.
evidence: [DEC-012, DEC-021, DEC-023]
evidence_notes: |
  `tests/checks/task_telemetry.py` (a project without git still records the skill event, every
  flavour), `graph_refresh.py` (timeout after a rewrite, corrupt graph, bad limit, a newer file
  under `Target/` keeps the graph fresh), `installer_uninstall.py` (BOM settings, cleanup order,
  unreadable settings keeps the hook, three broken marker shapes). Reproduced before the fix on
  Windows PowerShell 5.1: `fatal: not a git repository` raised as a terminating error.
implementation:
  version: 3.8.0
  commits: [0513baa5f9b619f45df9c12e22012ef4c943d881]
  components:
    - dist/config/claude/hooks/task-events.ps1 (Invoke-Git)
    - dist/config/claude/hooks/graph-refresh.ps1, graph-refresh.sh (outcome, lock, skip list, limit)
    - installer/base.py (ManagedBlockError), installer/uninstall.py (order, lenient read)
    - tests/checks/support.py (powershell_for_hooks)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The suites above pass on Windows; the `.sh` paths were checked where bash was available.
    No real-use run has hit these failure paths since the fix.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only hook-launchers --only installer-stale --only graph-refresh` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - Telemetry and graph state stay truthful when something goes wrong.
  worse:
    - A file with broken markers now needs a manual fix before the workflow installs into it.
limitations:
  - The lock re-read narrows the race between two deleters to the moment between read and delete; it does not close it.
revisit_when:
  - A `corrupt` graph outcome appears in real use (graphify itself writing invalid JSON).
questions: [RQ-07a, RQ-13]
