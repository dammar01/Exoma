schema_version: 3
id: DEC-065
title: Promoted knowledge is part of evidence reuse identity and stays inside the project root
date: 2026-10-20
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: source reading during the CASE-024 session
problem: |
  Promoted knowledge rides the same exploration and reasoning prompts as facts, but the
  evidence context that keys reuse carried facts and not knowledge. Promoting a correction
  left the earlier answer, reasoned without it, servable as a fresh hit for the identical
  task. Separately, `knowledge_dir` was joined to the project root with no containment, and
  promote-verify loaded the existing document by the candidate's id before the id was
  validated, so `../`, an absolute path or a symlink could point the one Git-tracked writer
  at another directory.
decision: |
  The evidence context (schema 3) carries a fingerprint of the knowledge entries the call
  was shown — a hash of the injected entries, never their text. `knowledge_dir` resolves the
  configured path and refuses absolute paths, `..` and anything resolving outside the root
  (`KnowledgePathError`); `doc_path` refuses an id that is not a schema slug. `write` returns
  `knowledge_path_escape`, readers see no knowledge, and doctor reports the misconfiguration.
rationale: |
  What can change an answer is what the second agent read, so the fingerprint is taken over
  the injected entries, not over the files: a document excluded for this branch was never
  read. Containment fails closed instead of falling back to the default directory, because
  writing somewhere other than where config points is the same surprise in another form.
alternatives:
  - option: Fingerprint the knowledge directory's files
    rejected_because: Branch-excluded documents would invalidate reuse without having reached the prompt.
  - option: Fall back to the default knowledge_dir on an escape
    rejected_because: Silently writes somewhere the user did not configure.
evidence: []
evidence_notes: |
  tests/checks/promote.py (suite promote-boundaries): escapes through `..`, an absolute path,
  a nested `..` and a symlink are refused for write, list and load, and nothing is written
  outside the root; an id that is not a slug never reaches the filesystem; adding or
  changing knowledge changes the reuse context and the context carries no knowledge text.
  tools/e2e/e2e_promote.py still passes in full.
implementation:
  version: 3.9.0
  commits: [f63e1b7]
  components:
    - core/provider/result_prep.py (knowledge_fingerprint, evidence context schema 3)
    - core/provider/executor.py (passes the injected knowledge)
    - core/knowledge/store.py (containment, slug check, knowledge_path_escape)
    - core/audit/diagnostics.py (doctor reports a refused knowledge_dir)
    - tests/checks/promote.py
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    Covered by the promote-boundaries suite and the e2e promote checks on Windows. The
    symlink case runs only where the OS grants symlink creation.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only promote-boundaries --only evidence-reuse` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - A knowledge correction is never shadowed by an answer reasoned without it
    - The Git-tracked writer cannot be pointed outside the repository
  worse:
    - Every evidence row written before schema 3 misses reuse once
limitations:
  - A knowledge_dir that is a symlink inside the repository to another place inside it is allowed
revisit_when:
  - A project needs knowledge stored outside its own root on purpose
questions: [RQ-06]
