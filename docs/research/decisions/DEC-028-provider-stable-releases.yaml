schema_version: 3
id: DEC-028
title: Each provider names the CLI release the workflow was tested on; any other release is recorded and warned about, never blocked
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: CASE-016, maintainer critical interview 2026-10-04
problem: |
  A provider CLI update can break delegated calls from the provider's side (CASE-015, CASE-016:
  codex releases after a certain point fail every resumed thread on Windows). The runtime read
  only codex's version, compared it with nothing, and gave no release to go back to; opencode
  and agy versions were not recorded at all.
decision: |
  Every provider bundle in config/providers.py carries `stable_version`, the CLI release this
  workflow version was tested on. `core/provider/versions.py` reads `<cli> --version` once per
  process for every provider (bounded, tree-killed on timeout) and classifies it `stable`,
  `untested` (any other release, pre-releases included) or `unreadable`. Every usage row records
  `provider_version` and `provider_version_status`; doctor reports `checks.provider_version`
  with the stable release and warns when the installed one is untested. Nothing blocks a call
  and nothing installs a provider. The reference lists the pin command per provider.
rationale: |
  Asked what the runtime should do when the installed release differs from the tested one, the
  maintainer chose a warning only, over blocking calls or having the installer install the
  release. Asked which codex release was stable, the maintainer did not know and allowed the
  main agent to find it by downgrading the global install; the bisect (CASE-016) gave the value.
alternatives:
  - option: Refuse delegated calls on an untested release until the user overrides
    rejected_because: A newer release usually works; blocking would stop users for no proven fault.
  - option: Have install.py install or downgrade the provider to the stable release
    rejected_because: It would change a tool the user also runs outside the workflow.
  - option: Store the releases in dist/manifest.json
    rejected_because: That file is generated from dist/ and never hand-edited (RELEASE.md).
evidence: [CASE-015, CASE-016]
evidence_notes: |
  `tests/checks/provider.py` (`provider-seam`): every bundle names a parseable stable release,
  which reads `stable`; another release and a pre-release read `untested`; no answer reads
  `unreadable`; an opencode invocation is stamped with its release and status; an adapter's own
  reading is kept. On the maintainer's machine doctor read opencode 1.18.34 and agy 1.1.13 as
  stable.
implementation:
  version: 3.8.0
  commits: [23bf6e726a0ee0a47c8e5db2da7108df986ca702]
  components:
    - config/providers.py (stable_version, provider_stable_version)
    - core/provider/versions.py (read_version, release, status, describe)
    - core/provider/executor.py (_stamp_provider_version)
    - core/evidence/contracts.py (provider_version_status)
    - core/audit/diagnostics.py (provider_version for every provider)
    - adapters/providers/codex_adapter.py (codex_version uses the shared reader)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    Unit tests pass and the bisect named the codex release. No user has yet been warned about
    an untested release in real use.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only provider-update --only provider-seam --only provider-boundary` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - A failure report names the provider release, and there is a known release to go back to.
  worse:
    - Each workflow release has to re-test and re-state three provider releases.
    - A newer, working provider release is reported as untested until the workflow catches up.
limitations:
  - The stable releases were tested on one Windows machine. opencode and agy were not bisected; their installed releases were taken as the baseline because they carried the maintainer's real use without a provider-side failure.
revisit_when:
  - A provider fixes the failure that set its stable release.
  - Users report untested-release warnings for releases that work, often enough to be noise.
questions: [RQ-07a, RQ-09]
