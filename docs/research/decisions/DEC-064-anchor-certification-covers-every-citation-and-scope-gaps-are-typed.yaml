schema_version: 3
id: DEC-064
title: Anchor certification covers every citation, and only in-scope gaps cap confidence
date: 2026-10-20
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: CASE-024
problem: |
  The anchor scan stopped at the 40 anchors it stores for reuse, so a citation past the 40th
  was never certified, and the executor reported `certified/total` over the stored prefix
  without its completeness flag. A run citing missing files after forty good ones read as
  fully certified. Claim refs in `meta.claims` were never checked at all. Separately, any
  non-empty `scope_not_covered` capped confidence at medium, and nearly every explore lists
  live provider or browser state there, so the cap fired on every run and told the reader
  nothing (CASE-024).
decision: |
  `evidence_store.scan_anchors` certifies up to 200 distinct citations against a per-scan
  file cache and still stores the first 40 for reuse; it reports `cited`, `certified`,
  `scanned_all` and up to ten uncertified refs, kept on the row as `anchor_scan`. The digest
  and `evidence_ref` carry `scanned_all`; `anchor_cap` caps at medium when the scan stopped
  early even if every scanned citation certified. Each `meta.claims` entry gets a
  `ref_status` per ref, and an unverified ref raises a `claim_ref_unverified` warning (the
  ratio already prices it in). `scope_not_covered` bullets carry a tag; only
  `in_scope_unreachable` and untagged bullets cap, `live_state`, `external` and
  `out_of_scope` go to `meta.scope_warnings`. Reuse eligibility is unchanged: it still needs
  every citation stored and certified.
rationale: |
  The storage limit exists because every stored anchor is re-hashed on each reuse check;
  certification is one hash per line and can afford to read further. Keeping the two apart
  fixes the ratio without making reuse checks heavier. Raising the storage limit alone would
  move the cliff, not remove it. Untagged scope bullets keep the old cap so output from a
  provider that does not tag yet loses nothing.
alternatives:
  - option: Raise MAX_ANCHORS_PER_ARTIFACT
    rejected_because: Makes every reuse check heavier and keeps a prefix ratio past the new limit.
  - option: Stop capping on scope_not_covered entirely
    rejected_because: A requested surface the run could not reach is a real hole in the answer.
  - option: Classify scope bullets by keyword
    rejected_because: A guessed category would cap or not cap on wording; the agent knows which kind it listed.
evidence: [CASE-024]
evidence_notes: |
  tests/checks/contracts.py (suite contracts): a 41st uncertified citation is counted, named
  and lowers confidence; a scan stopped at the limit caps a clean prefix; legacy rows read as
  what they can prove; claim refs get per-ref status; tagged, untagged and unknown-tag scope
  bullets cap as specified.
implementation:
  version: 3.9.0
  commits: [f63e1b7]
  components:
    - core/evidence/evidence_store.py (scan_anchors, certify_claim_refs, anchor_scan on the row)
    - core/evidence/contract.py (anchor_cap scanned_all)
    - core/provider/executor.py (counts, digest/evidence_ref fields, claim ref status, scope warnings)
    - core/provider/result_prep.py (scope_gaps, scope_warnings)
    - core/prompt/prompt_builder.py and dist/config/*/AGENTS.md (scope tags in the output contract)
    - docs/reference.md, dist/config/claude/CLAUDE.md
disposition:
  implementation_status: implemented
  validation_status: observed
validation:
  summary: |
    Covered by the contracts suite on Windows. No delegated run since the change has been
    checked for how often `scanned_all` is false or how often providers tag scope bullets.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only contracts --only evidence-anchor-relocation` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
    - date: 2026-10-23
      job_id: "main_agent-workflow_20261023_082642459_3c69 explore digest"
      description: "Live use: a delegated explore digest was capped from high to low with its reasons named (10 of 86 anchors unverifiable, claims without file:line, scope gaps). Not clean in the CONTRACT.md sense. The maintainer decided observed on 2026-10-23."
      clean: false
trade_offs:
  better:
    - A certified ratio covers the whole answer up to 200 citations, and says when it does not
    - The scope cap fires on holes in the answer, not on every run
  worse:
    - Runs with many citations are capped at medium more often than before
    - Confidence before and after this change is not comparable in telemetry
limitations:
  - Output past 200 distinct citations is still capped by a prefix ratio
  - A provider that tags a real in-scope gap as live_state escapes the cap
revisit_when:
  - Telemetry shows providers rarely tag scope bullets, or tag in-scope gaps as non-capping
questions: [RQ-01]
