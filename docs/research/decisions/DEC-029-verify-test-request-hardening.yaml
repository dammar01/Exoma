schema_version: 3
id: DEC-029
title: The verify test request cannot forge the verdict, a timed-out test cannot hang the run, and the gate lets the main agent choose tests
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Branch review of DEC-025 before the 3.8.0 tag; maintainer critical interview 2026-10-04
problem: |
  A review of DEC-025's implementation before release found four ways the runtime-run tests
  could defeat the verdict or the user's time. Text from `verify/tests.json` (`reason`, a
  refused command, a failure detail) was written into the [VERIFICATION] block verbatim, and
  the parser reads the first matching header, so a newline could add a `not_verified: - none`
  section and turn an `incomplete` verdict into `pass`. A timed-out test was killed alone; on
  Windows a test started through a `.cmd` shim leaves its child holding the output pipes, and
  the run then waited for them without a limit while holding the session's runtime lock. The
  request was consumed before the tests ran, so a recovery re-run of the same job found none.
  And the skill told the main agent to choose tests from the diff before delegating while the
  gate hook blocked every read until `.workflow/run`, so the choice was made blind. A project
  with the default empty allowlist was told not to run tests and then had none run.
decision: |
  Every string from the request is collapsed to one line before it enters the block, and a
  `reason` containing a newline makes the request unusable (the verify stays `incomplete`).
  Tests run in their own process group through `osutil.run_bounded`; a timeout kills the whole
  tree and collects output for at most 5 s. The request is renamed `tests.used.json` only after
  its results are merged. A boolean timeout is ignored. The prompt line telling the second agent
  not to run test runners is sent only when the allowlist is set, and doctor warns while it is
  empty. When the gate marker's command is `verify`, the gate hook lets through a clean
  `git diff --name-only|--name-status|--stat`, a read of `.workflow/config.json`, and a read or
  write of the session's own `verify/tests.json`; everything else stays blocked.
rationale: |
  The verdict is the machine's evidence (DEC-025), so text the main agent writes must not be
  able to change its structure, by mistake or otherwise. Asked what makes verify a bottleneck,
  the maintainer named the waiting time; a run that can hang indefinitely is the worst case of
  that. The gate lane is the smallest opening that lets the main agent do what DEC-025 asks of
  it: the file list and the allowlist, not the code.
alternatives:
  - option: Let the second agent choose the tests after its review
    rejected_because: DEC-025 keeps test choice with the main agent per change; the second agent never sees test output.
  - option: Lift the gate for every verify-intent read
    rejected_because: Bulk reading before delegation is exactly what the gate exists to stop.
evidence: [DEC-025, CASE-010]
evidence_notes: |
  `tests/checks/verify_tests.py` (`verify-runtime-tests`): a forged multi-line reason and a
  forged refused command leave one `not_verified` header and an `incomplete` verdict; a parent
  whose grandchild sleeps 60 s holding stdout times out in seconds; the request survives a read
  and is consumed after apply; the prompt line follows the allowlist; doctor warns on an empty
  allowlist. `tests/checks/intent_gate.py`: under a verify marker the allowed calls pass, and a
  piped or chained `git diff`, `-p`, `--output`, `git show`, a source read, another session's
  request and a Grep stay blocked, in both hook flavours (`.ps1` under Windows PowerShell 5.1).
  The delegated verify of the release found the runner allowlist matching the runner path
  anywhere in a Bash command (a pattern older than this decision); it now anchors the runner
  as the command itself.
implementation:
  version: 3.8.0
  commits: [b1badd77a6481049b39efb7127442ed6c6dedc26, b4d7ad6f24261f676005ee3c0c84dc4d46c41580]
  components:
    - core/evidence/verify_tests.py (one-line text, run_bounded, consume after merge, bool timeout, configured)
    - utils/osutil.py (run_bounded)
    - core/prompt/prompt_builder.py (tests line only with an allowlist)
    - core/audit/diagnostics.py (verify_test_commands warning, leftover header warning)
    - dist/config/claude/hooks/intent-gate-check.ps1, intent-gate-check.sh (verify lane)
    - dist/config/claude/CLAUDE.md, dist/config/claude/skills/verify.md
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The suites above pass. No delegated verify has run through the verify lane in real use yet,
    and verify duration after DEC-025 has not been measured (draft experiment).
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only verify-runtime-tests --only e2e-supervisor --only gate-prompt-field` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - The verdict cannot be rewritten by request text; a hung test ends at its timeout.
    - The main agent can see which files changed before choosing tests.
  worse:
    - Dependents can be inferred only from file names in the diff, not by tracing callers.
    - An empty allowlist still means no test runs; the user must fill it per project.
limitations:
  - The tree kill covers the process group; a test that detaches its own daemon outside the group survives the timeout.
revisit_when:
  - Measured verify duration after DEC-025 is still dominated by waiting.
  - Main agents choose poor tests because the file list is not enough.
questions: [RQ-11, RQ-13]
