schema_version: 3
id: DEC-040
title: A proven selector's route folds identifier segments to :id
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Branch review of DEC-035 and a maintainer interview; the maintainer's apps route on ids in the path
problem: |
  DEC-035 scoped a proven selector by the exact URL path. On an app whose pages carry an id in
  the path (`/users/123/edit`), a selector proven on one record was not proven on the next
  (`/users/456/edit`), so knowledge never grew on those pages, and the id was written into the
  route of every knowledge row.
decision: |
  `knowledge.route_of`, shared by ingest, `proven_selectors` and spec validation, returns the
  path with identifier segments as `:id` by the request ledger's rule (`sanitize_endpoint`):
  numbers, UUIDs, long hex and token shapes. Route words stay apart (`/users/:id/view` is not
  `/users/:id/edit`). A navigation row keeps the step's own URL in its body, the address a next
  draft can open. Rows recorded under a raw id route match nothing until re-proven.
rationale: |
  One segment rule for the ledger and the knowledge store means a page is the same page in both,
  and the rule already distinguishes ids from route words on the shapes it was hardened against.
alternatives:
  - option: Let the draft name a route pattern for each goto
    rejected_because: It adds a field the second agent must get right, and a wrong pattern would merge different pages.
evidence: [DEC-035, DEC-031]
evidence_notes: |
  `tests/checks/e2e_knowledge.py` (`e2e-knowledge`, `_check_dynamic_routes_share_a_scope`):
  `route_of` folds a number and a UUID and keeps `/settings/profile` and a slug; a selector
  proven on `/users/123/edit` is accepted on `/users/456/edit` and refused on `/users/123/view`,
  `/users` and a deeper path; every row is keyed by `/users/:id/edit`.
implementation:
  version: 3.8.1
  commits: [56c2a64766e3966d21c139458a24cab7c69b84ab]
  components:
    - core/evidence/e2e/knowledge.py (route_of through sanitize_endpoint)
    - docs/reference.md, docs/runtime-contracts.md
disposition:
  implementation_status: implemented
  validation_status: observed
validation:
  summary: |
    The e2e suites pass with the fake player. No real browser run on an app with id routes.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only e2e-knowledge` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
    - date: 2026-10-23
      job_id: "critical_interview 2026-10-23"
      description: "Maintainer testimony from a critical interview, not a re-countable run: browser verification is used routinely and reliably for CRUD, page navigation and whether elements appear; it does not judge visual quality. The testimony is about the browser runs as a whole; it does not show route folding on id routes. Not clean in the CONTRACT.md sense. The maintainer decided observed on 2026-10-23."
      clean: false
trade_offs:
  better:
    - Selectors proven on one record are proven on every record of that page.
  worse:
    - Selectors proven on an id route before this lose their rank until a clean run re-proves them.
limitations:
  - A slug segment (`/posts/my-first-article`) stays its own route, so knowledge on slug pages does not carry over.
  - DEC-035's token heuristic can still fold a long lowercase route word with digits to `:id`.
  - A purely numeric route word is folded as an id, so `/reports/2024` and `/reports/2025` are one route and share proven selectors (pinned in `_check_dynamic_routes_share_a_scope`).
revisit_when:
  - Two pages that share a folded route need different selectors, or slug routes stop gaining proven selectors.
revises: [DEC-035]
questions: [RQ-06, RQ-14]
