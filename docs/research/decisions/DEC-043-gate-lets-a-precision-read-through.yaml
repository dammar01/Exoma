schema_version: 3
id: DEC-043
title: The pre-flight gate lets two small project reads through per delegation
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: A gate refusal in real use that the prompt allowed; the size limit is the maintainer's choice from a stated rationale, not a measurement
problem: |
  The bundled CLAUDE.md lets the main agent read a small, high-precision slice itself (one or
  two anchors) to attribute a claim to file:line, and to reuse evidence already in context.
  The intent-gate-check hook knew no such exception: under any pending marker every Read of a
  project file was refused until `.workflow/run` dispatched. In real use the main agent, asked
  to narrow an earlier plan, reused two earlier delegations and tried one 210-line Read of a
  component; the hook refused it and the agent paid a further delegated call for it. The
  prompt allowed what the hook forbade, with no number either could share.
decision: |
  Under any marker a Read passes as a precision read when it names an existing file inside the
  project root (relative paths resolve against it, links followed), not under `.workflow/`,
  whose span is at most 200 lines (`limit` 1..200, or no `limit` on a file of at most 200 lines
  and at most 1 MB), and fewer than two precision reads passed under this marker. The count is
  kept in `runtime/delegated.reads`, keyed to the marker's `set_at`, so a new marker starts from
  zero and nothing has to delete it. A marker without `set_at` opens no such lane. The block
  message names the rule, or says the two reads are used. CLAUDE.md states the same numbers.
  Both hook flavours carry the same rule.
rationale: |
  The exception is for attribution, not gathering: one function or component with its context
  fits in about 200 lines, roughly 2-2.5 thousand tokens, against delegated calls of 342-851 s
  (CASE-006). The count, not the line limit, is what stops a sweep of many files in slices;
  two matches the "one or two anchors" the prompt already names.
alternatives:
  - option: 250 lines per read
    rejected_because: The maintainer asked for a figure not fitted to the one real case; 200 covers one anchor with context and was chosen.
  - option: A line limit without a count
    rejected_because: A sequence of small slices becomes the bulk gather the gate routes to second_agent.
  - option: Leave the hook strict and tighten the prompt instead
    rejected_because: The maintainer wanted small reads to stay allowed.
evidence: [DEC-032, DEC-039, CASE-006]
evidence_notes: |
  `tests/checks/intent_gate.py` (`gate-prompt-field`, `_check_precision_read_lane`), both
  flavours: a 200-line slice of a 500-line file and a 200-line file read whole pass; a 201-line
  span, a whole 500-line file, a file outside the project, a `.workflow` file, a missing file,
  a non-numeric limit, a third read, and Grep are refused; a new marker starts a new count and
  a relative path resolves to the project; a marker without `set_at` opens nothing. The real
  refusal is summarised without its project content.
implementation:
  version: 3.8.1
  commits: [a06846a20faae5e6950f3af43d679c3805ff7409]
  components:
    - dist/config/claude/hooks/intent-gate-check.ps1, intent-gate-check.sh (precision read lane)
    - dist/config/claude/CLAUDE.md (Pre-flight gate numbers)
    - docs/reference.md, docs/runtime-contracts.md
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The gate suites pass on Windows and, with pwsh 7.4, on Linux. The case that prompted it
    (a 210-line read) is still refused at 200 lines; no real session has used the lane yet.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only gate-k5-fixtures --only gate-runner-parsed` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - The prompt's small-slice exception now has numbers the hook enforces, so the two no longer disagree.
    - Attribution of one or two anchors costs a read instead of a delegated call.
  worse:
    - Two files of up to 200 lines each can enter the main agent's context before delegation.
    - The count is per marker, not per turn; a marker that is never cleared keeps its spent count.
limitations:
  - Offset is not bounded; two 200-line slices can come from anywhere in a file.
  - Only a read without `limit` counts the file's lines; a file over 1 MB read whole is refused, while a `limit` read of it passes.
revisit_when:
  - Sessions show agents spending both reads and then delegating anyway, or reading slices in place of delegating.
revises: [DEC-032, DEC-039]
questions: [RQ-10]
