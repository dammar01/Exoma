schema_version: 3
id: DEC-067
title: The plan-execute-verify chain is runtime state, and hooks gate what is deterministic
date: 2026-10-20
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: DEC-046's deferred alternative, taken up after the maintainer chose to move prompt-only rules into the runtime
problem: |
  Every rule of the plan -> `/.execute -y` -> `/.verify` chain was prompt-only (DEC-046):
  `/.execute` had no Python path, so "edit only with an approved proceed plan", "only after
  the user's own `-y`", "only files in scope", "never write another project", "commit only
  when asked" and "never say done before verify" depended on the agent remembering them.
  CASE-018 showed the agent editing 68 times without `-y` and writing a neighbouring
  repository. DEC-046 deferred hooks because a hook classifying prose would block legitimate
  work on ambiguous words.
decision: |
  The chain becomes state a hook can read, so the gates stop depending on prose:
  - `plan-record` validates the main agent's plan document: a `proceed` with open questions,
    a solution_path below high, an empty `files` scope, an option without a `minus`, or not
    exactly one recommendation is refused (`plan_invalid`).
  - The UserPromptSubmit hook writes `execute.token` only for the user's own `/.execute -y`
    (typed or as the expanded slash command) and `commit.marker` for a prompt asking to
    commit; turns the user did not write approve nothing (DEC-059).
  - `execute-begin` needs the recorded `proceed` plan and a token younger than 15 minutes,
    consumes it, and opens `execution.json` scoped to the plan's files; `execute-end`
    closes it as implemented; a finished verify writes its verdict (`syntax_only` for a
    parse check, never `pass`).
  - Hybrid rollout: the `execution-gate` PreToolUse hook BLOCKS a Write/Edit outside the
    project root (temp dir, ~/.claude and `policies.write_allowed_outside_root` excepted),
    a Write/Edit inside the root outside an active execution's scope, and `git commit`
    without the marker. The `status-guard` Stop hook only WARNS when a reply claims
    completion while verification is `not_run`. `policies.enforcement` = hybrid | warn | off.
  Not built: validators for refactor, review and memory — none has a deterministic signal a
  hook can check, and a word-list guess would be the false-block DEC-046 rejected.
rationale: |
  DEC-046's objection was to a hook reading intent from prose. Every blocking gate here reads
  a file the runtime or the user's own prompt wrote, or a tool argument (a path, a command
  line), so it decides the same way every time. The one rule that is inherently about prose
  — the words used before verify — is warned on, not blocked. Writes with no active
  execution still pass, because `/.refactor` and small fixes the user points to edit without
  a plan by design.
alternatives:
  - option: Hook-only enforcement reading the transcript for plan and approval text
    rejected_because: The main agent's plan never reached the runtime, so a hook would have to parse prose — the false-positive shape DEC-046 rejected.
  - option: Block every in-root write without an active execution
    rejected_because: Blocks /.refactor, memory notes and the small fixes the user points to.
  - option: Warn on everything first, block only after measuring false positives
    rejected_because: The maintainer chose hybrid; the deterministic gates have no prose to misread.
evidence: [CASE-018, DEC-046]
evidence_notes: |
  Research charter §12 for this mechanism —
  research question: does moving approval, scope and verification gates from the prompt into
  runtime state cut violations without false blocks that interrupt legitimate work (RQ-10)?
  hypothesis: edits without `-y`, writes outside scope or root, unrequested commits and
  done-claims before verify fall to near zero, with false blocks below a rate not yet chosen
  (H-022, draft). variable changed: who enforces the gate — the model's compliance, or the
  runtime and hooks. experiment enabled: blocks, warnings and overrides per session before and
  after (EXP-014, draft), joined with task-events edit/verify sequences. expected measurement:
  gate blocks, warnings and enforcement overrides per session; tasks closed without verify.
  why existing mechanisms are insufficient: execute had no runtime entry, and the intent gate
  checked neither token, scope nor verify status. complexity introduced: three local commands,
  two hooks, three runtime files per session, two policy keys, skill and installer template
  changes.
  Tests: tests/checks/execution.py (suite execution-chain) and the execution-gate,
  status-guard and intent-gate-set cases of tests/checks/hook_contract.py (suite
  hook-launchers), run through the real bash launchers on Windows.
implementation:
  version: 3.9.0
  commits: [f63e1b7]
  components:
    - core/runtime/execution.py (plan record, execute begin/end, verification)
    - main.py (plan-record, execute-begin, execute-end; verify writes its verdict)
    - core/evidence/contract.py (error types)
    - dist/config/claude/hooks/intent-gate-set.py (execute.token, commit.marker)
    - dist/config/claude/hooks/execution-gate.{sh,py}, status-guard.{sh,py}, workflow_hooks.py
    - dist/config/claude/settings.template.json, core/runtime/config_defaults.py (enforcement keys)
    - dist/config/claude/skills/{execute,plan,verify,commit}.md, dist/config/claude/CLAUDE.md
    - docs/reference.md, docs/runtime-contracts.md, docs/team-guide/troubleshooting.md
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    Covered by the execution-chain and hook-launchers suites on Windows. No real-use session
    has run with the hooks installed; the Stop hook's reliance on `last_assistant_message` or
    the transcript's last assistant entry has only been exercised with fixture payloads.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only execution-chain --only gate-prompt-field --only hook-launchers` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - An execution cannot start without a sound proceed plan and the user's own -y
    - Edits outside the agreed scope and writes into another project are refused, not just discouraged
    - A commit happens only in a turn where the user asked for one
  worse:
    - The main agent has two more runtime calls per execution and one per plan
    - A plan whose scope missed a file stops the execution until a revised plan and a new -y
    - Shell-script writes are still not checked; the gate covers Write/Edit only
limitations:
  - Writes through Bash or scripts bypass the scope and root gates
  - The done-claim guard is a word list and only warns
  - A user who types "/.execute -y" approves whatever plan is recorded at that moment
revisit_when:
  - Real use shows blocks the user had to override, or edits that reached files through scripts
questions: [RQ-10]
revises: [DEC-046]
