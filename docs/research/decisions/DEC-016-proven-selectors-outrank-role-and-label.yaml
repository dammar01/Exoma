schema_version: 2
id: DEC-016
title: Proven selectors — source data-e2e and knowledge-store matches — outrank role and label
date: 2026-09-29
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: "maintainer rationale (knowledge from earlier browser testing); DEC-004 validation; knowledge.py reading"
revises: [DEC-004]

problem: |
  This is a case of RQ-06: does stored knowledge change later behavior? `data-e2e`
  attributes and selectors that passed earlier runs are knowledge built from browser testing,
  but the fixed order role > label > e2e > text > css (`spec.SELECTOR_RANK`) puts them behind
  role and label. DEC-004 records `data-e2e` in 146 and 10 source files of the two projects
  that use browser verification, yet no run has driven an element through the `e2e` locator:
  `label` always matched first. The browser knowledge store (`e2e/knowledge.py`) records
  selectors that matched exactly one element in a clean first-attempt run, with a pass count
  and a source anchor, but it stores the whole candidate list, not which candidate matched,
  and drafts receive it only as hints to re-derive.

decision: |
  - Two kinds of candidate may be ranked ahead of role and label:
    an `e2e` candidate with provenance `source` and a valid source reference, and a candidate
    that matched in a recorded knowledge entry (new provenance `proven`).
  - The knowledge store records which candidate matched, so `proven` names one selector.
  - Staleness: a `proven` candidate that misses once drops to the usual order on the next run;
    two consecutive misses retire the entry (existing `STALE_AFTER_FAILS = 2`); an entry whose
    anchored source line is gone is pruned (existing `prune`). A miss is matched to the store
    by selector, not by the step's key, because a draft that puts a proven selector first has
    a different candidate list.
  - `proven` is checked against the store when the scenario is validated; a draft cannot
    promote its own guess.
  - A source `e2e` may lead only with a `path:line` ref to a template file inside the project
    whose cited line has an opening tag with `data-e2e` set to exactly that value, outside an
    HTML comment, checked at validation the way the tagging pass reads a cited line (a bare
    path, a `req:` ref, a prefix match, prose, or a binding is a guess wearing a citation).
  - An anchored proven selector is offered only while its source line exists, checked when the
    proven list is read rather than left to `clean`. A step that fails after its proven
    selector matched does not count as a miss.
  - Implementation deviation: the application fingerprint is not consulted. It hashes HEAD
    and the diff, so every commit would retire every proven selector; demotion on the first
    miss and anchor pruning carry the staleness instead.
  - Every other candidate (existing_test, runtime_probe, heuristic) keeps
    role > label > e2e > text > css; validation still refuses any other out-of-order list, and
    old role-first drafts stay valid.
  - A heuristic candidate is never ranked first and never proposed for promotion.

rationale: |
  An attribute a developer placed for tests, or a selector a run already proved, is the most
  stable handle known; role and label follow copy and translation. Restricting precedence to
  source and proven provenance keeps guesses from jumping the order, and demotion on the first
  miss limits the cost of stale knowledge.

alternatives:
  - option: e2e first for all candidates
    rejected_because: Rejected by the maintainer — a guessed data-e2e would outrank a real role.
  - option: Only source data-e2e first, knowledge store unchanged
    rejected_because: Rejected by the maintainer — selectors proven by earlier runs are the same kind of knowledge.
  - option: Keep role first and adjust prompt guidance only
    rejected_because: The e2e locator stays unexercised whenever a label exists (DEC-004 validation).

evidence: [DEC-004, DEC-010]
evidence_notes: |
  Draft it draws on (git-ignored, named as text): H-004.
  Research question: RQ-06.
  DEC-004 validation (2026-09-28): job_20260928_034916_758883 matched candidate 0 (`label`).
  Code at the time: core/evidence/e2e/spec.py (line 47 PROVENANCE, 52 SELECTOR_RANK, 553-580
  order validation), core/evidence/e2e/knowledge.py (lines 164-175 selector rows store the
  candidate list, 236-245 stale after two fails, 405-416 offered entries, 438-458 prune),
  core/evidence/e2e/runner.py (repeat-brake fingerprint).

implementation:
  version: 3.8.0
  commits: [f6edbef]
  components:
    - core/evidence/e2e/spec.py (provenance `proven`, leads_rank, proven checked against the store)
    - core/evidence/e2e/knowledge.py (matched candidate, proven_selectors, miss demotion by selector, sidecar `proven`)
    - core/evidence/e2e/runner.py (proven selectors passed to validation)
    - core/prompt/prompt_builder.py, dist/config/claude/skills/verify-browser.md
    - docs/runtime-contracts.md, docs/reference.md
    - tests/checks/e2e_knowledge.py

disposition:
  implementation_status: implemented
  validation_status: not_validated

validation:
  summary: |
    Planned. Offline: a source e2e or proven candidate first is accepted; a heuristic first is
    refused; an old role-first draft is accepted; a proven candidate demotes after one miss and
    retires after two; a fingerprint change withholds knowledge. Real use: a clean run on a
    maintainer project that matches a source or proven candidate ranked first — which also
    completes DEC-004's pending validation.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only e2e-knowledge --only e2e-tagging --only e2e-browser` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false

trade_offs:
  better:
    - Selectors survive copy and translation changes where data-e2e or proven knowledge exists.
    - Stored browser knowledge changes the next draft instead of staying a hint.
  worse:
    - The rank rule has two exceptions; validator, store and prompt carry more paths.
    - A proven or e2e selector passes without checking the element's accessible name.
limitations:
  - Knowledge is per origin; the same app on another host starts without it.
  - The citation check is a regex reading of the line, as in tagging, not a parser; markup built inside a string in a template can still read as an element.
revisit_when:
  - Proven or source e2e candidates miss more often than role/label on the same elements.
  - Accessibility regressions go unnoticed because these candidates bypass role/label.
questions: [RQ-06]
