schema_version: 3
id: DEC-037
title: The installer owns a hook by the folder its script sits in, and graph-refresh keeps its lock honest
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: high
  basis: Local branch review of DEC-030 and the graph-refresh hook before release; confirmed by reading
problem: |
  The installer decided which settings.json hooks were its own by script name alone, so a
  user's `~/tools/task-events.sh` or `session-bind.ps1` was refreshed, relocated or stripped
  as if it were ours. Uninstall collapsed blank-line runs across the user's whole CLAUDE.md,
  not only where the managed block was cut. In graph-refresh, `GRAPH_REFRESH_LIMIT_S` had no
  bound against the 900 s lock age, so a long refresh read as stale and a second graphify
  could start, and the `.sh` hand-off could recreate a lock its worker had already removed.
decision: |
  A hook command is ours only when its script sits in the installed hooks folder,
  `<home>/.claude/hooks/<name>.ps1|.sh`, under the install home or a home alias or home-shaped
  path, and the name is shipped or retired; a command mixing our script with another is the
  user's. Uninstall tidies only the seam where the block was cut. The refresh limit is capped
  at 840 s in both flavours, and a test keeps the hook constants and `graph_index` in step.
  The lock passes from hook to worker only while it still carries the hook's token.
rationale: |
  DEC-030 made the installer's failure paths truthful; deleting a user's own hook is the same
  kind of untruth about what the installer owns.
alternatives:
  - option: Keep ownership by name and warn on collisions
    rejected_because: The collision is invisible to the user until their hook stops running.
evidence: [DEC-030, DEC-012]
evidence_notes: |
  `tests/checks/installer.py`, `installer_uninstall.py`: a same-named user hook elsewhere
  survives install and uninstall; every shipped command shape is still recognised; blank runs
  elsewhere stay byte-identical. `tests/checks/graph_refresh.py`: the limit clamps in both
  flavours, the constants agree, a finished worker's lock is not recreated.
implementation:
  version: 3.8.0
  commits: [687a7021bdb99b749cbdfaad7e0d8ead340b75dc]
  components:
    - installer/settings.py (ownership by folder)
    - installer/uninstall.py (seam-only tidy)
    - dist/config/claude/hooks/graph-refresh.ps1, graph-refresh.sh (limit cap, token hand-off)
    - core/graph/graph_index.py (constant tied to the hook)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The suites above pass on Windows; the `.sh` graph hook ran through its embedded Python.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only installer-stale --only installer-settings --only graph-refresh` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - A user's own hooks survive install and uninstall.
  worse:
    - An entry written under a home path that is not home-shaped (an old sandbox home) is no longer refreshed; install adds a new entry beside it.
limitations:
  - The stale-lock reclaim in graph-refresh is still check-then-act between two hooks.
revisit_when:
  - Users report duplicated workflow hook entries after upgrading.
revises: [DEC-030]
questions: [RQ-07a, RQ-13]
