schema_version: 3
id: DEC-066
title: Facts validate every anchor, rank by weighted overlap, keep what is used, and are measured
date: 2026-10-20
status: accepted
provenance:
  type: observed
  confidence: low
  basis: source reading during the CASE-024 session; the numeric defaults are not measured
problem: |
  The fact store validated only a claim's first `file:line`, so a claim citing one real and
  one missing file was stored whole. Retrieval served any fact sharing one lowercase token
  with the task, including function words and generic path segments, so an English task
  matched almost every fact and an Indonesian one only through identifiers; ties had no
  order. The store kept its newest 500 facts regardless of use, had no claim-length limit,
  and nothing recorded how many facts were offered, served or refused, so none of these
  limits could be tuned from data.
decision: |
  Ingest requires every cited anchor to resolve; extra anchors ride in `anchors[]` beside the
  primary one, and a fact is served or kept by prune only while all of them can be placed.
  Claims longer than `fact_max_claim_chars` (400) are refused. Retrieval scores a shared
  identifier 2, a shared word 1 and a path-only token 0.5, ignores English and Indonesian
  function words and generic path segments, serves only at or above `fact_min_relevance`
  (2.0), breaks ties on identifier hits then recency, and limits per role
  (`fact_relevant_limits`, exploration 3, reasoning 4). Promoted knowledge is ranked with the
  same function. Served facts' hits and last use go to a sidecar; eviction past
  `fact_max_facts` keeps the most used, then most recently used. Each exploration or
  reasoning call reports `meta.facts`, the usage row carries the counts, and the report has a
  `facts` section (`runtime.fact_lifecycle@1`).
rationale: |
  A fact is only as fresh as its weakest citation. The scoring keeps the old model's
  simplicity — token overlap, no embeddings, stdlib only — and removes the two biases that
  made it noisy. Use is recorded in a sidecar written without the fact lock, so reads never
  wait on ingest. The defaults were chosen without data, which is why the counts ship with
  them: H-021 and EXP-013 (drafts) define how to calibrate them.
alternatives:
  - option: Keep validating the first anchor and drop facts later at read time
    rejected_because: A fact that was false at birth would be injected until its first anchor moved.
  - option: Embedding similarity for retrieval
    rejected_because: Adds a dependency the shipped runtime does not take (stdlib only), with no measurement that overlap is the bottleneck.
  - option: Per-category recurrence thresholds
    rejected_because: Recurrence applies only to grounded claims, which carry no category; the categorised durable facts bypass recurrence already. Not implemented.
evidence: []
evidence_notes: |
  tests/checks/facts.py (suite fact-selection): a claim with one bad citation or longer than
  the limit is refused and counted; extra anchors are stored and a change to one drops the
  fact at read and prune; an Indonesian task finds a fact through its identifier while
  function words and generic path segments match nothing; an identifier outweighs a word;
  per-role and scalar limits resolve in order; a served fact survives eviction over newer
  ones. tests/checks/telemetry.py: counts reach the usage row, sit on the final row of a
  continuation, and older rows are unrecorded rather than zero.
implementation:
  version: 3.9.0
  commits: [f63e1b7]
  components:
    - core/evidence/fact_store.py (multi-anchor ingest, relevance, per-role limit, usage sidecar, eviction)
    - core/knowledge/retrieve.py (shared relevance)
    - core/runtime/config_defaults.py (fact policy keys)
    - core/provider/executor.py, core/evidence/contracts.py, core/audit/telemetry.py, core/audit/metrics.py (lifecycle counts)
    - docs/reference.md, docs/evaluation/metrics.md
disposition:
  implementation_status: implemented
  validation_status: observed
validation:
  summary: |
    Covered by the fact-selection and telemetry suites on Windows. The ranking was compared
    with the old one-token rule on recorded tasks by EXP-013 and EXP-016 (counterfactual
    replays: more facts served, no more cited; the reasoning limit explains the excess).
    Weights, floor and length remain unmeasured on their own.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only fact-selection --only anchor-relocation --only evidence-anchor-relocation --only facts-concurrency` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
    - date: 2026-10-23
      job_id: "main_agent-workflow_20261023_082642459_3c69 delegated calls"
      description: "Live use: delegated explore and plan calls were served facts by the weighted rule (usage facts_* rows, served_facts in call meta). Its effect was measured only counterfactually (EXP-013, EXP-016). Not clean in the CONTRACT.md sense. The maintainer decided observed on 2026-10-23."
      clean: false
trade_offs:
  better:
    - A stored fact never carries a citation that did not resolve
    - Retrieval stops matching on grammar, and the selection is deterministic
    - Fact limits can now be tuned from counts instead of guesses
  worse:
    - Fewer facts are ingested and fewer served; recall may drop on tasks phrased without identifiers
    - Every served fact costs one small sidecar write per call
limitations:
  - The stopword lists cover English and Indonesian only
  - A lost update in the usage sidecar under concurrent calls loses one hit
revisit_when:
  - EXP-013 shows the floor drops facts the task needed, or serves facts it did not
questions: [RQ-06]
