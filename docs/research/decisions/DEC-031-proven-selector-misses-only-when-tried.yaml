schema_version: 3
id: DEC-031
title: A proven selector misses only when the browser tried it; a missing proven selector is grounded
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Branch review of DEC-016 before the 3.8.0 tag
problem: |
  DEC-016 demotes a `proven` selector that misses and retires it after two misses. A step with
  no matched candidate index counted every proven candidate as missed, including steps that
  failed before any selector was resolved (the page never became ready, an exception), which
  carry no selection at all. Two slow starts of a dev server could retire selectors that were
  never tried. And a step led by a proven selector that missed was classified `unknown` instead
  of `app` on a settled page, because `proven` was not among the grounded provenances.
decision: |
  A candidate is missed only when the browser counted it: its entry in
  `selection.match_counts` is not None. A step without a selection misses nothing; a step that
  failed after a candidate matched still misses only the candidates before it. `proven` joins
  `source`, `existing_test` and `runtime_probe` as grounded, so a missing proven selector on a
  settled page is the app's failure.
rationale: |
  The runtime contract already said a step that fails after it matched is not a miss; the same
  reasoning applies to a step that never looked. A selector proven by a passing run is at least
  as well grounded as one cited from source.
alternatives:
  - option: Scope proven selectors by route instead of origin
    rejected_because: A larger change to DEC-016's store; recorded as a limitation until a cross-page demotion is observed.
evidence: [DEC-016]
evidence_notes: |
  `tests/checks/e2e_knowledge.py`: not-ready and action-failed steps without a selection keep a
  proven selector; a step where every candidate was counted and none matched demotes it, and a
  second such step retires it; a missing proven selector classifies `app` on a settled page and
  `unknown` otherwise. Both tests fail without the change.
implementation:
  version: 3.8.0
  commits: [2d970d15974d74de91fd2b9fc901d4000c519b0d]
  components:
    - core/evidence/e2e/knowledge.py (_proven_missed)
    - core/evidence/e2e/classify.py (_GROUNDED)
disposition:
  implementation_status: implemented
  validation_status: observed
validation:
  summary: |
    Unit tests only; neither DEC-016 nor this change has run in a real Chromium session yet.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only e2e-knowledge --only e2e-hardening` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
    - date: 2026-10-23
      job_id: "critical_interview 2026-10-23"
      description: "Maintainer testimony from a critical interview, not a re-countable run: browser verification is used routinely and reliably for CRUD, page navigation and whether elements appear; it does not judge visual quality. The testimony is about the browser runs as a whole; it does not show how selector misses were counted. Not clean in the CONTRACT.md sense. The maintainer decided observed on 2026-10-23."
      clean: false
trade_offs:
  better:
    - Environment slowness no longer retires good selectors.
  worse:
    - A selector that is never reached because an earlier step keeps failing is never demoted.
limitations:
  - Proven selectors are still scoped to the origin, so a miss on another page of the same origin demotes them.
revisit_when:
  - A proven selector is retired by misses on a page other than the one it was proven on.
revises: [DEC-016]
questions: [RQ-14]
