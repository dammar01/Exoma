schema_version: 2
id: DEC-013
title: "Document the one-byte lock guards, and let `clean` remove those of dead sessions"
date: 2026-09-29
status: accepted
provenance:
  type: observed
  confidence: high
  basis: "maintainer question about always-empty lock files (CASE-007); source reading"

problem: |
  One-byte lock files that never change look like a defect (CASE-007). Three kinds of lock
  file exist, and only two leave files behind:
  - `sessions/<id>/runtime/lock.guard`: the runtime lock's transition guard
    (`core/workspace/runtime_lock.py` `_RuntimeTransitionGuard`), written with one NUL byte,
    locked with msvcrt/fcntl, and never removed — one per session (83 in this workspace).
  - `evidence.jsonl.lock`: the evidence store's lock file, persistent by the same pattern.
  - Stores on `utils/owned_lock.OwnedFileLock` (facts, e2e knowledge) use an `O_EXCL` lock
    file holding `{pid, token, at}` that is removed on release; none remained.
  `main.py clean` prunes jobs, facts, browser knowledge and old sessions, but not guards, and
  no document says what the files are.

decision: |
  - `docs/reference.md` explains the lock files: the guard is an advisory byte the OS lock is
    taken on, empty or one byte by design, not an ownership record.
  - `clean` removes a session's `runtime/lock.guard` only when that session has no live
    runtime lock and the guard can be locked exclusively at removal time; guards of live
    sessions are kept. `evidence.jsonl.lock` is kept: the store is shared and always live.
  - `clean` reports kept and removed guard counts; a second run removes nothing.

rationale: |
  The guard must outlive single holders, or two processes could lock two different files of
  the same name; removal is safe only for a session that can no longer take it. The
  maintainer's concern was clarity, so documentation comes first; pruning stops the per-session
  accumulation.

alternatives:
  - option: Unlink the guard on every release
    rejected_because: A guard unlinked while another thread or process waits on it breaks mutual exclusion.
  - option: Document only, never prune
    rejected_because: Rejected by the maintainer — guards accumulate one per session.
  - option: Delete guards by age
    rejected_because: Age says nothing about whether a session still holds its lock.

evidence: [CASE-007]
evidence_notes: |
  Research question: none — a maintenance clarification with a counted observation (CASE-007).
  Code at the time: core/workspace/runtime_lock.py (lines 22-69 transition guard),
  core/evidence/evidence_store.py (lines 28-49, 78-97), utils/owned_lock.py (lines 32-59,
  87-143), main.py clean branch (lines 309-330).

implementation:
  version: 3.8.0
  commits: [2dd7d7e]
  components:
    - core/workspace/runtime_lock.py (guard removal for dead sessions)
    - main.py (clean calls it, reports counts)
    - docs/reference.md (lock files explained)
    - tests/checks/runtime_guards.py

disposition:
  implementation_status: implemented
  validation_status: not_validated

validation:
  summary: |
    Planned. Tests: a live session's guard is kept; a dead session's guard is removed; a
    process taking the guard during clean keeps it (Windows and POSIX); clean twice removes
    nothing the second time. Real use: after clean in this workspace, guards remain only for
    live sessions (baseline 83, CASE-007).
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only runtime-guards --only process-identity --only byte-lock` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false

trade_offs:
  better:
    - An empty lock file is explained instead of looking like a bug.
    - Guards no longer accumulate one per session.
  worse:
    - clean takes one extra lock per guard.
limitations:
  - A session revived after clean recreates its guard; counts vary with activity.
revisit_when:
  - A race test shows a guard removed while a process was opening it.
questions: [RQ-13]
