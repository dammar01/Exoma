schema_version: 3
id: DEC-051
title: Rework counts the verify rounds after a failure, not every round after the first
date: 2026-10-09
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Maintainer review of task classification for plans built and verified phase by phase
problem: |
  `rework()` counted a correlation id as reworked whenever it held more than one judged verify
  round, whatever the verdicts. A plan carried out in phases verifies each phase, and every
  verify in the session adopts the plan's correlation id, so four phases that each passed read
  as one reworked task with three extra rounds: planned work counted as work that came back.
decision: |
  A correlation id is reworked when, with its judged rounds ordered by `recorded_at`, a round
  that did not pass (`accepted=False`: derived `fail` or `incomplete`) is followed by another
  judged round. `extra_verification_rounds` counts the rounds after that first failure. Rounds
  that all pass are not rework; a failure with no round after it is not rework either, since
  first-pass correctness already counts it. The report key and its fields are unchanged. The
  metric is registered as `runtime.rework@1`; it had no registry entry before.
rationale: |
  Rework is meant to say how often work came back, beside first-pass correctness. A passing
  round followed by another passing round is progress, not a return. `incomplete` stays a
  failure because `accepted` already treats it as one and the maintainer chose to keep that.
alternatives:
  - option: Keep the formula and document the key as "verify rounds per correlation id"
    rejected_because: The key would keep the name rework while counting planned phases; a reader of the report would still read it as work that came back.
  - option: Count only `fail` as a failure, not `incomplete`
    rejected_because: The maintainer chose to follow `accepted`, which counts both as not passed.
evidence: [DEC-020, DEC-026]
evidence_notes: |
  core/audit/telemetry.py rework() before this change: `if len(verdicts) > 1` with no verdict
  check. Verify adopts the active plan's correlation id within a session
  (core/provider/executor.py, plan chain in core/runtime/state.py).
implementation:
  version: 3.8.2
  commits: [9e32676]
  components:
    - core/audit/telemetry.py (rework() orders rounds by recorded_at and counts rounds after the first failure)
    - core/audit/metrics.py (registry entry runtime.rework@1)
    - docs/evaluation/metrics.md (rendered registry row)
    - docs/reference.md (report `rework` definition)
    - tests/checks/telemetry.py (verdict matrix, incomplete, timestamp order)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    Covered by unit checks only. Not yet recounted on real usage streams.
  runs: []
trade_offs:
  better:
    - Plans verified phase by phase no longer inflate rework.
    - Rows appended out of order are judged in time order.
  worse:
    - Rework figures from before this change are not comparable with later ones.
    - A pass followed by a fail with nothing after it is invisible to rework; only first-pass and acceptance show it.
limitations:
  - Correlation ids stay session-scoped, so a feature continued in another session is a separate group whatever this rule says.
  - Rows with an empty `recorded_at` sort first; written rows always carry one.
revisit_when:
  - A phase or plan identity is recorded, letting rework be counted per phase instead of per correlation id.
questions: [RQ-07a]
