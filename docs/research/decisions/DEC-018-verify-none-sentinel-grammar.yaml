schema_version: 2
id: DEC-018
title: A verify section that says nothing was found is read as empty in the spellings agents write, and the re-prompt names `- none`
date: 2026-10-01
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: "false fail verdicts on clean verifies, in maintainer use (CASE-009) and in the session that recorded this"

problem: |
  The verify contract demands an explicit "nothing found" in every section, and the parser
  accepted one spelling: `none`, `(none)`, `n/a`, `not applicable`, optionally with a note in
  parentheses. Agents also write `none.`, `none; all clean`, `none — checked X, clean`,
  `tidak ada`. Each was read as an untagged finding; in `blocking_findings` an untagged
  finding blocks, so a clean DONE became `fail`. The continuation then asked for the same
  findings again "with tags, no removals", and for the verdict to change "not the findings",
  so the agent tagged its own "none" as a high, introduced, in-scope finding and the false
  fail was locked in.
decision: |
  1. The sentinel is a whole phrase — none, (none), n/a, not applicable, nothing, nothing
     found, nothing to report, no (blocking) findings/issues/escalations/notes, tidak ada,
     tidak ada temuan/masalah/isu/catatan/eskalasi — optionally followed by closing
     punctuation, a parenthetical note, or a separator (; : , — – -) and a note.
  2. A parenthetical note is free unless it carries tag fields, as before: the verify prompt
     asks for `- none (say why: what you checked)`. A note after a separator must be,
     whole, a neutral phrase from a closed list (clean, all clean, ok, nothing found,
     nothing blocking, nothing to report, no issues, bersih, semua bersih, tidak ada temuan).
  Still a finding: a sentinel word running into text with no separator (`none of the
     callers handle X`), any note with tag fields, any other separator note
     (`none - caller X fails`, `none; all inspected paths are clean`), and text spanning
     lines. The continuation then asks for `- none`.
  3. The continuation for invalid tags and for a verdict mismatch tells the agent that an
     entry which only says nothing was found is written as exactly `- none`, without tags,
     and the verdict kept.
  The E2E reviewer normalizer reads the same sentinel object. It joins continuation lines
  into an item and judges the first line, so an item that continues on further lines is
  empty only in the plain forms (`none`, `none (why)`), as before this decision.
rationale: |
  Fixing it at the parser stops the false fail without a second provider round, and also
  corrects `check.py` on stored replies. The continuation change covers spellings the
  grammar still does not take, without the parser having to guess.

alternatives:
  - option: Keep the strict parser and fix only the continuation, asking the agent to rewrite to `- none`.
    rejected_because: every variant would still cost a continuation round, stored replies would still fail `check.py`, and a continuation that fails leaves the false fail in place.
  - option: Accept any note after a separator as long as it carries no tag fields (the first implementation).
    rejected_because: a delegated verify of it showed `none - caller X fails` read as empty, dropping a real finding; the contract is fail-closed for blocking findings.
  - option: Accept a separator note that ends saying clean and contains no problem word from a list (the second implementation).
    rejected_because: two delegated verifies in a row each found a problem word missing from the list (issue, problem, defect, concern) that let a finding read as empty; a blocklist cannot be complete, a closed list of neutral phrases can.
  - option: Accept any text after a sentinel word.
    rejected_because: 'phrases such as "none of the callers handle X", "tidak ada validasi untuk X" and "no check on X" are findings, and would be dropped.'
  - option: Reject a note that cites file:line, as a sign of a concrete claim.
    rejected_because: "the verify prompt asks for `- none (say why: what you checked that came back clean)`, so the honest form cites what was checked; it would turn clean replies into findings."

evidence: [CASE-009]
evidence_notes: |
  A read-only scan of active verify artifacts across the maintainer's projects found two
  replies whose only blocking entries were none-like (one inline `none`, one `tidak ada`)
  with a derived `fail`; a third, in the session that recorded this, failed after the
  continuation tagged a "none; all inspected paths are clean" entry. Tests:
  tests/checks/verify_gaps.py (accepted spellings, adversarial findings, E2E normalizer
  parity) and tests/checks/continuation.py (the re-prompt names `- none`).

implementation:
  version: 3.8.0
  commits: [cb7ee4e, 23250f1]
  components:
    - core/evidence/contract.py (_NONE_ITEM is a sentinel grammar with a fullmatch method)
    - core/provider/continuation.py (_VERIFY_WANT_BY_KIND names `- none`)
    - core/evidence/e2e/normalize.py (multi-line items take only the plain sentinel forms;
      23250f1 restored them to the old pattern word for word, after `none.` and `no findings`
      on a first line had hidden the finding written below them)
    - docs/reference.md (accepted spellings)

disposition:
  implementation_status: implemented
  validation_status: not_validated

validation:
  summary: |
    Unit tests pass. No delegated verify has yet been counted after the change; the share
    of verify rows derived `fail` with no tagged blocking finding is what to remeasure.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only verify-empty-section --only verify-gaps` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false

trade_offs:
  better:
    - 'a clean verify is no longer turned into a fail by how it spells "nothing found"'
    - fewer continuation rounds on verify
  worse:
    - 'an honest separator note beyond the neutral list ("none; all inspected paths are clean") reads as a finding and costs a continuation round'
    - the grammar is a list to maintain
limitations:
  - The phrase list covers English and Indonesian only.
  - A parenthetical note is not inspected beyond tag fields, so `none (caller X fails)` still reads as empty, as it did before this decision.
  - The neutral-phrase list covers English and Indonesian only.
  - In the E2E normalizer, a plain `- none` whose continuation lines state a finding still drops it, as it did before this decision.
revisit_when:
  - A remeasurement still finds clean verifies derived `fail`, or a real finding is found dropped as a sentinel.
questions: [RQ-11]
