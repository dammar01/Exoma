schema_version: 3
id: DEC-052
title: A worker is killed only on a matched identity, and process identity and byte locks live in osutil
date: 2026-10-17
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Maintainer-requested OS-portability audit of the runtime; source inspection, no live macOS run
problem: |
  `JobManager._kill_worker` skipped a kill only when the recorded process generation was
  proven different. An unverifiable generation (nothing recorded, or nothing readable now)
  went on to `terminate_tree`, so a reaped worker's PID that the OS had handed to another
  process could be killed. Unverifiable is more common off Windows: `pid_create_time` is
  Windows only, and macOS depends on parsing `ps -o lstart=`. The identity algorithm
  (`/proc`, boot id, `ps`) was copied in `job_manager.py` and `runtime_lock.py`, and the
  `msvcrt`/`fcntl` byte-0 lock was written out four times (job guards, runtime transition
  guard, evidence lock, owned-lock reclaim guard), against `osutil`'s own claim that every
  platform branch lives there.
decision: |
  `osutil.process_identity` and `osutil.process_generation` replace both private copies.
  `process_generation` answers `matched`, `reused`, `dead` or `unverifiable`, and never
  `matched` without a comparison. `_kill_worker` kills only on `matched`; the other outcomes
  return a skipped kill naming `pid_reuse_detected`, `worker_dead` or
  `identity_unverifiable`, and the job is still failed and reaped. Admission, recovery and
  runtime-lock liveness keep their previous rules, expressed in the new outcomes.
  `osutil.open_lock_file`, `lock_file` and `unlock_file` are the only byte-0 lock; no other
  module imports `msvcrt` or `fcntl`. Lock paths, the one-NUL-byte file, `OwnedFileLock`'s
  `{pid, token, at}` owner and token-checked release, and the Windows delete-pending retry
  are unchanged. `osutil.pid_reused`, whose fail-open contract the kill no longer follows,
  is removed.
rationale: |
  The two errors are not symmetric. A missed kill leaves a stray worker whose job is already
  failed and whose capacity slot ages out; a wrongful kill ends a process that is not ours.
  Centralising the identity read makes the platform that cannot answer visible in one
  function instead of two divergent copies, and one lock primitive means a fix to locking
  semantics cannot miss three call sites.
alternatives:
  - option: Keep fail-open and only centralise the code
    rejected_because: The maintainer chose fail-closed; centralising alone would keep the wrongful-kill path the audit found.
  - option: Make every unverifiable outcome fail-closed, including admission and recovery
    rejected_because: Recovery and capacity already have age-based handling for it; changing them is a separate behavior change with its own failure modes (a job that never recovers).
  - option: Use psutil for identity and locking
    rejected_because: The runtime is stdlib-only and CI enforces it.
evidence: [DEC-042, DEC-050]
evidence_notes: |
  core/jobs/job_manager.py `_kill_worker` before this change: skip only on
  `alive and generation is False`. Duplicated identity code: job_manager.py and
  core/workspace/runtime_lock.py. Duplicated lock code: job_manager.py,
  runtime_lock.py, core/evidence/evidence_store.py, utils/owned_lock.py.
  Checks pass on Windows (native identity path); the `/proc` and `ps` paths ran in no
  session for this change.
implementation:
  version: 3.8.2
  commits: [uncommitted]
  components:
    - utils/osutil.py (process_identity, process_generation and PROCESS_* outcomes; open_lock_file, lock_file, unlock_file; pid_reused removed)
    - core/jobs/job_manager.py (private identity functions removed; fail-closed _kill_worker; _exclusive_file_guard on osutil locks)
    - core/workspace/runtime_lock.py (private identity removed; transition and orphan guards on osutil locks)
    - core/evidence/evidence_store.py (_EvidenceLock on osutil locks)
    - utils/owned_lock.py (reclaim guard on osutil locks)
    - docs/runtime-contracts.md (lock primitive; process identity and worker kill)
    - tests/checks/process_identity.py (generation outcomes, fail-closed kill, cross-process byte lock)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    Unit checks on Windows only. Linux `/proc` and macOS `ps` identity paths are untested in
    this change; CI's Ubuntu leg runs the same checks.
  runs: []
trade_offs:
  better:
    - A recycled PID is no longer killed when the recorded process cannot be compared.
    - One identity algorithm and one byte lock; the platform split is in osutil only.
  worse:
    - Where identity is unreadable, an overrunning worker is left running after its job is reaped.
limitations:
  - The macOS `ps -o lstart=` path is assumed stable and was not run.
  - A worker left running by a skipped kill is reported in the reap meta but not cleaned up later by anything.
revisit_when:
  - Stray workers are observed after reaps on a platform where identity is unverifiable.
  - A platform gains a cheap native create-time read that would make unverifiable rare.
questions: [RQ-07a]
