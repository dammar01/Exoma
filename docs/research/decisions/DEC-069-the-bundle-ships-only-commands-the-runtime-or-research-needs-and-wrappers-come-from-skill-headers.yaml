schema_version: 3
id: DEC-069
title: The bundle drops /.refactor, /.review and /.compress, and command wrappers are rendered from skill headers
date: 2026-10-21
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: a maintainer review of the 3.9.0 range; the wrapper and anchor defects were read off this repository and its own analysis runs
problem: |
  A review of the 3.9.0 range found four defects outside the runtime gates DEC-067 and
  DEC-068 built:
  - A. /.refactor was the one local skill that edited in bulk without a plan or an
    execution: CLAUDE.md exempted it from the execute chain, and its "zero behavior change"
    was a prompt promise with no validator (DEC-067 lists that validator as not built).
    /.review and /.compress used no second agent, measured nothing the research studies,
    and duplicated commands Claude Code and common plugins already ship.
  - B. Nineteen of twenty command wrappers carried the description "Run the <name> workflow
    skill (/. convention)" and no argument-hint, so the command list Claude Code shows
    explained nothing; the skill header two lines into each body already said what the
    command does. sync_skills checked that the sets of skills, wrappers and registry entries
    agree, not what a wrapper says.
  - C. `_FILELINE` admitted an optional drive letter with no left boundary, so a label in
    front of a path lent its last letter as a drive: `proof:core/x.py:200` was read as
    `f:core/x.py:200`, `proxy:core/a.py:5` as `y:core/a.py:5`. Two analysis runs of this
    review reported 1 of 57 and 12 of 73 anchors uncertified for that reason alone, and the
    anchor cap of DEC-064 lowered their confidence accordingly. The certify_claim_refs
    docstring said such refs were `not_a_file`; the code certified them against a path that
    does not exist.
  - D. docs/limitations.md still said /.execute had no Python path and no scope guard, and
    the reference's destructive-actions row said no hook stops a write to another project,
    though execution-gate blocks Edit/Write there since DEC-067; execute.md said Bash
    follows "the same rules" as Edit/Write a sentence before saying no hook checks Bash.
decision: |
  - Remove the refactor, review and compress skills and their wrappers, registry entries,
    NL-map lines, help lines, and the CLAUDE.md exemption that let /.refactor edit without a
    plan. A refactor goes through /.plan, /.execute -y and /.verify like any change. Installed
    copies are pruned by the stale-file pass of the installer when unedited.
  - A skill header carries `description:` on line 2 and an optional `argument-hint:` on
    line 3. `sync_skills --write` renders every wrapper from it (JSON-quoted values, which
    YAML reads as double-quoted strings), and `--check` fails when a wrapper differs.
  - The drive letter in `_FILELINE` must start a word (`(?<![A-Za-z0-9_])`); a labelled ref
    is judged by the path it wraps.
  - The stale passages are rewritten to say what is enforced (Edit/Write) and what is not
    (Bash/script).
rationale: |
  The bundle is the surface the research measures (CHARTER: delegation as resource
  allocation). A command that bypasses the execute chain weakens the one allocation DEC-067
  made measurable, and a command that delegates nothing adds prompt weight with nothing to
  measure. A wrapper that restates a second copy of the description drifts; deriving it
  keeps one source. The regex defect made the certification of DEC-064 under-report real
  files, which is the opposite error of CASE-024 and as misleading.
alternatives:
  - option: Keep /.refactor and add a behavior-preserving mode to /.plan
    rejected_because: The maintainer chose removal; a mode with no validator is the same prompt promise moved elsewhere.
  - option: Hand-write the nineteen wrapper descriptions and test only that none is generic
    rejected_because: Two copies of each description would remain free to drift; the test would catch one wording, not a wrong one.
  - option: Strip known labels (proof:, proxy:) before matching
    rejected_because: A list of labels grows with every provider's habits; a word boundary covers any label.
evidence: [DEC-064, DEC-067, CASE-024]
evidence_notes: |
  Regex probe in this session: the old pattern returned `f:core/x.py:200` and
  `y:core/a.py:5`; the new one returns `core/x.py:200` and `core/a.py:5` while keeping
  `C:\x\y.py:3`, `(E:\w\r.py:16)` and `E:/w/r.py:9` whole. tests/checks/contracts.py asserts
  these shapes and that labelled refs to real lines are certified.
implementation:
  version: 3.9.0
  commits: [8a88c2e]
  components:
    - core/evidence/fact_store.py (`_FILELINE` drive letter needs a word start)
    - core/evidence/evidence_store.py (certify_claim_refs docstring)
    - tests/checks/contracts.py (labelled-ref and drive-path regression)
    - tools/maintain/sync_skills.py (render wrappers from skill headers; --write, stale check)
    - dist/config/claude/skills/*.md (argument-hint lines; refactor, review, compress removed)
    - dist/config/claude/commands/*.md (regenerated; three removed)
    - dist/config/claude/CLAUDE.md (registry, NL map, refactor exemption, Edit/Write vs Bash)
    - docs/limitations.md, docs/reference.md, README.md, docs/team-guide/whats-included.md
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    sync_skills, sync_intent_map, gen_manifest and stamp_version checks pass on the working
    tree. On 2026-10-21 the suites covering it passed (see runs); no direct use yet.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only bundle-sync --only installer-stale --only contracts --only graph-refresh` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - The command list explains each command and its arguments.
    - No local skill edits outside the execute chain.
    - Labelled refs to real lines are certified.
  worse:
    - Users who typed /.refactor, /.review or /.compress lose them; an edited installed copy stays as an orphan skill.
    - Anchor ratios from before and after this change are not directly comparable.
limitations:
  - At commit 8a88c2e dist/config/claude/hooks still named refactor, review and compress (task-events LOCAL_SKILLS, the graph-refresh `[REFACTOR RESULT]` trigger, an execution-gate comment). Removed in 073eb82; tests/checks/bundle_sync.py now fails if task-events LOCAL_SKILLS drifts from the registry.
  - A word-start drive letter still matches a one-letter word followed by a colon and a path-like token.
revisit_when:
  - A measured need for a behavior-preserving change path that /.plan cannot express.
questions: [RQ-10]
