schema_version: 3
id: DEC-062
title: The verify test request belongs to the job created for it
date: 2026-10-19
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: CASE-023, a rerun after a failed verify ran the earlier verify's test request
problem: |
  `verify/tests.json` was consumed only after its tests ran and merged (DEC-029). Every verify
  that ended before that point (provider `ok: false`, invalid evidence, a refused run, a
  syntax-mode verify) left it, and it was keyed by session only, so the next verify ran the
  earlier choice silently on a changed tree (CASE-023).
decision: |
  `job_lifecycle.submit` calls `verify_tests.claim` right after it creates a new verify job:
  any claim an earlier job left is dropped, and `tests.json` is moved to `tests.claimed.json`.
  `run_worker` runs the job inside `verify_tests.job(job_id)`; within it `read_request` and
  `_consume` use the claimed file. A run without a job (an in-process `main.run`) reads
  `tests.json` only and never a claim, which a job that ended early left. Recovery and attach
  reuse the existing job and do not claim, so a recovered run still finds its request. A new verify without a new `tests.json`
  gets the `tests:` runtime gap (`incomplete`, exit nonzero). The path main_agent writes, and
  the gate's allowance for it, are unchanged.
rationale: |
  The job is the unit DEC-029 protected: recovery restarts the same job. Binding the request to
  job creation keeps that and closes every early exit at once, instead of consuming on each
  exit path. The verify skill already requires a request for every verify.
alternatives:
  - option: Stamp the request with a fingerprint of the diff and refuse it when the tree changed
    rejected_because: Needs a definition over staged, unstaged and untracked files, costs a scan on large trees, and a non-code change would read as stale.
  - option: Keep the behavior and only document the risk with a regression test
    rejected_because: The reported failure would remain.
  - option: Consume the request on the ok:false path
    rejected_because: A recovered run of the same job would lose it again, the failure DEC-029 fixed.
evidence: [CASE-023]
evidence_notes: |
  tests/checks/verify_tests.py (suite verify-runtime-tests) asserts: a second claim without a
  new request gives `requested: false` and `incomplete`; a recovered run finds its claim; a newer
  request replaces an older claim; consumption leaves only `tests.used.json`; and through
  `main.submit`, a new verify job claims, a recovery of the same job keeps the claim, and the
  job after a failed one drops it; a run without a job ignores a leftover claim; and through
  the real Executor with a provider returning `ok: false`, the failed job keeps its claim and
  the next job runs no test (`runtime_tests.requested: false`). The suite passes on Windows.
implementation:
  version: 3.8.4
  commits: [f2e967d]
  components:
    - core/evidence/verify_tests.py (claim, job context, claimed request file, consume)
    - core/jobs/job_lifecycle.py (claim on new verify job, job context around the worker's run)
    - tests/checks/verify_tests.py (regression and submit-level checks)
    - docs/reference.md (runtime tests), dist/config/claude/skills/verify.md, dist/manifest.json
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    Covered by the verify-runtime-tests suite on Windows; no live verify run after a real
    provider failure has been recorded yet. Not run on Linux or macOS.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only verify-runtime-tests --only e2e-routing` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - A verify never runs tests chosen for an earlier verify
    - A recovered run of the same job keeps its request
  worse:
    - A rerun without a new tests.json is incomplete instead of running the earlier tests
    - A refused or syntax-mode verify also uses up the request it found
limitations:
  - A claim that cannot be removed (an OS error) is kept and read by the next job
  - The job context is a context variable set around the worker's synchronous run; an apply moved to another thread would not see it and would find no request (incomplete, not stale)
revisit_when:
  - A recovered verify reports no test request although one was written
questions: [RQ-11]
revises: [DEC-029]
