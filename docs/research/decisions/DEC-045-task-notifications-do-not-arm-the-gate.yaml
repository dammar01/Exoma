schema_version: 3
id: DEC-045
title: A background task's notification neither arms nor clears the pre-flight gate
date: 2026-10-05
status: accepted
provenance:
  type: observed
  confidence: high
  basis: A false gate in real use on this repository, traced to the marker the notification wrote
problem: |
  Claude Code delivers a background task's completion to the session as a prompt, through the
  same UserPromptSubmit hook as the user's own messages. `intent-gate-set` classified its text
  against the NL map like any prompt. A notification for a delegated audit carried "analyze" in
  its task description, so the hook armed an `analyze` marker the user never asked for, and the
  next Bash call, a read of that very task's output, was refused. Because a notification
  usually arrives in the middle of a delegated flow, the same rule could also clear or replace
  the marker the user's prompt had just armed.
decision: |
  Both hook flavours return before classifying when the prompt, after leading whitespace,
  starts with `<task-notification>`. Such a prompt writes no marker and deletes none; the
  user's own prompt alone decides the gate. A user prompt that merely mentions the tag
  elsewhere is classified as before.
rationale: |
  The gate exists to hold the main agent to the user's request; text the user did not write is
  not a request. Leaving an existing marker in place keeps a delegation the user asked for
  armed while its own result arrives.
alternatives:
  - option: Remove delegated words from the NL map that notifications tend to carry
    rejected_because: Notification text includes task descriptions the agent wrote freely; no word list covers it, and it would weaken matching for real prompts.
evidence: [DEC-032, DEC-039, DEC-043]
evidence_notes: |
  Real use, 2026-10-05: the marker written on the notification held `prompt_excerpt` starting
  with `<task-notification>` and `command: analyze`; the escape flag was needed to read the task
  output. `tests/checks/intent_gate.py` (`gate-prompt-field`), every flavour: a notification
  matching the NL map leaves the user's marker byte-identical, arms nothing when no marker
  exists, also with leading whitespace, and a user prompt mentioning the tag still arms. The
  marker case fails against the previous hooks.
implementation:
  version: 3.8.1
  commits: [2110262217220b92ef1eb0d123a41d87fa52f1cd]
  components:
    - dist/config/claude/hooks/intent-gate-set.sh, intent-gate-set.ps1 (task notifications skipped)
    - docs/reference.md (gate)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The gate suite passes on Windows. No notification has reached the installed hook since the
    change.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only gate-prompt-field --only gate-runner-parsed --only gate-runner-tamper` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - A task's completion can no longer block the agent from reading that task's result.
  worse:
    - A user prompt that starts with the literal `<task-notification>` tag is not classified.
limitations:
  - Other host-generated prompts with a different wrapper are still classified as user prompts.
revisit_when:
  - Claude Code changes how it wraps task notifications, or another host-generated prompt arms the gate.
revises: [DEC-032]
questions: [RQ-10]
