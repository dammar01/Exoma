schema_version: 3
id: DEC-019
title: Research questions are answered or unanswered, and a validated decision is used, consistent, decided, and measured
date: 2026-10-03
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Maintainer critical interview 2026-10-03, checked against code, commits, and telemetry
problem: |
  Two rules of the research corpus disagreed with the maintainer's own principles.

  A research question had three states (proposed, partial, answered), and nothing told
  proposed from partial: both could list no records (CONTRACT.md §16). Six questions were
  `partial`, two `proposed` questions already listed records. The maintainer's principle is that
  a question is answered or not; a half answer is an unfinished one and invites bias.

  A decision was `validated` on one clean direct-use run. The maintainer's own test of a proven
  decision is repeated use with consistent results and an explicit decision, which a single run
  does not show, while the maintainer's word alone is the creator's evidence the maintainer named
  as possibly biased.
decision: |
  Schema version 3. `rq_status` is `answered | unanswered`. An answered question lists at least
  one `validated` record and carries a `decision` block (date, method `critical_interview`, a
  sanitized summary, never a transcript).

  A `validated` DEC carries four predicates in `validation`: `uses` >= 2, `consistent: true`,
  `maintainer_decision`, and a measurement (a clean run, or a `measurements` entry with a named,
  re-countable source). `partially_validated` and `rejected` keep the clean-run rule.

  Records tracked at version 2 are frozen on a closed list (`FROZEN_V2`), as version 1 was under
  DEC-017. The four decisions then `validated` (DEC-001, DEC-007, DEC-010, DEC-011) were
  re-evaluated in the interview and received the predicates as a new result; all four stayed
  validated. RQ-15 was declared answered; the other fifteen questions are unanswered.
rationale: |
  The validator is where a rule holds or does not: the move from Markdown to YAML (DEC-011) was
  made because rules that are only written down are not followed. A definition of "validated"
  kept in prose alone would repeat that. Repeated use and consistency are what the maintainer
  trusts; the measurement is what keeps the creator's view from being the only evidence.
alternatives:
  - option: Keep three question states and write a criterion for partial (partial = at least one record)
    rejected_because: The maintainer chose a binary status; progress already shows in `what_exists` and `records`.
  - option: Write the validated definition in CONTRACT.md only, validator unchanged
    rejected_because: An unchecked rule is the failure mode that led to DEC-011.
  - option: Grandfather the four validated decisions under the old rule
    rejected_because: The maintainer chose to re-evaluate them under the new definition.
evidence: [DEC-011, DEC-017, CASE-005, CASE-009]
evidence_notes: |
  Re-evaluation figures come from the private web project's quality stream (e2e_run rows
  2026-09-28..2026-10-02, counted 2026-10-03) and from git history of docs/research; each is
  named in the record it supports.
implementation:
  version: 3.8.0
  commits: [72c2ac7ec8444c2a23759009da878e91a7bb8b27]
  components:
    - docs/research/schema.yaml
    - docs/research/CONTRACT.md
    - tools/maintain/check_research.py
    - docs/research/questions/*.yaml
    - tests/checks/research.py
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    `check_research.py --git` passes on 38 records and the research suite rejects every new rule
    on a broken fixture. Not yet used beyond this change.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only research` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - A question's status says one thing, and an answered one points to a proven record and a decision.
    - Validated means repeated, consistent, decided, and measured, checked by the validator.
  worse:
    - "`consistent` is a declaration with its reason, not something the validator can measure."
    - Fifteen questions now read unanswered, including some with working mechanisms behind them.
limitations:
  - "`uses` for the re-evaluated decisions is counted from one private project's telemetry; another project would give other figures."
  - The interview summary is sanitized; the reasoning behind it is in the maintainer's memory, not in the repository.
revisit_when:
  - A question with real progress cannot be told apart from an untouched one in practice.
  - A validated decision later fails in use, which would show the four predicates are not enough.
revises: [DEC-011, DEC-017]
questions: [RQ-15]
