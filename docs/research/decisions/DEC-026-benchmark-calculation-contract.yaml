schema_version: 3
id: DEC-026
title: Benchmark figures follow a versioned metric registry and carry a provenance stamp; recounting is maintainer-only
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Maintainer critical interview 2026-10-04; inventory of the existing producers
problem: |
  Figures came from three producers (the runtime report and two offline measure tools) whose
  definitions lived in code. The same word named different quantities — "task" was a
  correlation id, a session run closed by a verify pass, and a labelled transcript; "saved" had
  three formulas — and the statistics differed (interpolated median, nearest rank, floor-index
  p90). Thresholds of the outcome rule were partly hard-coded, and no output said which tool
  version, parameters or inputs produced it, so a tracked record could not say exactly what its
  figure meant.
decision: |
  `core/audit/metrics.py` registers every figure under an ID and version (`outcome.solved@1`),
  with unit, statistic, definition, denominator and missing-data rule; distinct quantities get
  distinct IDs. Existing formulas are described, not changed, so recorded figures keep their
  meaning. The runtime report and both measure tools stamp a `provenance` block: registry and
  metric versions, tool commit (`+dirty` when uncommitted), parameters, and a content hash of
  the inputs with no paths. The outcome rule's thresholds become command-line flags with the
  former values as defaults. The registry is rendered in docs/evaluation/metrics.md and a test
  keeps the two in step. The research contract (§15) asks tracked records to cite registered
  figures as `<id>@<version>` with their provenance, and to state that real-use figures are
  recountable on the maintainer's machine only.
rationale: |
  Asked what the figures are for, the maintainer answered public claims and validating
  hypotheses; asked who must be able to recount them, the maintainer answered themself only. So
  the contract fixes the method and the provenance, which can be public, and is explicit that
  the data is not. Unifying the statistics was rejected because it would silently change
  figures CASE-011 and CASE-012 already recorded.
alternatives:
  - option: Unify all statistics on one percentile convention
    rejected_because: It would change recorded figures without a new measurement; the registry names each convention instead.
  - option: Publish a sanitized dataset so others can recount
    rejected_because: The maintainer chose maintainer-only recounting.
evidence: [CASE-011, CASE-012]
evidence_notes: |
  After the change, `measure_task_outcomes.py` with default flags reproduced CASE-012's totals
  (97 tasks, 68 solved, 47 clean, 21 fixed within 24 h, 13 partial, 9 not in main, 7 no change)
  and `measure_real_use.py` found the same 69 sessions for 3.7.3. `tests/checks/metrics.py`
  checks the registry, its documentation, the input hash, the report's stamp, the outcome rule's
  defaults and overrides, and both percentile conventions.
implementation:
  version: 3.8.0
  commits: [1301a3ef24a5499b2004e12f72aa79af9b886689]
  components:
    - core/audit/metrics.py (registry, provenance)
    - core/audit/telemetry.py (report provenance)
    - tools/maintain/measure_real_use.py, tools/maintain/measure_task_outcomes.py (provenance, flags)
    - docs/evaluation/metrics.md, docs/research/CONTRACT.md §15
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The metrics-contract suite passes and the measure tools reproduce CASE-011 and CASE-012
    counts. No record has yet been written citing a figure as <id>@<version>.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only metrics-contract` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - A cited figure names its exact method and the run that produced it.
    - Quantities that shared a word can no longer be compared by accident.
  worse:
    - Three statistic conventions remain, named rather than removed.
    - The registry is one more thing to update when a producer changes.
limitations:
  - The test checks the registry against its documentation, not against the producers' code; a formula change that forgets the registry is caught only by review.
  - Records frozen before this decision keep figures without IDs.
revisit_when:
  - A record needs to compare two producers' figures; that is the moment to unify a convention under a new version.
  - The maintainer decides real-use figures must be recountable by others.
questions: [RQ-15, RQ-02]
