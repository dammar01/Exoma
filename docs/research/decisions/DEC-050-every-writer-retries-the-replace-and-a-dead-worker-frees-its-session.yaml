schema_version: 3
id: DEC-050
title: Every temp-and-replace writer retries the replace; a dead worker frees its session for a different request
date: 2026-10-08
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Pre-release multi-round analysis of the 3.8.2 tree; gaps confirmed by code reading and DEC-049's own limitations
problem: |
  Two gaps left after DEC-049 stood between 3.8.2 and a stable release:
  - About a dozen writers outside the session and job records (fact store, recurrence cache,
    evidence store, e2e knowledge store and sidecar, graph stale cache, provider-version
    cache, migration index rewrite, main-session cache, installer receipt and ledger, opencode
    prompt file, `current/` screenshot, e2e tagging) staged and replaced on their own with no
    retry, so a reader holding the target on Windows failed the write.
  - A different request on a session whose job worker had died was refused as
    `job_already_running` before liveness was checked. Only the identical request recovered
    the job; any other request was blocked until someone ran `clean`.
decision: |
  - The shared layer gains `atomic_write_text(..., newline=, fsync=)`,
    `atomic_write_bytes(..., fsync=, mode=)` and a public `replace_with_retry`. Defaults keep
    every existing caller's behaviour (platform newline translation, no fsync).
  - Every listed writer goes through the helper. Each keeps its own error policy: the stores,
    installer and migration raise; the caches and the `current/` mirror swallow; the opencode
    prompt still becomes a structured error; the main-session cache keeps its fsync.
  - e2e tagging keeps its own staging, because its identity check must sit immediately before
    the move; it borrows only `replace_with_retry`.
  - `submit` on a different request first calls `release_dead_session_lock(session, job)`:
    under `capacity_guard`, if the lock still belongs to that job and its worker is DEAD (PID
    gone or reused), the job is failed and reaped and only that session's lock is released;
    the request then proceeds as a new job. Live, stalled, or mid-recovery jobs (no worker PID)
    are never taken. `release_stale_session_locks` (clean) shares the same per-lock routine.
rationale: |
  The retry was already proven on session and job records; leaving it off the other writers
  kept the same Windows failure reachable from a dozen other places. Extending the helper
  instead of only swapping the replace call removes a dozen copies of staging code, and the
  per-writer contract check keeps the error policies from shifting during the move. For the
  lock, DEAD is the one liveness signal that is unambiguous, and admission and recovery
  already serialise on `capacity_guard`, so a different request can take a dead session
  without racing the identical request's recovery.
alternatives:
  - option: Swap only each writer's os.replace call for replace_with_retry
    rejected_because: Smaller diff, but keeps a dozen hand-rolled staging copies; the maintainer chose to centralise.
  - option: Keep refusing the different request and point next_action at clean
    rejected_because: Still blocks the session behind a process that no longer exists; the maintainer chose auto-release.
  - option: Run the full `clean` from submit
    rejected_because: clean also prunes jobs, facts, knowledge and graph locks; submit must touch only its own session.
evidence: [DEC-049]
evidence_notes: |
  `tests/checks/atomic_writers.py`: helper contract (newline, fsync, mode, no temp left) and
  every migrated writer outlasting two refused replaces, then raising or swallowing a
  permanent refusal exactly as before. `tests/scenario.py` step 8: a different request on a
  dead-worker session proceeds, the old job is failed and reaped, the lock moves to the new
  job; steps 7 (live worker still refuses, identical request still recovers once, exhaustion
  still releases) unchanged. Full scenario suite PASS on Windows (223.7 s). Delegated verify:
  reviewer DONE, runtime verdict incomplete (real contention not executed); its one medium
  note — the release re-read the lock without pinning the job it had checked — was fixed by
  `expected_job_id` on `_release_if_stale`, with a scenario assert that a lock which changed
  hands is not taken.
implementation:
  version: 3.8.2
  commits: [c46d0ac]
  components:
    - core/workspace/workspace_paths.py (atomic_write_text newline/fsync, atomic_write_bytes, replace_with_retry)
    - core/evidence/fact_store.py, evidence_store.py, e2e/knowledge.py, e2e/tagging.py
    - core/graph/graph_index.py, core/provider/versions.py, core/runtime/migrations.py, core/workspace/current.py
    - config/settings.py, adapters/providers/opencode_adapter.py, installer/base.py, installer/stale.py
    - core/jobs/job_manager.py (release_dead_session_lock, _release_if_stale), core/jobs/job_lifecycle.py (submit)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    Simulated refusals and a simulated dead PID only. No real Windows contention run and no
    real dead worker on a live provider has exercised the change yet.
  runs: []
trade_offs:
  better:
    - A briefly held file no longer fails any runtime or installer write.
    - A session blocked by a dead worker is freed by the next request instead of waiting for clean.
  worse:
    - A permanently failing write in any of these writers now waits about 1.5 s before raising or being swallowed.
    - A job whose worker died loses its recovery chance as soon as a different request arrives on the session.
limitations:
  - installer/rollback.py still stages and replaces on its own without retry (outside this change's scope).
  - The opencode prompt writer is not in the held-file check; only its existing launch check covers it.
  - A PID that is alive but whose process generation cannot be verified is not DEAD, so a reused PID on such a platform keeps the session held; clean remains the path.
revisit_when:
  - A sharing-violation failure appears in any writer, including rollback.
  - A different request is observed taking a session whose worker was in fact alive.
revises: [DEC-049]
questions: [RQ-07a]
