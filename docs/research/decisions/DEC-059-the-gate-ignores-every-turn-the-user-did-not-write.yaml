schema_version: 3
id: DEC-059
title: The intent gate ignores every turn the user did not write, and a real marker still binds subagents
date: 2026-10-18
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: CASE-022, a session where native subagent hand-backs and wrapped task notifications armed the gate during /.execute
problem: |
  DEC-045 kept background-task notifications from arming the gate by skipping a prompt that starts
  with `<task-notification>`, and listed other host-generated wrappers as a known gap. In CASE-022
  the gap was hit: a native subagent's hand-back opens with "Another Claude session sent a
  message:" and an `<agent-message>` block, and notifications arrived inside a system reminder.
  Both were classified as the user's prompt, armed `delegated.marker` three times, and the gate
  then refused the main agent's own post-edit checks and every gather call of its subagents.
decision: |
  `intent-gate-set` skips a turn the user did not write, before classification: it neither arms nor
  clears a marker. A turn is not the user's when its `source` is `system`, `loop_wakeup`,
  `schedule_wakeup` or `poll_event`; when it carries `agent_id`; or when, after leading
  `<system-reminder>` blocks are removed, it is empty or opens with `<task-notification>`,
  `[SYSTEM NOTIFICATION`, `<agent-message` or `Another Claude session sent a message`. Reminder tags may carry attributes. `source`
  `user` and `sdk` stay classified, and a user prompt that mentions a shape mid-sentence still
  arms. The marker records `source`, `has_agent_id` and `prompt_id`. `intent-gate-check` is
  unchanged: a real marker still refuses a subagent's gather call, as it refuses the main agent's.
rationale: |
  The false marker was the cause; subagents were blocked only because a marker existed. The
  payload's own fields decide first because they do not depend on wording; the text shapes cover a
  host that sends neither field, which is what CASE-022 could not rule out. Keeping subagents gated
  was the maintainer's choice: a native subagent is not the default evidence path, and exempting
  `agent_id` would let the main agent route gathering around the gate through the Agent tool.
alternatives:
  - option: Exempt every tool call that carries `agent_id` in intent-gate-check
    rejected_because: The maintainer chose to keep a real marker binding subagents; the exemption opens a route around the gate.
  - option: Turn the gate off while /.execute runs
    rejected_because: /.execute has no runtime path or marker a hook could read (DEC-046).
  - option: Filter by text shapes only
    rejected_because: Wrapper text is the host's to change; the payload fields are checked first and the shapes are the fallback.
evidence: [CASE-022, DEC-045, DEC-046]
evidence_notes: |
  tests/checks/intent_gate.py (`gate-prompt-field`) runs both the .py and the bash launcher against
  tests/fixtures/hooks/host_turns.json: ten host turns, each asserted to match the NL map, neither
  arm nor clear a marker; four user turns arm it; the marker carries the provenance fields. The same
  suite fails on the hook at 3a4ba3e (`subagent hand-back` replaced the user's marker).
  `_check_subagent_stays_gated` asserts a PreToolUse call carrying `agent_id` is still refused under
  a real marker.
implementation:
  version: 3.8.4
  commits: [uncommitted]
  components:
    - dist/config/claude/hooks/intent-gate-set.py (not_user_prompt, provenance fields in the marker)
    - tests/checks/intent_gate.py, tests/fixtures/hooks/host_turns.json
    - docs/reference.md, dist/config/claude/CLAUDE.md
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    Covered by the hook tests on both launchers. One live run after install: a native subagent
    whose report matched the NL map handed back, and no marker was set. That run showed a third
    shape, the hand-back inside `<system-reminder id="...">` opening "Another Claude session sent a
    message while you were working:", which the first version of the shapes would have missed; it
    is now a fixture. Which signal held the live turn back (`source`, `agent_id` or the text) was
    not recorded, because a skipped turn writes no marker.
  runs:
    - {date: 2026-10-18, job_id: gate-handback-repro, description: subagent hand-back matching the NL map left no marker after install on Windows, clean: true}
trade_offs:
  better:
    - A subagent's report or a task notification can no longer arm or clear the gate
    - A false arming names its origin in the marker
  worse:
    - A real user prompt sent with `source` system would not arm the gate
    - A user prompt that itself opens with one of the host shapes (for example pasting an `<agent-message>` block first) would not arm the gate
    - The text shapes must follow the host's wording
limitations:
  - The shapes are those of one Claude Code version; a new wrapper is classified again until added
revisit_when:
  - A marker records a false arming with `source` user and no `agent_id`
  - Claude Code documents a dedicated field for host-generated turns
questions: [RQ-10]
revises: [DEC-045]
