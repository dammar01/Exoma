schema_version: 3
id: DEC-042
title: graphify runs without a time limit, and the refresh lock is held while its worker beats
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Maintainer decision after a CI failure in the timeout kill path; lock model chosen by the maintainer between heartbeat and process identity
problem: |
  DEC-012 bounded the detached graphify at 600 s and DEC-037 capped any override at 840 s so a
  running refresh never outlived the 900 s lock age. The bound killed a large refresh that was
  still making progress, and the kill path was the least portable part of both hooks: under
  pwsh off Windows there is no taskkill and `Process.Kill()` leaves a wrapper's child alive,
  which failed CI. Removing the bound alone would break the lock: a refresh longer than 900 s
  would read as stale, so readers would parse graph.json mid-write and the next hook would start
  a second graphify.
decision: |
  The worker waits for graphify without a limit and never kills it. While graphify runs the
  worker rewrites `beat` (and `graphify_pid`) in the lock every 15 s, token-checked and swapped
  in whole. Every reader (both hooks, `core.graph.graph_index`) holds a lock while its `beat` is
  younger than 120 s, whatever its age; a lock without `beat` keeps the old rule (live pid,
  younger than 900 s); an unreadable lock is held while its mtime is younger than 120 s.
  `GRAPH_REFRESH_LIMIT_S` is no longer read and new rows never record `timeout`; old `timeout`
  rows still count in reports. `doctor` reports the lock (state, ages, pids) and advises when a
  refresh has run an hour or the lock is stale, as a recommended fix rather than an issue.
  `clean` removes only a stale lock, re-read before the delete, and never touches a process.
rationale: |
  A heartbeat proves a live writer without process identity: no pid-reuse question and nothing
  OS-specific to implement three times (Python, Windows PowerShell 5.1, pwsh). A dead worker
  stops beating, so its lock frees itself within two minutes. The maintainer preferred a
  refresh that always finishes over a bound that protects the lock by killing graphify.
alternatives:
  - option: Process identity in the lock (pid plus start time for the worker and graphify)
    rejected_because: Identity logic would be written three times across Python, PowerShell 5.1 and pwsh, with /proc and ps fallbacks on POSIX; the maintainer chose the heartbeat.
  - option: Keep the bound and fix the tree kill under pwsh with Kill($true)
    rejected_because: The maintainer did not want a refresh to be cut off; the bound was the cause of lost refreshes on large graphs.
  - option: Raise the lock age and the bound together
    rejected_because: Still kills a refresh past the new bound and leaves the kill path to maintain.
evidence: [DEC-012, DEC-037, CASE-008]
evidence_notes: |
  `tests/checks/graph_refresh.py` (`graph-refresh`), both flavours: with `GRAPH_REFRESH_LIMIT_S=1`
  and a 3 s graphify the worker beats the lock, names graphify's pid, and records `refreshed`
  with graphify_ms above the old limit; an hour-old lock with a fresh beat is `skipped_running`;
  a lock whose beat is 300 s old is reclaimed; the three readers share one set of constants;
  doctor names an hours-long refresh as advice and a stale lock with `clean`; `clean` removes
  only stale locks (beat-less legacy, quiet beat), never an active or unreadable one. A
  delegated call during a beating lock records `refreshing`.
implementation:
  version: 3.8.1
  commits: [f23fe24587d96d7a3e950ded0b70662226c8830c]
  components:
    - dist/config/claude/hooks/graph-refresh.ps1, graph-refresh.sh (no limit, beat, lock rule)
    - core/graph/graph_index.py (refresh_lock_state, release_stale_refresh_lock)
    - core/audit/diagnostics.py (doctor reports the refresh lock)
    - main.py (clean removes a stale refresh lock)
    - docs/reference.md, docs/runtime-contracts.md
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The graph-refresh suite passes on Windows and, with pwsh 7.4, on Linux. No real refresh
    longer than the old 600 s bound and no hung graphify have been observed since the change.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only graph-refresh` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - A large graph refresh always runs to its end instead of being killed.
    - No process kill path in either hook; the pwsh-on-Linux kill failure is gone.
    - A crashed worker frees its lock within two minutes instead of fifteen.
  worse:
    - A hung graphify keeps the graph unread for as long as its worker lives; the user must stop it.
    - The worker rewrites the lock every 15 s while graphify runs.
limitations:
  - If the worker dies while graphify lives on, the lock goes stale within 120 s and graphify may still be writing graph.json.
  - A clock jump of more than 120 s makes a live lock read as stale, or a dead one as live.
revisit_when:
  - doctor reports refresh locks held for hours in real use, or a reader parses a half-written graph after a worker died.
revises: [DEC-012, DEC-037]
questions: [RQ-13]
