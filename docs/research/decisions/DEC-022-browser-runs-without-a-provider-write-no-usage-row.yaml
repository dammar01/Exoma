schema_version: 3
id: DEC-022
title: A browser run that reached no provider writes no usage row; browser rows name their stage and the browser's own time
date: 2026-10-04
status: accepted
provenance:
  type: observed
  confidence: high
  basis: CASE-014 and the maintainer's status-line report
problem: |
  A verify-browser run that ended before its review wrote a `verify` usage row with no prompt
  id, provider or tokens (CASE-014: 197 of 836 verify rows in the CASE-009 window). The status
  line counted each as a second-agent call, the report as a judged verify, and the delegated
  verify baseline as a zero-token verification. Browser review rows and ordinary verify rows
  could only be told apart by joining prompt ids, the draft counted as a reuse-eligible command
  that is never offered reuse, and the browser's own time appeared in no usage figure.
decision: |
  Usage contract version 4. `_record_usage` writes no usage or audit row for a verify-browser
  run whose call meta is empty and that was not a reuse hit; the `e2e_run` quality row and the
  `verify` task event still record it. Rows gain `e2e_stage` (`draft` or `run`) and, on a run's
  final row, `browser_seconds` (player plus existing tests). Both browser stages record
  `reuse_outcome: not_offered`. `telemetry.report` drops older rows of the provider-less shape,
  `evidence_reuse` leaves verify-browser drafts out of its denominator, and the verify baseline
  excludes browser rows by stage.
rationale: |
  A usage row is a provider invocation or a reuse hit; a run that was neither is already
  recorded where it belongs. Naming the stage on the row removes a join every reader had to
  repeat, and keeps browser time beside provider time instead of folded into it.
alternatives:
  - option: "Keep the row and mark it with a provider_call field set to false"
    rejected_because: Every existing reader (status line, report, budgets) would need to learn to skip it; the status line is a shell script outside the report.
  - option: Give every invocation of a draft its own prompt id
    rejected_because: Work units are grouped by prompt id; a draft with a repair would split into several commands.
evidence: [CASE-014]
evidence_notes: |
  `tests/checks/e2e_routing.py`: a clean draft and run write rows with their stages,
  `browser_seconds` and `not_offered`; a run ended by a harness failure writes no usage row but
  keeps its task event. `tests/checks/telemetry.py`: the legacy shape is not a call and not a
  baseline verification.
implementation:
  version: 3.8.0
  commits: [8d2d42b7260139278a57924c319155a5767ddde2]
  components:
    - core/provider/executor.py (_record_usage, verify-browser reuse outcome)
    - core/evidence/contracts.py (CONTRACT_VERSION 4, e2e_stage, browser_seconds)
    - core/audit/telemetry.py (provider_less_browser_run, evidence_reuse, verify baseline)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    The e2e-routing, telemetry and usage-tokens suites pass. Not yet observed in real use.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only e2e-routing --only e2e-metrics` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - The status line counts calls a provider answered, and the verify baseline holds only delegated verifies.
    - Browser and provider time are separate fields.
  worse:
    - The audit trail no longer has a row for a browser run without a review; it lives in quality.jsonl only.
    - The status line still counts legacy rows of the old shape in sessions recorded before the change.
limitations:
  - Legacy rows are recognised by shape, not by a field.
revisit_when:
  - Another path writes a row with no prompt id and no provider.
questions: [RQ-07a, RQ-11]
