schema_version: 3
id: DEC-055
title: Hooks and the workspace runner are bash on every OS, one Python source each, and the gate reads Bash and PowerShell with one tokeniser
date: 2026-10-18
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Maintainer decision during the OS-agnostic migration, after two weeks of field notes and the hook contract tests of DEC-054
problem: |
  Every hook shipped twice, as native PowerShell and as bash wrapping embedded Python, and the
  workspace runner was generated as run.ps1 on Windows and run.sh elsewhere. Two copies of
  each piece of logic drifted (the gate had a PowerShell AST check on one side and a
  hand-written tokeniser on the other), the installer rewrote PowerShell command strings into
  bash ones, and the gate refused task text carrying `;`, `$(` or brackets even inside single
  quotes, because it scanned the raw string before splitting it (a field note).
decision: |
  Each hook is `<hook>.sh` — a bash launcher that resolves a Python 3.10+ by running it
  (DEC-054) and execs `workflow_hooks.py <hook>` — plus `<hook>.py`, the logic, moved verbatim
  from the old embedded Python. `workflow_hooks.py` hands the payload over as CLAUDE_HOOK_RAW
  (CLAUDE_STATUSLINE_RAW) and HOOK_DIR and returns the hook's exit code. No `.ps1` ships.
  `settings.template.json` names every hook `{{HOOK_BASH}} "{{HOME}}/.claude/hooks/<hook>.sh"`;
  the installer fills `{{HOOK_BASH}}` with `bash` on POSIX and the absolute, quoted Git Bash
  path on Windows, and refuses --apply (exit 6) on Windows without Git Bash. The workspace
  runner is run.sh, inspect.sh and check.sh on every OS, with forward-slash absolute paths;
  init/upgrade delete the old .ps1 runners and doctor reports a leftover as
  `retired_leftover`. intent-gate-check reads the Bash and the PowerShell tool with one
  tokeniser: words bare or in single quotes; one plain call to
  `[bash] <root>/.workflow/{run,check,inspect}.sh` passes, `run.ps1` does not. The bundle's
  CLAUDE.md and skills call `bash '<work_dir>/.workflow/run.sh' <cmd> '<task>' '<id>'`.
rationale: |
  The `.sh` flavour already ran Python, so moving its bodies verbatim kept every hook's
  behaviour while removing the second copy; the launcher contract (exit code, stdout,
  stderr, written files) and the gate's decisions were frozen first and asserted through the
  real launchers on Windows (Git Bash) and Linux. Single-quoted words mean the same thing in
  bash and PowerShell, which is what lets one rule judge both tools; a double-quoted `$` does
  not, so it is refused. An absolute Git Bash path in settings avoids WSL's bash, which
  `bash` alone can resolve to on Windows and which cannot read a Windows path.
alternatives:
  - option: Keep native `.ps1` hooks on Windows and `.sh` elsewhere, with parity tests
    rejected_because: The maintainer chose bash on every OS; two copies keep drifting however well they are tested.
  - option: Keep a PowerShell AST check in the gate for the PowerShell tool
    rejected_because: It keeps a second parser and a PowerShell spawn per gated call; single-quoted words are read identically by both shells without one.
  - option: Leave the PowerShell tool ungated
    rejected_because: On Windows it is Claude Code's primary shell, so the gate would be open there.
evidence: [DEC-030, DEC-037, DEC-054]
evidence_notes: |
  tests/checks/hook_contract.py runs each launcher through Git Bash on Windows and bash on
  Linux (WSL Ubuntu) and asserts exit code, stdout/stderr and written files; it also runs the
  launcher with a backslash path, as Claude Code on Windows passes it.
  tests/fixtures/hooks/gate_k5.json holds 18 gate cases (the field-note false blocks among
  them), all decided as recorded by both tools. The full suite and tools/e2e/e2e.py passed on
  Windows after each step. Not yet run as an installed hook inside a live Claude Code session.
implementation:
  version: 3.8.2
  commits: [uncommitted]
  components:
    - dist/config/claude/hooks/*.sh, *.py, workflow_hooks.py (launchers, verbatim hook bodies, dispatcher; .ps1 removed)
    - dist/config/claude/hooks/intent-gate-check.py (one tokeniser for Bash and PowerShell, .sh runners only)
    - dist/config/claude/settings.template.json, installer/settings.py, installer/base.py, install.py (bash command rendering, Git Bash preflight, one target set)
    - core/audit/bundle_integrity.py, core/audit/diagnostics.py, installer/stale.py, tools/maintain/{extract_config,stamp_version,measure_graph_hook}.py
    - core/runtime/scripts.py, core/jobs/job_lifecycle.py, utils/osutil.py (bash runner only, retired_leftover, script_ext removed)
    - dist/config/claude/CLAUDE.md, dist/config/claude/skills/*.md (runner calls, interpreter choice)
    - tests/checks/{hook_contract,intent_gate,graph_refresh,task_telemetry,statusline,workflow_layout,bundle_sync,installer,installer_stale,workspace,metrics}.py, tests/fixtures/hooks/gate_k5.json, tools/e2e/{e2e_installer,e2e_integrity,e2e_delegated}.py
    - docs/reference.md, docs/runtime-contracts.md, docs/installation.md, docs/team-guide/troubleshooting.md, README.md
disposition:
  implementation_status: implemented
  validation_status: observed
validation:
  summary: |
    Observed in the test suites on Windows 11 (Git Bash 5.2) and WSL Ubuntu. A machine keeps
    running the hooks it has installed until install.py --apply runs again; that install,
    and a real session through it, have not been observed yet.
  runs: []
trade_offs:
  better:
    - One source of logic per hook and one runner flavour; no string rewrite between shells.
    - Task text may carry $, ;, |, & and brackets inside single quotes (the field-note false block).
    - The PowerShell tool is gated by the same rule as the Bash tool, with no PowerShell spawn.
  worse:
    - Windows needs Git for Windows; without it install refuses and hooks do not run.
    - A task cannot contain an apostrophe, and double-quoted arguments are refused.
    - Existing workspaces keep their run.ps1 and existing installs their .ps1 hooks until upgrade and reinstall.
limitations:
  - Measured on one Windows machine and one Linux (WSL) image; macOS bash 3.2 was not run.
  - The PowerShell tool reaches `bash` by PATH, which on some Windows machines resolves to WSL's; the skills tell the agent to use the Bash tool.
revisit_when:
  - Claude Code on Windows runs hook commands through a shell that does not accept a quoted absolute bash path.
  - Field use shows tasks needing an apostrophe often enough to want an escape.
revises: [DEC-030, DEC-037]
questions: [RQ-07a, RQ-13]
