schema_version: 3
id: DEC-046
title: New behavior goes through plan, and only the user's execute approves execution
date: 2026-10-05
status: accepted
provenance:
  type: observed
  confidence: medium
  basis: Real use of 3.8.1 in two private projects (CASE-018)
problem: |
  The NL map sent "add a feature" to plan, but a request phrased as an instruction ("make it so
  that …") was routed to execute, and execute without a plan was never refused. After a plan,
  the user's answers to its open questions were taken as approval and the agent edited 68
  times without `/.execute -y`. A request for text triggered an unrequested delegated verify,
  and one session wrote a neighbouring repository through Bash scripts.
decision: |
  Prompt contract only (`CLAUDE.md`, `skills/execute.md`, `skills/plan.md`):
  - An instruction that describes new behavior, or a list of fixes, with no active plan that
    reached `decision: proceed`, resolves to plan; a new tie-break says so. Execute only
    carries out an active plan; without one it makes no edit and suggests `/.plan`.
  - Approval is only `/.execute -y` from the user after a `proceed` plan; an execute sentence
    without `-y` shows the scope and asks for it. Answers to open questions update the plan,
    which then asks for `/.execute -y` and stops.
  - Verify runs only when the user asks for proof, or as part of `/.execute` when
    `commands.auto_verify_after_execute` is true, or after `/.refactor`; a request for a spec or
    text is answered from the evidence in context.
  - Writing to another project (Edit/Write or Bash/script) needs the user's explicit approval
    for that path.
  The hooks are not changed.
rationale: |
  Every failure was a contract the bundle already implied but did not state where the agent
  decides: the execute stanza had no "no plan" branch, and nothing said what an
  AskUserQuestion answer is. Stating it is cheap and cannot block legitimate work. Whether a
  prompt contract is enough is the open question; the next real use measures it before any
  enforcement is built.
alternatives:
  - option: Enforce in the hooks — arm the plan marker on new-feature phrasing, block Edit/Write while armed, and hold an approval marker after a plan until an execute prompt
    rejected_because: A new mechanism with false-block risk on ambiguous words ("continue", "go"), the failure shape of CASE-013 and DEC-045; deferred until the prompt contract is shown insufficient.
  - option: Hook-enforce the project-root boundary for Edit/Write
    rejected_because: The maintainer chose to record it as a limitation; Bash writes would bypass it anyway.
evidence: [CASE-018, CASE-013, DEC-021]
evidence_notes: |
  `tools/maintain/sync_intent_map.py --check` and `sync_skills.py` pass with the new NL-map
  triggers; `intent-map.json` is unchanged, so the runtime gate classifies prompts as before.
implementation:
  version: 3.8.1
  commits: [58db760da61ddc00531ec2443f71758a13bec9a2]
  components:
    - dist/config/claude/CLAUDE.md (NL map plan/execute, tie-break 4, Intent detection limits, Execution rules approval, Global Forbidden)
    - dist/config/claude/skills/execute.md (no-plan gate, approval, project-root scope)
    - dist/config/claude/skills/plan.md (STEP 3, answers are not approval)
    - docs/reference.md (prompt-layer contracts), docs/limitations.md (cross-project writes, Bash edits)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    Bundle checks pass. No real-use session has run with the new contract yet.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only execution-chain --only gate-prompt-field --only gate-runner-tamper` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - The contract now names the three gaps the agent fell through, at the point of decision.
  worse:
    - A small fix phrased as "add …" may now go through plan first, one delegated call more.
limitations:
  - Prompt-only; the same model may ignore it again, and nothing records whether it did except transcripts.
  - Cross-project writes stay unenforced and, through Bash, unrecorded.
revisit_when:
  - A real-use session again edits without a plan or without `/.execute -y`, which reopens hook enforcement.
  - Plan-first routing is reported as friction on small changes.
questions: [RQ-10]
