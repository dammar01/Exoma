schema_version: 3
id: DEC-068
title: Hooks take their payload on stdin, a fork is its own session, and only an explicit command arms the gate
date: 2026-10-20
status: accepted
provenance:
  type: observed
  confidence: high
  basis: hook failures reported by the maintainer, located in this machine's Claude Code transcripts and replayed in an isolated home
problem: |
  After the hooks moved to bash launchers (DEC-055) and gained the execute chain (DEC-067),
  real sessions between 2026-10-18 and 2026-10-20 showed:
  - A. The dispatcher put the whole payload in an environment variable. Windows refuses one
    longer than 32767 characters, so every large Edit/Write crashed task-events (151 times),
    a long prompt crashed intent-gate-set (no execute.token, no commit.marker), and a large
    Write or Bash call crashed the PreToolUse gates, which then failed open.
  - B, C. `/branch` starts a SessionStart with `source: fork`, which the shipped matcher did
    not list, so the fork was unregistered: `/.execute -y` was refused five times in a row.
    An uncommitted fix that copied the parent's MAIN_SESSION_ID to the fork made both
    windows share one runtime directory, and a prompt in one window cleared the commit
    approval the other was about to use.
  - E. status-guard matched a word list against prose and warned on every "begitu selesai,
    saya lanjut" (10 of 10 warnings in real use were future or conditional phrasing).
  - F, G. The gate refused what it was meant to pass: skill reads spelled `~/` or `/c/` or
    made with `cat`, verify's diff written `cd <root> && git diff` or `git -C <root> diff`,
    a runner task spanning lines inside single quotes, and reading a background task's
    output.
  - H. Any NL-map match armed the gate, so questions and descriptions ("saat saya analisa
    ...", a question mentioning playwright) and pasted text blocked the main agent's reply;
    an unknown prompt `source` armed markers and approvals.
  - I. A headless `claude -p` started from PowerShell could not find Git Bash, ran the hook
    commands through PowerShell (a parse error), and every PreToolUse hook blocked its tool.
  - J. `git.exe commit` skipped the commit approval.
  - K. Launchers chose Python from PATH while `run.sh` named the installer's interpreter
    (3.14 against 3.13 on this machine); no failure was traced to it.
decision: |
  - The dispatcher reads stdin as bytes, decodes UTF-8, and hands the payload to the hook
    module in memory (`runpy` init_globals); nothing goes through the environment. A hook
    that raises exits 0 and appends its traceback to ~/.claude/hook-errors.log (never beside
    the scripts: a hook run from a checkout once logged into the shipped bundle); exit 2 still
    blocks. The installer's interpreter pin is written beside the settings.json it installs,
    not under HOME, so an install into another directory leaves the real home alone.
  - SessionStart matches `fork`; session-bind gives a fork its own MAIN_SESSION_ID (the
    non-resume path) and replaces the registry atomically. The copy-the-parent diff is dropped.
  - Only a delegated command the user named arms the gate: the typed prefix or the
    slash-command payload. A prompt that only resembles one under the NL map gets an
    `[INTENT HINT]` as additionalContext and clears a pending marker. `<pasted_content>` is
    never classified. An unknown `source` counts as the user's, but its approvals need the
    command at the start of the prompt; `policies.prompt_sources` extends both lists and
    unknown labels are counted in ~/.claude/prompt-sources.json.
  - status-guard reads only the reply's `[EXECUTION RESULT]` `status` and `verification`
    fields against the values execute.md allows while verification is not_run.
  - The gate resolves `~` and MSYS spellings, passes a one-file `cat`/`Get-Content` of a skill
    or a background task's output, a newline inside single quotes, a leading
    `cd <dir in root> &&`, and `git -C <dir in root> diff` under verify.
  - The installer adds `env.CLAUDE_CODE_GIT_BASH_PATH` on Windows (the user's own value wins)
    and pins its interpreter in ~/.claude/hooks/python.path, which the launchers and the
    generated .workflow scripts both use.
  - The commit pattern accepts `git.exe` and a quoted path to git.
  Kept as it was by the maintainer's choice: a commit approval is withdrawn by any other prompt
  before the affirmative (D).
  Three older defects the verification of this change raised, fixed with it: an exit other
  than 0 or 2 (a message exit included) is logged and failed open instead of surfacing as a
  hook error; session-bind holds a sidecar lock file (O_CREAT|O_EXCL, holding the owner's
  token; released only by its owner; a lock past 10 s removed only while it still holds the
  token judged stale; a busy-delete PermissionError on Windows waited out like any held lock;
  given up after 2 s) around its read-modify-replace of the registry; a runner call passes
  only when the script, links followed, is inside the project's .workflow. status-guard
  ignores an [EXECUTION RESULT] that is quoted, fenced (an unclosed fence runs to the end) or
  named mid-sentence, and reads one opened as a list item.
rationale: |
  Each fix replaces a guess with a field something other than the model wrote: stdin is the
  documented hook input, `source: fork` is the documented SessionStart value for /branch, the
  slash-command payload is put there by Claude Code, and `[EXECUTION RESULT]` fields have a
  closed set of values the skill defines. What remains of prose — the NL map — no longer
  blocks, so its misreadings cost a hint, not a blocked turn, in any language and for any model.
alternatives:
  - option: Keep the payload in the environment and truncate it past the limit
    rejected_because: The gates would decide on a partial payload; stdin has no limit at all.
  - option: Let a fork inherit the parent's binding (read from the transcript's forkedFrom) and key approvals by Claude session id
    rejected_because: The transcript format is undocumented, and every hook, execution.py and run.sh would need the second key while execution.json stayed shared.
  - option: Keep NL arming and filter questions, quotes and pastes out
    rejected_because: The filter is a growing per-language word list and still misfires; the maintainer chose explicit arming plus hints.
  - option: Keep a prose word list in status-guard with a wider negation window
    rejected_because: The real misfires were future tense, not negation; any word list depends on language and model style.
  - option: Lock the registry with the OS byte lock (msvcrt.locking / fcntl.flock)
    rejected_because: Two branches per OS in a standalone hook that cannot import osutil; the lock file is one code path, and its only cost, an orphan lock, expires.
  - option: Write hook commands in exec form (`command` + `args`) so no shell parses them
    rejected_because: Not verified on the installed Claude Code, and the installer identifies shipped hooks by their command string; the documented Git Bash variable fixes the same failure.
evidence: [DEC-055, DEC-059, DEC-067]
evidence_notes: |
  Research charter §12 —
  research question: do hook enforcement mechanisms keep their decisions when the payload,
  the session lifecycle, the OS and the model's phrasing vary (RQ-10)?
  hypothesis: with input taken from documented fields instead of environment and prose,
  hook errors and false blocks in real use fall to near zero without losing true blocks.
  variable changed: the hook input channel, session identity of forks, the arming signal of
  the delegated gate, and the status-guard signal. experiment enabled: count hook errors,
  gate blocks and status warnings per session from transcripts before and after, the way this
  record was found. expected measurement: hook_non_blocking_error and false-block counts per
  session. why existing mechanisms are insufficient: each failed in real use (problem above).
  complexity introduced: one log file, one generated file, one optional policy key, one
  settings env key, gate lanes for cd/-C/cat/task output.
  Evidence, sanitized: a scan of this machine's Claude Code transcripts from 2026-09-21 to
  2026-10-20 (155 environment-length tracebacks; 24 gate blocks with their inputs and the
  preceding prompt; 5 execute-begin refusals in a fork; 3 commit blocks after an
  affirmative, one traced to a prompt in the parent window five seconds earlier; 10
  status-guard warnings; one PowerShell-run session), then a replay of the installed hooks
  in an isolated home: 80 checks, 31 deviating. Tests: tests/checks/hook_repro.py (called by
  suite hook-launchers), the status-guard and session-bind cases of hook_contract.py,
  gate-prompt-field in intent_gate.py.
implementation:
  version: 3.9.0
  commits: [416cf71]
  components:
    - dist/config/claude/hooks/workflow_hooks.py (stdin payload in memory, error log, exits other than 0/2 failed open; the branch-binding diff dropped)
    - dist/config/claude/hooks/*.sh (pinned interpreter first, quoted argv)
    - dist/config/claude/hooks/{execution-gate,graph-refresh,intent-gate-check,intent-gate-set,session-bind,status-guard,task-events,workflow-statusline}.py (payload from the dispatcher)
    - dist/config/claude/hooks/session-bind.py (fork source, locked atomic registry)
    - dist/config/claude/hooks/intent-gate-set.py (explicit arming, hint, paste, prompt sources)
    - dist/config/claude/hooks/intent-gate-check.py (path spellings, cat, task output, cd, git -C, quoted newlines, runner by real path)
    - dist/config/claude/hooks/status-guard.py (structured fields of the reply's own block)
    - dist/config/claude/hooks/execution-gate.py (git.exe)
    - dist/config/claude/settings.template.json (fork matcher), intent-map.json (comment)
    - installer/settings.py (Git Bash env, interpreter pin), utils/osutil.py (pinned_python)
    - dist/config/claude/skills/{execute,verify}.md, dist/config/claude/CLAUDE.md
    - docs/reference.md, docs/runtime-contracts.md
disposition:
  implementation_status: implemented
  validation_status: observed
validation:
  summary: |
    The replay matrix and the hook suites pass through the real bash launchers on Windows.
    Not yet run in a live Claude Code session: SessionStart `source: fork` firing for
    /branch, `CLAUDE_CODE_GIT_BASH_PATH` reaching a headless `claude -p` from PowerShell, and
    the [INTENT HINT] being read by the main agent are taken from the documentation.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only hook-launchers --only hook-python-resolver --only gate-prompt-field --only gate-k5-fixtures` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
    - date: 2026-10-23
      job_id: "main_agent-workflow_20261023_082642459_3c69 session"
      description: "Live use: the session ran on the stdin hook launchers; startup and resume kept one MAIN_SESSION_ID, an explicit /.verify armed the verify lane, natural-language prompts got an intent hint without arming the gate. Not clean in the CONTRACT.md sense. The maintainer decided observed on 2026-10-23."
      clean: false
trade_offs:
  better:
    - No payload size or console code page crashes a hook, and the gates decide on large payloads
    - A fork's approvals and markers are its own
    - A question or a description no longer blocks the reply; skill, verify-diff and task-output reads pass
    - status-guard warns on the same fields whatever the language or model
  worse:
    - A sentence that means a delegated command is no longer enforced by the runtime, only by the prompt layer and a hint
    - A fork starts without the parent's plan; /.execute -y there needs the plan recorded again
    - A reply that claims completion in prose without an [EXECUTION RESULT] is not warned on
limitations:
  - The background-task output path and the prompt `source` labels are undocumented by Claude Code
  - A pinned interpreter that is removed falls back to PATH; one that is upgraded in place keeps working
  - Writes through Bash or scripts are still not checked
  - The registry lock leaves one instant unguarded when a stale lock is broken, and binds unlocked after 2 s of waiting; the maintainer kept the lock file over an OS lock
revisit_when:
  - Transcripts show delegated work done without the runner after NL prompts, now that those only get a hint
  - Claude Code documents a prompt-origin field, or changes the fork or task-output layout
questions: [RQ-10]
revises: [DEC-067]
