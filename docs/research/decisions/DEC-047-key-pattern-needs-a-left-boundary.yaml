schema_version: 3
id: DEC-047
title: The openai-style key pattern needs a left boundary
date: 2026-10-05
status: accepted
provenance:
  type: observed
  confidence: high
  basis: Research file names redacted in second-agent evidence (CASE-018)
problem: |
  `sk-[A-Za-z0-9_\-]{16,}` matched inside kebab-case words: `task-events-at-turn-boundaries`
  holds "sk-" followed by more than 16 key-class characters. Second-agent evidence citing
  `DEC-021-task-events-…` and `DEC-045-task-notifications-…` came back as `ta[REDACTED:…]`, the
  anchors were lost, and the contract capped the plan's confidence to low for claims without
  file:line.
decision: |
  The pattern requires that "sk-" is not preceded by a letter or digit:
  `(?<![A-Za-z0-9])sk-[A-Za-z0-9_\-]{16,}`. A key at the start of a string, after `=`, a quote,
  a slash, whitespace or an underscore is still redacted.
rationale: |
  Real keys start a token; a word that merely contains "sk-" ("task-", "risk-", "disk-") does
  not. The boundary removes that whole class of false positives without narrowing the key body.
alternatives:
  - option: Exempt paths under docs/research
    rejected_because: The same words appear in prose and identifiers everywhere; a path list would not cover them.
  - option: Require the known prefixes (sk-ant-, sk-proj-)
    rejected_because: Narrows detection of older and other providers' keys.
evidence: [CASE-018]
evidence_notes: |
  `tests/checks/redaction.py` `redaction-boundary`: four kebab-case strings stay intact and a
  key in six contexts is redacted; the first assertion fails against the previous pattern.
  `redaction`, `adapters` and `e2e-redact` suites pass.
implementation:
  version: 3.8.1
  commits: [58db760da61ddc00531ec2443f71758a13bec9a2]
  components:
    - utils/redact.py (left boundary on the openai-style pattern)
    - tests/checks/redaction.py, tests/run.py (redaction-boundary suite)
disposition:
  implementation_status: implemented
  validation_status: not_validated
validation:
  summary: |
    Unit suite only. No delegated run has cited such a file name since the change.
  runs:
    - date: 2026-10-21
      job_id: "local suite check 2026-10-21"
      description: "`python tests/run.py --keep-going --record . --only redaction-boundary --only redaction` passed on Windows 11, inside a 52-suite local run that all passed. Implementation check only: no live Claude, provider or browser session, so it is not direct use and not a clean run in the CONTRACT.md sense."
      clean: false
trade_offs:
  better:
    - Research anchors and kebab-case identifiers survive redaction.
  worse:
    - A key glued directly to a preceding letter or digit (`abcsk-…`) is no longer redacted.
limitations:
  - Other patterns in `SECRET_PATTERNS` were not audited for the same shape.
revisit_when:
  - A key is found unredacted because it followed an alphanumeric character.
questions: [RQ-15]
