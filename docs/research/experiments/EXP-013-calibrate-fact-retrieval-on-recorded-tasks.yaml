schema_version: 3
id: EXP-013
title: Calibrate fact retrieval on recorded tasks
date: 2026-10-20
status: completed
hypothesis: H-021
version_under_test: 3.9.0

objective: |
  Whether DEC-066's floor, weights and per-role limits serve the facts a task needs.
setup: |
  The maintainer's own projects; facts.jsonl and usage.jsonl as recorded by 3.9.0. The same
  store replayed against the recorded task texts under the 3.8.4 one-token rule and the
  3.9.0 scoring.
method: |
  For each recorded exploration/reasoning call: the facts each rule would serve, and whether
  the answer cites a served fact's anchor. Compare injection rate and served-fact use rate.

  Run 2026-10-23 with tools/maintain/replay_facts.py (DEC-070): every archived exploration
  and reasoning call under --projects-root; candidates are stored facts captured before the
  call's recorded_at whose anchors still place today, the same set for both arms; a served
  fact is used when the call's output.raw.md cites its file at its line or inside a cited
  range. H-021's thresholds were frozen before the runner existed.
arms:
  - name: one-token
    description: 3.8.4 rule — any shared lowercase token of three or more characters, limit 3
  - name: weighted
    description: 3.9.0 DEC-066 scoring and limits
metrics:
  - name: injection_rate
    definition: injected facts over candidate facts, per command
    unit: ratio over work units
  - name: served_fact_use_rate
    definition: served facts whose anchor the answer cites, over served facts
    unit: ratio over facts
results:
  summary: |
    Run of record, with the committed tool (tool_commit a87fbba (+dirty: the working tree held unrelated uncommitted edits, the replay tool itself was committed), inputs 4745 files sha256 7ba73d8e07d363e4): 1576 calls across 14 projects,
    108503 candidate offers. one-token served 2440 facts, 521 cited: injection_rate 0.022,
    served_fact_use_rate 0.214. weighted served 2898, 586 cited: injection_rate 0.027,
    served_fact_use_rate 0.202. No call carried served_facts yet (recorded arm empty).
    A first run the same day with the uncommitted tool (1573 calls) gave the same figures to
    the third decimal except one-token use 0.212.
    Exploratory, not pre-registered: split at DEC-066's commit (2026-10-21), calls answered
    after one-token facts (1482) give one-token 0.214 / weighted 0.203; calls answered after
    weighted facts (91) give 0.192 / 0.195. Injection is higher for weighted in both eras.
  data_source: tools/maintain/replay_facts.py over the maintainer's projects, 2026-10-23; inputs are private (archived calls and fact stores), the output stays on the maintainer's machine
  figures:
    - {metric: replay.injection_rate@1, arm: one-token, value: "0.022 (2440 / 108503)"}
    - {metric: replay.injection_rate@1, arm: weighted, value: "0.027 (2898 / 108503)"}
    - {metric: replay.served_fact_use_rate@1, arm: one-token, value: "0.214 (521 / 2440)"}
    - {metric: replay.served_fact_use_rate@1, arm: weighted, value: "0.202 (586 / 2898)"}
interpretation: |
  By H-021's frozen rule the hypothesis is rejected on both counts: weighted retrieval serves
  more facts, not fewer, and a smaller share of them is cited. The era split does not reverse
  the direction: where answers had seen weighted facts, the two use rates are level. The per-role
  limit (4 for reasoning under DEC-066, 3 under the one-token rule) was tested afterwards as
  H-023 in EXP-016.
threats_to_validity:
  - Small store; a single maintainer's task phrasing
  - Citation is a proxy for use
  - Counterfactual store - facts evicted or pruned since a call are absent from both arms, and each answer was written after seeing whichever set its version served
  - Most calls (1482 of 1573) predate DEC-066, so the answers mostly saw one-token facts
  - Citation matching is strict (exact line or inside a cited range); a fact cited a line away counts as unused for both arms
outcome: rejected
related: [DEC-066]

disposition:
  implementation_status: not_applicable
  validation_status: not_validated
questions: [RQ-06]
