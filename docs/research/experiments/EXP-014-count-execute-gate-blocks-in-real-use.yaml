schema_version: 3
id: EXP-014
title: Count execute-gate blocks and their legitimacy in real use
date: 2026-10-20
status: completed
hypothesis: H-022
version_under_test: 3.9.0

objective: |
  How often the DEC-067 gates block, and how many blocks stopped work the user wanted.
setup: |
  The maintainer's projects after installing 3.9.0 with policies.enforcement at its default.
method: |
  For each block in a session, judge whether the user then revised the plan, approved the
  path or commit, or relaxed the gate. Count blocks, legitimate blocks and overrides.
arms:
  - name: hybrid
    description: 3.9.0 default enforcement
metrics:
  - name: blocks_per_session
    definition: execution-gate exits 2 per MAIN_SESSION_ID
    unit: count per session
  - name: false_block_rate
    definition: blocks the user resolved by relaxing the gate, over blocks
    unit: ratio over blocks
results:
  summary: |
    Run 2026-10-23. tools/maintain/export_blind_sample.py found 37 execution-gate blocks in the
    maintainer's transcripts (15 commit_unapproved, 20 outside_root, 2 outside_scope), exported
    shuffled and unlabelled. The maintainer judged every item in an interview, from the item
    alone; the key (project, transcript, time) was opened only afterwards.
    The 37 items held 28 unique events: the exporter kept copies of one block from the same
    transcript. On reanalysis, and after part of the labels were known, the maintainer chose
    the unique event as the unit and set apart blocks before 416cf71 (2026-10-20 13:04 UTC),
    the fix of per-session commit approval. Seven items carry no timestamp; each was assigned to
    the era of the episode it belongs to (same request, same minute), an inference.
    Before 416cf71: 21 events, 14 legitimate, 7 false blocks. After it (the gate as it ships):
    7 events, 2 legitimate, 4 false blocks, 1 unclear. The four false blocks after the fix are
    a commit pattern matched inside a command that was not a commit (2), a short "yes" after a
    commit request whose approval a neutral prompt in between had cleared (1), and an edit
    outside the plan the maintainer had meant to include (1). Every write into another project
    was judged a legitimate block, including writes the maintainer bypassed on purpose for an
    experiment. The hook's own log (DEC-070) held one refusal on 2026-10-23, not judged here.
  data_source: tools/maintain/export_blind_sample.py over the maintainer's transcripts, judged in an interview on 2026-10-23; items, key and labels stay on the maintainer's machine
  figures:
    - {metric: false_block_rate, arm: hybrid before 416cf71, value: "0.333 (7 / 21 unique events)"}
    - {metric: false_block_rate, arm: hybrid after 416cf71, value: "0.667 (4 / 6 judged unique events; 1 unclear)"}
    - {metric: blocks, arm: hybrid, value: "37 exported items, 28 unique events"}
interpretation: |
  H-022's frozen rule needs at least 20 judged blocks. In the unit the maintainer chose, the
  gate as it ships has 6, so the outcome is inconclusive. Counted the pre-registered way (37
  items, copies and the pre-fix era included) the rate would be 16 / 35 = 0.46, a rejection,
  but that count double-counts events and judges a gate that no longer runs. What the sample
  does show is where false blocks come from today: text matching for commits, approval cleared
  by an unrelated prompt, and scope changes that need a full re-plan. DEC-073 and DEC-075
  (drafts) propose changes for the last two.
threats_to_validity:
  - One operator; blocks must be counted from transcripts until the hook records them
  - The judge was the maintainer, who also lived the sessions; blind only to the key
  - The unit changed after part of the labels were known (deviation from pre-registration)
  - Seven untimestamped items placed in an era by inference
  - Interview questions about some items were reworded after the maintainer asked for plain wording; two early items were asked again
outcome: inconclusive
related: [DEC-067]

disposition:
  implementation_status: not_applicable
  validation_status: not_validated
questions: [RQ-10]
