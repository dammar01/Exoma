schema_version: 3
id: LIT-002
title: The Extended Mind
authors: [Andy Clark, David J. Chalmers]
year: 1998
source: "Analysis 58(1): 7-19, January 1998 (JSTOR stable 3328150); DOI 10.1093/analys/58.1.7"
relationship: conceptually_related
implementation_relationship: not_implemented
summary: |
  A philosophy-of-mind paper that argues for "active externalism": when a human organism is
  linked with an external entity in a two-way interaction, the coupled system can be a
  cognitive system in its own right, and external features that play an active role in the
  here-and-now can be part of the cognitive process. It first argues this for cognitive
  processing (mental rotation in Tetris, epistemic action) and then for belief: Otto, whose
  notebook plays the role memory plays for Inga, believes the museum is on 53rd Street before
  he consults it. It ends with the criteria that make such a coupling count, the possibility
  of cognition extended across people, and an extended self.
relevant_claims:
  - "Parity: if, as we confront some task, a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is part of the cognitive process (p. 8)."
  - "In external-media cases the individual brain performs some operations, while others are delegated to manipulations of external media (p. 8)."
  - "In a coupled system all components play an active causal role; if the external component is removed, the system's behavioural competence drops (pp. 8-9)."
  - "Reliable coupling, not portability, is what matters; occasional temporary decoupling does not remove the status (pp. 11, 15)."
  - "For Otto's notebook four features make the case clear: it is a constant in his life; its information is directly available without difficulty; on retrieval he automatically endorses it; and it was consciously endorsed in the past. The fourth is called arguable; the first three certainly play a crucial role (p. 17)."
  - "If one often acts without consulting a source, its information counts less clearly as part of the belief system; the Internet is likely to fail the criteria unless one is unusually reliant, facile, and trusting (p. 17)."
  - "Twin Otto, whose notebook holds a wrong address, walks to the wrong street: what the coupled source holds directly drives action (p. 14)."
  - "Cognition may be socially extended: one partner's beliefs can play for another the role the notebook plays for Otto, given a high degree of trust, reliance, and accessibility; the burden of coupling between agents is carried by language (pp. 17-18)."
relationship_notes: |
  A conceptual lens on the split this project measures, not a source of its design. The main
  agent hands evidence gathering to a second agent and receives text back; the paper's
  socially extended case (pp. 17-18) is the closest analogue, since the coupling between the
  two is carried by language and depends on trust, reliance, and accessibility. Its criteria
  give a vocabulary for what draft H-017 calls digest-only use: the main agent acting on the
  digest with automatic endorsement (criterion three) rather than reading the full output
  again. CASE-028 counts the opposite in real use: the full output was read whole on about half
  of the runs. The paper's Twin Otto case names the risk of the same coupling: a wrong digest
  that is trusted without checking drives the action.

  The digest-first rule, anchor certification, and confidence caps existed before this paper
  was read (2026-10-25); it is the origin of none of them. The relevant questions are RQ-01
  (net value of external exploration, and context allocation) and RQ-16 (decomposition).
limitations:
  - The full text was checked on 2026-10-25 against a copy of the published version downloaded from JSTOR. The maintainer read it briefly and discussed it with an LLM; the claims above were checked against the text by page, not taken from that discussion.
  - The DOI is the one the maintainer supplied; it is not printed on the copy read.
  - The paper concerns human cognition and is a philosophical argument, not an empirical result. It establishes nothing about language models, about whether a second agent improves a task, or about cost.
  - Its criteria are for ascribing belief; mapping them onto a main agent's use of a digest is this project's analogy, not the paper's.
  - Critiques of the thesis (for example the coupling-constitution objection) are in other literature that has not been read or recorded.
notes: |
  My interpretation, not a claim the paper makes: the maintainer's own reading is that a coupled
  tool helps thinking without itself thinking, so the thinking is cleaner because it is
  supported. The paper argues the stronger view: the rearrangement of tiles on a Scrabble tray
  "is not part of action; it is part of thought" (p. 10). The maintainer's view is closer to
  the critics' position. For this project the difference is testable rather than
  philosophical: a digest the main agent uses as a scaffold and re-checks is the weaker
  coupling; a digest it acts on without re-reading is the stronger one, and H-017 asks whether
  that stronger coupling pays.

