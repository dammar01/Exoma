schema_version: 3
id: LIT-001
title: "Raven: The Harness of Harnesses for Composable Agentic Intelligence"
authors: [EverMind AI]
year: 2026
source: "arXiv:2609.33439v1 (cs.AI, cs.CL, cs.GT, cs.MA, cs.NE), submitted 2026-09-27"
relationship: conceptually_related
implementation_relationship: not_implemented
summary: |
  Raven is an open-source multi-agent ecosystem that automatically constructs and evolves
  modular harnesses for specific models and domains, treating each executable model-harness
  pair as a composable unit of intelligence. Its Host Agent decomposes goals, matches subtasks
  to specialized agents, coordinates execution dependencies and integrates results; a host
  archive and EverOS preserve experience across tasks, and Skill Forge makes that experience
  available as reusable procedures. The paper's theory establishes sufficient conditions for
  such composition to expand reliable task coverage beyond that of the available individual
  agents under a shared resource budget, and it reports that Raven significantly outperforms
  the state-of-the-art agent systems on complex and long-horizon tasks.
relevant_claims:
  - Increasing harness complexity makes manual harness design difficult to scale, and tighter coupling to specific domains limits the generality of a single harness.
  - Composing model-harness pairs can expand reliable task coverage beyond the available individual agents under a shared resource budget, given the paper's sufficient conditions.
  - A host that decomposes goals, matches subtasks, coordinates dependencies and integrates results can be improved from experience preserved across tasks.
relationship_notes: |
  A reference for a broader abstraction than this project's: a harness of harnesses that
  constructs, evolves and orchestrates many specialized agents across domains. agent-workflow
  does not follow that direction. Its scope stays with the research charter
  (docs/research/CHARTER.md): one primary agent, a delegated specialist and a deterministic
  control plane, used to measure when one more delegated execution is still worth its tokens,
  latency, human intervention and coordination (RQ-16, RQ-17, draft H-016). Raven's broader
  scope does not invalidate that question, and matching its feature set is a charter non-goal.
  The paper was found on 2026-10-05, after every mechanism in this repository was implemented;
  it is the origin of none of them.
limitations:
  - Verified against the arXiv API metadata and the v1 abstract on 2026-10-05; the full text, its theorems and its experimental setup have not been read.
  - "Correction (2026-10-25): the maintainer gave the full text to an LLM and studied it through that discussion; the maintainer did not read it directly. The claims above still rest only on the abstract and were not checked against the full text."
  - Its gains are reported against state-of-the-art agent systems on its own tasks, not against a single agent at matched cost, so they establish nothing yet about the marginal-return threshold RQ-16 asks about.
notes: |
  My interpretation, not a claim the paper makes: its shared-budget sufficient conditions are
  the nearest point of contact with RQ-16 and could give a testable contrast for H-016 once the
  full text is read.

