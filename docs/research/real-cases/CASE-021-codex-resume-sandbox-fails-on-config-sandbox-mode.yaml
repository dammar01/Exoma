schema_version: 3
id: CASE-021
title: Codex resume fails on Windows only when the sandbox rides `-c sandbox_mode`; `exec --sandbox` before `resume` works on 0.154.0 through 0.160.0
recorded_on: 2026-10-17
visibility: public
environment: maintainer_development
repository_identity: agent-workflow
evidence_tier: controlled_experiment

context: |
  CASE-016 bisected the resume failure to codex 0.155.0 and attributed it to codex. The
  adapter's resume argv differs from a fresh call in two places: the sandbox is passed as
  `-c sandbox_mode="read-only"` instead of `--sandbox read-only`, and `-C` is omitted. Neither
  difference had been tested as a cause.
task: |
  Find whether the resume failure depends on how the adapter builds the resume argv, keeping
  the read-only sandbox and the read-deny boundary.
workflow: |
  A probe subclassed the workflow's `CodexAdapter`, kept its fresh call unchanged, and varied
  only the resume argv: one fresh thread, then one resume per variant, from this repository's
  root. Each release was installed with `npm i -g @openai/codex@<release>`; 0.154.0 was
  reinstalled at the end and `codex --version` confirmed it.
observation: |
  | Resume variant | 0.154.0 | 0.155.1 | 0.160.0 |
  | --- | --- | --- | --- |
  | current (`exec resume … -c sandbox_mode=…` + boundary) | ok | sandbox_unavailable | sandbox_unavailable |
  | `-C <root>` after `resume` | parser error (exit 2) | parser error | — |
  | `--sandbox` after `resume` | parser error (exit 2) | parser error | — |
  | `exec -C <root> resume …` (`-c sandbox_mode`) | — | sandbox_unavailable | — |
  | `exec --sandbox read-only resume …` + boundary | ok | ok | ok |
  | `exec -C <root> --sandbox read-only resume …` + boundary | ok | ok | ok |
  | current without the read-deny profile (diagnosis only) | — | ok | — |
  - Fresh threads worked on every release.
  - The failing text was CASE-015's: "elevated Windows sandbox requires effective `:root`
    read access"; the adapter tagged it `meta.reason=resume_sandbox_failed`.
  - `-C` does not matter: with `-C` before `resume` and `-c sandbox_mode` the resume still fails.
  - The failure needs both `-c sandbox_mode` and the `default_permissions` profile: dropping
    either one (the profile only as a diagnosis) makes resume work.
  - With the adapter changed to `exec --sandbox read-only resume …`, the real write probe
    (tests/checks/codex_write_probe.py, WORKFLOW_CODEX_PROBE=1) passed on 0.154.0 and 0.155.1:
    both the new and the resumed call had their shell write and file-edit refused, and neither
    file existed afterwards. On 0.155.1 the resume itself now succeeds.
evidence:
  source: |
    The probe's JSON per release (codex --version, ok, error_type, reason, returncode, last
    300 characters of stderr, the resume argv with the boundary and paths elided), run on
    2026-10-17 on the maintainer's Windows 11 machine.
  counted_by: main agent
  counted_on: 2026-10-17
outcome: positive
unexpected_behavior:
  - "`--sandbox` is accepted as an `exec` option before the `resume` subcommand although `resume` itself rejects it; the adapter's 0.147.0 note only tested it after `resume`."
limitations:
  - One machine, one Windows build, one probe per variant and release.
  - The write probe ran on 0.154.0 and 0.155.1 only, not on 0.160.0.
  - Whether codex applies the read-deny profile on the new argv is not observable; the boundary is declared, not enforced (adapter docstring).
  - That `exec` accepts `--sandbox` before `resume` is observed parser behavior, not a documented contract; a later codex release may change it.
related: [CASE-015, CASE-016, DEC-024, DEC-028]
related_notes: |
  Revises CASE-016's attribution: the regression is real from 0.155.0, but it is reached only
  through the adapter's `-c sandbox_mode` resume argv; an argv the CLI also accepts avoids it.

