schema_version: 3
id: CASE-026
title: 'The "inline credential" redaction rewrites `"password": "${E2E_PASS}"` inside the draft scenario JSON, so every draft with a password fill ends `spec_invalid`'
recorded_on: 2026-10-22
visibility: public
environment: private_production
repository_identity: undisclosed
evidence_tier: creator_observation

context: |
  A private Next.js web project used agent-workflow 3.9.0 with codex as second_agent and an
  existing `e2e` section in `.workflow/config.json` (local frontend, loopback backend origin,
  `secrets_profile` set, `.workflow/e2e/secrets.json` present). The change under test was a
  company-registration form: the scenario has to create a new account, so it must fill the
  password and password-confirmation fields of a registration form, then log in with them.
task: |
  `/.verify-browser` on the registration flow: fill the form (password via `${E2E_PASS}`, as the
  skill requires), submit, assert the pending-approval screen, then log in and assert the
  pending-approval error.
workflow: |
  `.workflow/run.sh verify-browser` in phase `draft`: codex writes `[E2E SPEC]` plus a
  `scenario_json` block, the runtime parses and validates it, runs one automatic repair, and
  reports `ready` or `invalid`.
observation: |
  Three consecutive drafts (one with a wide task, two with a narrowed task with explicit claim
  ids) ended `status: invalid`, `reason: spec_invalid`, `diagnosis.cause: draft_invalid`,
  `first_error: json_invalid` (first draft also reported 4 `claim without id` errors), and the
  one repair attempt did not recover any of them.

  In every `output.raw.md` the scenario block contains the line
  `[REDACTED:inline credential],` where codex had written the fill value
  `"password": "${E2E_PASS}"`. The redaction replaces the key together with its value, leaving a
  bare token inside a JSON object, which is exactly the reported parse error
  ("Expecting property name enclosed in double quotes"). Counted markers per draft: 3, 2, 2.

  Cause in source: the `inline credential` pattern in `utils/redact.py` matches a key named
  `password` followed by any quoted value of 6+ characters. The placeholder `${E2E_PASS}` is 11
  characters, and the pattern has no exclusion for `${NAME}` placeholders, even though the
  verify-browser contract requires exactly that form for password fills. So the safest possible
  spelling of a password fill is the one that is guaranteed to be destroyed. Any scenario that
  fills a password through a key named `password` cannot reach `ready`.

  Second, less certain observation: all three drafts also reported
  `secret_literals: {task: [E2E_PASS]}` with the warning "credential value(s) typed out literally
  in task". Only the first task contained a literal password-like string; the second and third
  tasks contained only the placeholder `${E2E_PASS}`. `scrub_literals` matches secrets.json values
  by substring, so a short or common credential value in some profile may be matching ordinary
  task words. The secrets file was not opened to confirm which value matched.

evidence:
  source: |
    `.workflow/data/sessions/<session>/logs/<ts>_e2e_spec_*/output.raw.md` of the three drafts
    (grep count of `REDACTED:inline credential`), the runner JSON of each draft
    (`meta.e2e.draft.status`, `errors`, `meta.e2e.diagnosis`, `meta.e2e.secret_literals`,
    `config_warnings`), and the `inline credential` regex in `utils/redact.py`.
  counted_by: maintainer
  counted_on: 2026-10-22
  notes: |
    Which code path applies `utils/redact.py` to the provider output before the scenario JSON
    is parsed was not traced; the effect is visible in `output.raw.md`. The secret_literals
    observation is unconfirmed (secrets file deliberately not read).

outcome: negative
unexpected_behavior:
  - The credential redactor fires on the `${E2E_PASS}` placeholder the skill mandates, not only on literal values.
  - 'Redaction substitutes the whole `"key": "value"` pair, producing invalid JSON instead of a valid redacted value.'
  - The diagnosis names `json_invalid` and suggests fixing the scenario or narrowing the task; neither can help, because the breakage is introduced after the agent wrote valid JSON.
  - "`secret_literals` reports a typed-out E2E_PASS in tasks that contain only the placeholder (unconfirmed)."
limitations:
  - One project, one provider, three drafts within about four minutes.
  - Only a key literally named `password` was observed; `passwd`/`secret` keys share the same pattern but were not exercised.
  - The secret_literals false positive is inferred from task text, not from the secrets file.
related: [CASE-005]
related_notes: |
  CASE-005 recorded drafts that never reached `ready` for other reasons; this is a separate,
  deterministic cause that blocks every scenario with a password fill.

implementation:
  version: 3.9.0
  feature: verify-browser draft parsing and the shared inline-credential redaction pattern

disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-07a]

# Possible follow-ups (not decisions): exclude `${NAME}` placeholders (at least the registered
# CREDENTIAL_KEYS) from the inline-credential pattern; redact only the value and keep the key and
# quotes so JSON stays parseable; run the redactor after scenario_json is parsed, on values only;
# have the diagnosis report `redaction_broke_json` when a REDACTED marker sits at the parse error;
# require a minimum length / word boundary for scrub_literals matches.
