schema_version: 3
id: CASE-027
title: '`/.provider` catalog read (`run.sh provider ''''`) flashes CMD console windows on Windows'
recorded_on: 2026-10-22
visibility: public
environment: private_production
repository_identity: undisclosed
evidence_tier: creator_observation

context: |
  A Python automation project on Windows 11 used agent-workflow 3.9.0 with codex as second_agent.
  All three providers (agy, codex, opencode) were installed; codex and opencode resolve to `.cmd`
  shims under the nvm4w Node directory, agy to a native `.exe`. Claude Code ran the command through
  its Bash tool (Git Bash).
task: |
  Run `/.provider` without arguments to open the interactive picker.
workflow: |
  STEP 1 of the provider skill calls
  `bash '<root>/.workflow/run.sh' provider '' '<MAIN_SESSION_ID>'`. The runtime builds
  `meta.providers[]` with `models_source: live` for all three providers, which reads each CLI's
  model list (`core/provider/model_catalog.py`: `_run_list` for `opencode models` and `agy models`,
  `_read_codex` for codex) and resolves each provider command on PATH.
observation: |
  While that call ran, the user saw CMD console windows flash on screen. The call itself succeeded
  (`ok: true`, catalog complete for all three providers). The later apply call
  (`run.sh provider 'codex|gpt-6-luna|medium|same'`) was not reported as flashing; this was not
  checked explicitly.

  `utils/osutil.run_bounded`, which `_run_list` uses, already passes `hidden_run_kwargs()`
  (`STARTF_USESHOWWINDOW` + `SW_HIDE`, `CREATE_NO_WINDOW | CREATE_NEW_PROCESS_GROUP`), so the
  direct child should not get a visible console. Which process actually opened the window was not
  identified.

evidence:
  source: |
    User report in the session (visual observation, no screenshot). Runner JSON of the catalog call
    (`meta.providers[].models_source: live`, `installed: true` for agy/codex/opencode, `detail`
    paths: agy `.EXE`, codex and opencode `.cmd`). Code read at agent-workflow commit 073eb82:
    `utils/osutil.py` `hidden_run_kwargs` and `run_bounded` (Popen with `**hidden_run_kwargs()`),
    `core/provider/model_catalog.py` `_run_list`.
  counted_by: maintainer
  counted_on: 2026-10-22
  notes: |
    Number of flashes and their duration were not counted. No process trace (e.g. Process Monitor)
    was taken.

outcome: negative
unexpected_behavior:
  - A read-only, local command spawns visible console windows despite the hidden-window helper.
  - The flashes steal focus / distract during an interactive picker that is meant to be quiet.
limitations:
  - One machine, one run, visual report only; not reproduced on demand.
  - Cause not isolated; candidates below are hypotheses, not findings.
  - Not checked whether `doctor` (which also reads provider state) flashes the same way.
related: []

implementation:
  version: 3.9.0
  feature: provider catalog (live model listing) behind `/.provider` STEP 1

disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-07a]

# Hypotheses to test (not decisions):
# - A grandchild escapes CREATE_NO_WINDOW: the `.cmd` shim runs node, and node (or the CLI it
#   starts, e.g. a native codex/agy binary or a version/update check) spawns its own process with
#   a new console. CREATE_NO_WINDOW on the shim does not bind what node spawns with
#   `detached`/`windowsHide: false`.
# - Some catalog path spawns outside `run_bounded` (codex model read, a `--version` probe, PATH
#   resolution via `where`/`cmd /c`) without `hidden_run_kwargs`.
# - `bash` itself (Git Bash launched by the runner chain) allocates a console when the parent has
#   none.
# Test: run the catalog call under Process Monitor (Process Create events, filter conhost.exe) to
# name the parent of each console; then compare live listing off vs on
# (`model_catalog.live_enabled`) to confirm the flash comes from live listing.
