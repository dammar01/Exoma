schema_version: 3
id: CASE-022
title: Native subagent hand-backs armed the intent gate during /.execute and blocked the main agent and its subagents
recorded_on: 2026-10-18
visibility: public
environment: maintainer_development
repository_identity: undisclosed
evidence_tier: creator_observation

context: |
  Auto-intent mode on Windows, Claude Code main agent, codex as second_agent. During an approved
  /.execute the main agent ran four native subagents in the background to translate documentation.
task: |
  Translate ten documentation files and then check the result (line counts, code blocks, links)
  as part of the same /.execute.
workflow: |
  `intent-gate-set` classifies every UserPromptSubmit `prompt` against the NL map and arms
  `delegated.marker` on a delegated match; `intent-gate-check` then refuses gather tools until
  `.workflow/run.sh` runs. DEC-045 skipped only a prompt starting with `<task-notification>`.
observation: |
  Each subagent's hand-back reached the session as a new turn opening with
  "Another Claude session sent a message:" and an `<agent-message>` block, and background-task
  completions arrived wrapped in a system reminder. Their text (agent reports naming verify,
  Playwright, audit) matched the NL map. The marker changed intent three times (verify,
  verify-browser, analyze) without a user prompt. Two subagents could not run grep or read their
  own output and reported it; one rewrote a 1369-line file in a single write instead of checking
  it. The main agent's own post-edit checks were refused with exit 2. The work resumed only after
  the user deleted the marker by hand; an attempt to use the documented escape was stopped by the
  host's permission classifier.

evidence:
  source: |
    The session's gate refusal message (intent=DELEGATED (analyze)), the two subagent reports that
    named the marker intents, and dist/config/claude/hooks/intent-gate-set.py at 3a4ba3e, whose only
    provenance check was `prompt.lstrip().startswith("<task-notification>")`.
  counted_by: maintainer
  counted_on: 2026-10-18
  notes: |
    The marker keeps no history, so the exact payload fields (`source`, `agent_id`) of the
    triggering turns were not captured.

outcome: negative
unexpected_behavior:
  - A real marker was never set; every arming came from host-written turns
  - The gate blocked native subagents through the main session's marker
limitations:
  - One session on one OS; the payload fields of the triggering turns were not recorded
related: [DEC-045, DEC-059]
related_notes: |
  DEC-045 fixed the same class for one notification shape; DEC-059 widens the check.

implementation:
  version: 3.8.4
  commits: [3a4ba3e]
  feature: intent gate (intent-gate-set)

disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-10]
