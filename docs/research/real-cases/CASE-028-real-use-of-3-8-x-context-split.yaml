schema_version: 3
id: CASE-028
title: Real use of 3.8.2 — context kept out of the main agent, read back, and task outcomes
recorded_on: 2026-10-25
visibility: sanitized
environment: private_production
repository_identity: undisclosed (two private projects of one maintainer, a backend and a web frontend; agent-workflow itself excluded)
evidence_tier: creator_observation
confidentiality_note: |
  No project name, prompt, task text, file path, or code is recorded here. The projects are
  described only by kind. Figures are the aggregates of a local draft data directory whose
  inputs are private transcripts, usage streams, and git history.

context: |
  CASE-011 and CASE-012 counted real use of 3.6.0 and 3.7.3. Release 3.8.2 kept the same split
  of work: the second agent gathers evidence, the main agent reasons, edits, and decides. The
  question here is narrower than "did 3.8.2 work": how much material the split kept out of the
  main agent, how much came back to it, whether the main agent read the delegate's full output
  anyway, and what the tasks' outcomes and follow-ups were in the same period. The figures were
  first counted on 2026-10-09 as working data for drafts and are recorded here because later
  research notes started quoting them without their scope.

task: |
  Everyday feature and bug work on two private projects, a backend and a web frontend.

workflow: |
  Global bundle 3.8.2 in every session; delegated explore/analyze/plan/verify through
  `.workflow/run` as background jobs; the digest is read first and the full output is opened
  when the main agent decides it needs it (not enforced by the runtime); implementation by the
  main agent (`/.execute -y`).

observation: |
  3.8.2, 13 coding tasks (outcome rule of CASE-012):

  Outcomes:
  - 9 solved (0.692), 6 solved clean (0.462), 3 solved but fixed within 24 hours, 2 partial,
    2 not in main.
  - Medians per task: 15 prompts, 68.8 active minutes, 6 delegated calls; all 13 tasks
    delegated.
  - Follow-up prompts per task by kind: verify 3.4, execute 3.2, other 2.9, question 2.3,
    fix 1.8, plan 1.0, change request 0.8, explore/analyze 0.5.

  Context (tokens; `saved` is the second agent's fresh input less what returned to the main
  agent, estimated at four characters per token):
  - Main-agent final context: median 258,242, p90 335,111; largest peak 550,108.
  - Second agent's fresh input: median 1,030,698 per task.
  - Returned to the main agent: median 14,634 per task.
  - Saved: median 1,020,526 per task, 3.9 times the main agent's final context; no task was
    partly estimated.

  Reading back (25 sessions of 3.8.2 on all projects, counted per session):
  - 123 delegated runs in 20 delegating sessions; the delegate's output file was read whole
    67 times (0.54 per run).
  - 777 gathering tool calls by the main agent (reads, searches, MCP queries, read-only shell),
    766 of them after the session's first delegated run.
  - 7 native subagent calls; 1 session in local mode.

  Separately, 3.8.1 (5 tasks, 13 sessions, 2026-10-04 .. 06) was the maintainer's smoothness
  testing, not task work: saved median 309,484, returned median 5,690, whole reads 21 of 26 runs.
  It is not part of the figures above.

evidence:
  source: |
    `docs/research-drafts/_data/real-use-3.8.2-2026-10-09/outcomes.json`, block
    `by_version."3.8.2"`: output of `tools/maintain/measure_task_outcomes.py` at commit
    bb89223 (`params.versions` 3.8.1 and 3.8.2, `solved_share` 0.8, `partial_share` 0.3,
    `fix_hours` 24, `search_days` 30, `idle_minutes` 15; inputs 29 files, sha256
    c031aea7...e339c79, generated 2026-10-09T03:24:44Z). `saved` is
    `saved_net` (tools/maintain/measure_task_outcomes.py): fresh input (input minus cache read)
    of every usage row, less `response_chars // 4`.

    Reading-back figures: `behave_all.json` in the same directory (produced by `behave_all.py`
    there), rows with `ver` 3.8.2 summed over `runs`, `out_full_reads`, `gather_pre`,
    `gather_exec`, `gather_after_run`, `native_agents`, `local_mode`. A whole read is a `Read`
    of a background task's `.output` file with no `limit` or `offset`.

    The directory is git-ignored working data; its inputs are on the maintainer's machine only,
    so a recount is possible there and nowhere else (the provenance block of `outcomes.json`
    says so).
  counted_by: main agent
  counted_on: 2026-10-09
  notes: |
    The session sums from `behave_all.json` were added by the main agent on 2026-10-25 from the
    same file; nothing was re-run. The 3.8.1 figures come from `by_version."3.8.1"` and the
    3.8.1 rows of `behave_all.json`.

outcome: inconclusive
unexpected_behavior:
  - "`behave_all.json` has a `digest_only` field that is 0 in every session, but `behave_all.py` only initialises it and never sets it; it is not a measurement. Whether any run was used from its digest alone is therefore not counted."
  - "The aggregate `all` block of `outcomes.json` (18 tasks) and its `by_project` and `by_delegated_calls` blocks pool 3.8.1 smoothness testing with 3.8.2 work; a per-project median of about 973k saved tokens quoted in later notes comes from such a pooled block."
  - "`tasks_detail.json` in the same directory counts 15 tasks for 3.8.2 and 6 for 3.8.1, against 13 and 5 in `outcomes.json`; the two scripts label tasks differently and were not reconciled."
limitations:
  - One maintainer, two projects, 13 tasks; not a general result.
  - "`saved` counts what the second agent read, not what the system saved: the second agent's tokens are spent either way, and the main agent might not have read the same material itself. It is a context-allocation figure, not a cost figure."
  - No arm without delegation and no digest-only arm; nothing here says the split improved or worsened outcomes.
  - A whole read is counted only through `Read` of the output file; reads through a shell command or the task notification are not counted, so 0.54 per run is a lower bound.
  - Gathering after the first delegated run is counted per session, not per run, so it does not say whether the gathering repeated the delegate's evidence.
  - Task labels (category, tier) are heuristic labels by the main agent that the maintainer has not checked.
  - "Not comparable with CASE-011 as a version comparison: the 3.7.3 figures in the same directory (`out373.json`) are a different snapshot with a different task set."
related: [CASE-011, CASE-012]
related_notes: |
  CASE-012 defines the task outcome rule used here; CASE-011 is the 3.7.3 baseline of the same
  maintainer. The drafts H-013 (a later version against that baseline), H-016 (diminishing
  return of decomposition) and H-017 (a low primary context through delegation) use the same
  draft data; H-017 states that its treatment, digest-only use, did not occur.

implementation:
  version: 3.8.2
  commits: [bb89223]
  feature: delegated evidence with digest-first reading by the main agent, in daily use

disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-01, RQ-02]
