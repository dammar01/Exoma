title: Latency is a recurring complaint
recorded_on: 2026-09-26
visibility: public
environment: private_production
repository_identity: undisclosed
evidence_tier: team_observation
confidentiality_note: |
  Complaints reported to the maintainer; no latency data collected. The original draft graded
  the evidence as anecdotal.
context: |
  Same team and period as CASE-001 (archived draft).
task: |
  Everyday feature and maintenance work.
workflow: |
  Delegated commands (explore, analyze, plan, verify) run the secondary agent, which reads the
  repository before returning evidence.
observation: |
  Several team members complained that delegated requests were slow compared with asking the
  coding agent directly.

  No duration was measured in the team's workspaces. For the maintainer's own measured
  latency, see CASE-004; it is not team data.
evidence:
  source: |
    Informal complaints. No report output (time_to_completion_seconds) was collected from team
    workspaces.
  counted_by: not counted; complaints reported informally to the maintainer
  counted_on: 2026-09-26
outcome: inconclusive
unexpected_behavior:
  - None identified. The duration is the secondary agent doing its work, not a hang or retry that was observed.
limitations:
  - 'Complaints only: no durations, task sizes, or counts of complaints were recorded.'
  - This record states what was reported, not why latency was or was not acceptable.
related: [CASE-004]
related_notes: |
  CASE-004 is the maintainer's latency distribution (creator observation, not team data).
  CASE-001, H-001 and EXP-002 (archived drafts) also relate to this case.
