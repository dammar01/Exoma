schema_version: 3
id: CASE-024
title: An explore reported every anchor certified while citing files that do not exist
recorded_on: 2026-10-20
visibility: public
environment: maintainer_development
repository_identity: undisclosed
evidence_tier: creator_observation

context: |
  A feature-mapping session on this repository ran six delegated explores in one session,
  each returning around forty or more `file:line` citations.
task: |
  Map the repository's features, then map the code behind each feature cluster.
workflow: |
  `/.explore` through `.workflow/run.sh`; the main agent read `digest.anchors` first, as
  the shipped contract tells it to, and opened full evidence only on a gap.
observation: |
  One explore cited three paths that do not exist in the tree (a provider registry and two
  adapters under a directory they had moved out of years before). Its digest read
  `anchors: {certified: 40, total: 40}`, the uncapped state. All six explores reported a
  total of exactly 40. The main agent found the bad paths only by checking them with a file
  search. The cause, read from the source: the anchor scan stopped at its 40-anchor storage
  limit, returned `complete: false`, and the executor computed the ratio from the stored
  prefix without reading that flag, so `40/40` meant "the first forty checked". Every one of
  the six digests also had its confidence capped to medium by the same reason, a non-empty
  `scope_not_covered` that listed only live provider and browser state.
evidence:
  source: |
    The session's delegated result JSON (digest.anchors, digest.confidence_capped_by) for six
    explores and two analyzes; core/evidence/evidence_store.py `_extract_anchors` and
    core/provider/executor.py at the evidence-record step, as of 3.8.4.
  counted_by: maintainer
  counted_on: 2026-10-20
outcome: negative
unexpected_behavior:
  - A ratio presented as the whole run's certification described a prefix of it
  - A confidence cap that fired on every run carried no information
limitations:
  - One session on one repository; how often citations exceed 40 elsewhere is not counted
  - Only three bad citations were found, because only those were checked by hand
related: [DEC-064]
implementation:
  version: 3.8.4
  feature: evidence anchor certification and the scope_not_covered confidence cap
disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-01]
