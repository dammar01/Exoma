schema_version: 3
id: CASE-025
title: 'Codex "Selected model is at capacity" reaches the runtime as a silent `codex exited 1` with `error_type: unknown`'
recorded_on: 2026-10-22
visibility: public
environment: private_production
repository_identity: undisclosed
evidence_tier: creator_observation

context: |
  A small Python MCP server project used agent-workflow 3.9.0 with codex as second_agent. Every
  route (explore, plan, analyze, verify, e2e_spec) was configured to the same codex model in
  `.workflow/second_agent.json`. Earlier delegated calls in the same main session succeeded and
  resumed one provider thread.
task: |
  Run `/.verify` on a documentation migration (record YAML + guide Markdown + pytest validator).
workflow: |
  `.workflow/run.sh verify` dispatched the job, resumed the existing codex thread, and would have
  run the selected test command after the agent phase.
observation: |
  Two consecutive verify jobs (identical command, task and session) failed the same way: codex
  returned exit code 1 after about 6.2 seconds, `stderr_tail` was empty, `response_chars` was 14
  (the literal text `codex exited 1`), `timed_out` was false, and the runtime classified the result
  as `error_type: unknown` with `next_action` "Inspect .workflow/data/sessions/<session>/logs for the
  raw JSONL events and rerun." The session log folder held no JSONL events and no provider message,
  so following `next_action` did not reveal the cause. The selected test command never ran, so no
  runtime test outcome was recorded.

  The main agent, lacking a signal, hypothesised a full or corrupted resumed thread. That
  hypothesis was wrong. The user ran codex directly and saw the real cause in the interactive UI:
  "■ Selected model is at capacity. Please try a different model". The runtime had no field that
  carried this message, so neither the main agent nor the hard-gate warning could name it or
  point to the obvious remedy (switch model via `/.provider`, or wait).

evidence:
  source: |
    `.workflow/data/sessions/<session>/logs/<job>_verify_*/call.meta.json` of both failed jobs:
    fields returncode, duration_seconds, stderr_tail, response_chars, timed_out, resumed,
    provider_version (codex-cli 0.163.0); `output.raw.md` (content `codex exited 1`); the runner
    JSON (`ok: false`, `error_type: unknown`, `next_action`). Provider message as reported by the
    user from a direct codex run.
  counted_by: maintainer
  counted_on: 2026-10-22
  notes: |
    The capacity message was observed by the user outside the runtime; it was not captured in any
    runtime artifact. Whether codex prints it to stdout, stderr, a TTY-only surface, or not at all
    under `exec --json` was not tested.

outcome: negative
unexpected_behavior:
  - A provider-side capacity error is indistinguishable from any other exit 1 in the runner result.
  - "`next_action` points to logs that contain nothing about the failure."
  - The main agent filled the missing signal with a wrong hypothesis (thread exhaustion).
limitations:
  - One project, one provider, one model, two jobs within about one minute.
  - The provider message came from the user's direct run, not from the failed jobs.
  - Not tested whether other codex errors (auth, quota, rate limit) share the same silent path.
related: [CASE-016, CASE-021]
related_notes: |
  CASE-016 and CASE-021 are other codex resume/exit failures on Windows; this one is a
  provider-capacity failure that surfaces through the same opaque exit path.

implementation:
  version: 3.9.0
  feature: codex adapter error classification and the proxy-failure hard gate

disposition:
  implementation_status: implemented
  validation_status: observed
questions: [RQ-07a]

# Possible follow-ups (not decisions): capture codex stdout/JSONL error events into stderr_tail or
# a provider_message field; classify "at capacity" (and similar) as error_type=provider_capacity
# with next_action "switch model via /.provider or retry later"; consider a per-route fallback
# model in second_agent.json.
