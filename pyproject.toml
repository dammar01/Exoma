[project]
name = "exoma"
# Stamped from TOOL_VERSION in src/exoma/config/settings.py by tools/maintain/stamp_version.py.
# uv_build reads only a static version, so this line is a copy, never the source.
version = "0.1.0"
description = "External control plane for coding agents: a secondary agent gathers repository evidence while the primary agent reasons and implements."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# The runtime is stdlib-only (tests/checks/deps.py); anything third-party is an extra.
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]

[project.optional-dependencies]
# Browser verification (/.verify-browser). Same pin as the bundled requirements-e2e.txt,
# which `exoma install --with-e2e` installs before `playwright install chromium`.
e2e = ["playwright==1.60.0"]

[project.urls]
Repository = "https://github.com/dammar01/Exoma"

[project.scripts]
exoma = "exoma.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"
